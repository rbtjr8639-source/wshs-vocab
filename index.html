 (~ 없이)"], ["파생어", "absent ⓐ 결석한, 없는"]], "c": ["in the absence of (~이 없을 때, ~이 없는 상황에서)", "after long absences (오랫동안 떨어져 있다가)", "approve absences (결석을 승인하다)"], "s": [["even in the absence of acceptance by other scientists", "다른 과학자들의 인정이 없는 상황에서도", "본문", ""], ["In the absence of threat, natural selection tends to resist change.", "위협이 없을 때 자연 선택은 변화에 저항하는 경향이 있다.", "2021-평가원-6월", ""], ["Likewise, the absence of hominin fossil evidence at a particular time or place does not have the same implication as its presence.", "마찬가지로, 특정한 시기나 장소에 인류 화석 증거가 없다는 것은 그것이 있다는 것과 같은 의미를 갖지 않는다.", "2021-평가원-6월", ""]]}, {"w": "account", "ipa": "əˈkaʊnt", "m": "ⓝ 설명, 해명; 계좌; 이야기 ⓥ (~ for) 설명하다, 차지하다", "d": [["ⓝ", "a description or explanation of something", "어떤 것에 대한 묘사나 설명"], ["ⓥ", "to explain the reason for something; to form a particular amount (account for)", "어떤 것의 이유를 설명하다; 특정한 양을 차지하다(account for)"]], "et": "ad (~에) + computare (계산하다) → 고대 프랑스어 aconter (세다)", "ex": "셈하여 밝히다", "g": [["유의어", "explanation (설명), description (묘사), explain (설명하다)"], ["관련어", "understanding (이해)"], ["파생어", "accounting ⓝ 회계; 설명, accountant ⓝ 회계사, accountability ⓝ 책임"]], "c": ["a complete accounting of (~에 대한 완전한 설명)", "account for (~을 설명하다, ~을 차지하다)", "take into account (~을 고려하다)"], "s": [["The key point is that we can build useful models at one level of analysis without a complete accounting of what's happening at all other levels.", "핵심은 우리가 다른 모든 수준에서 일어나는 일을 완전히 설명하지 않고도 하나의 분석 수준에서 유용한 모델을 만들 수 있다는 것이다.", "본문", ""], ["A black-and-white view cannot account for the variety of burnout experience, though.", "그러나 흑백 논리의 관점으로는 번아웃 경험의 다양성을 설명할 수 없다.", "2025-평가원-6월", ""], ["Subscriptions account for almost 90 percent of total magazine circulation.", "정기 구독은 전체 잡지 발행 부수의 거의 90퍼센트를 차지한다.", "2018-수능", ""]]}]}, {"q": "35", "t": "무관한 문장", "items": [{"w": "recognition", "ipa": "ˌrekəɡˈnɪʃn", "m": "ⓝ 인정, 인식; 알아봄", "d": [["ⓝ", "the act of accepting that something is true, important, or official; the act of knowing someone or something you have seen before", "어떤 것이 사실이거나 중요하거나 공식적임을 받아들임; 전에 본 사람이나 것을 알아봄"]], "et": "re (다시) + cognoscere (알다) + -tion", "ex": "다시 알아봄", "g": [["유의어", "acceptance (인정, 수용), classification (분류), awareness (인식), identification (식별)"], ["반의어", "denial (부정), ignorance (무지)"], ["파생어", "recognize ⓥ 알아보다, 인정하다, recognizable ⓐ 알아볼 수 있는"]], "c": ["recognition as (~로서의 인정)", "national and international recognition (국내외적 인정)", "facial recognition (얼굴 인식)"], "s": [["The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health.", "2019년 세계보건기구(WHO)가 번아웃을 직업 관련 현상으로 인정한 것은 직장 내 정신 건강에 관한 담론에서 중요한 순간이었다.", "본문", ""], ["In 1895, he published the second book, Majors and Minors, which brought him national and international recognition.", "1895년에 그는 두 번째 책인 『Majors and Minors』를 출간했고, 그 책으로 국내외적인 인정을 받았다.", "2021-고1-교육청-9월", ""], ["To clarify, familiarity (or recognition) is when you encounter someone or something and you know you've done so before.", "분명히 말하자면, 친숙함(또는 알아봄)이란 어떤 사람이나 사물을 마주쳤을 때 전에 그런 적이 있다는 것을 아는 것이다.", "2025-고2-교육청-3월", ""]]}, {"w": "burnout", "ipa": "ˈbɜːrnaʊt", "m": "ⓝ 번아웃, (심신의) 극도의 피로", "d": [["ⓝ", "a state of extreme physical and mental tiredness caused by too much work or stress", "과도한 일이나 스트레스로 인한 극도의 신체적·정신적 피로 상태"]], "et": "burn (타다) + out (완전히)", "ex": "다 타 버려 남은 것이 없는 상태", "g": [["유의어", "exhaustion (탈진)"], ["관련어", "stress (스트레스), burned out (기진맥진한)"]], "c": ["recover from burnout (번아웃에서 회복하다)", "lead to burnout (번아웃으로 이어지다)"], "s": [["The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health.", "2019년 WHO가 번아웃을 직업 관련 현상으로 인정한 것은 직장 정신 건강에 관한 담론에서 중요한 순간이 되었다.", "본문", ""], ["These critics maintain that empathy can be exhausting and lead to burnout or insensitivity to suffering.", "이 비평가들은 공감이 사람을 지치게 하고 번아웃이나 고통에 대한 무감각으로 이어질 수 있다고 주장한다.", "2025-고2-교육청-9월", ""], ["In most public discussion of burnout, we talk about workers who \"are burned out,\" as if that status were black and white.", "번아웃에 관한 대부분의 공개 논의에서 우리는 마치 그 상태가 흑과 백으로 딱 나뉘는 것처럼 '번아웃된' 노동자들에 대해 이야기한다.", "2025-평가원-6월", ""]]}, {"w": "occupational", "ipa": "ˌɑːkjuˈpeɪʃənl", "m": "ⓐ 직업의, 직업과 관련된", "d": [["ⓐ", "relating to a person's job", "사람의 직업과 관련된"]], "et": "occupation (직업, 점유) ← 라틴어 occupare (차지하다) + -al", "ex": "시간을 차지하는 일의", "g": [["유의어", "professional (직업의)"], ["관련어", "career (직업, 경력), workplace (직장), work (일)"], ["파생어", "occupation ⓝ 직업, occupy ⓥ 차지하다"]], "c": ["an occupational phenomenon (직업 관련 현상)", "occupational health (산업 보건)"], "s": [["The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health.", "2019년 세계보건기구(WHO)가 번아웃을 직업 관련 현상으로 인정한 것은 직장 내 정신 건강에 관한 담론에서 중요한 순간이었다.", "본문", ""], ["Professional or trade magazines are specialized magazines and are often published by professional associations.", "전문지나 업계지는 특화된 잡지로, 흔히 전문가 협회에서 발행된다.", "2018-수능", ""], ["Wind, solar, and biomass also cause negative environmental impacts, such as visual pollution, intensive land occupation and negative effects on bird populations.", "풍력, 태양광, 바이오매스 역시 시각 공해, 집약적인 토지 점유, 조류 개체군에 대한 부정적 영향과 같은 부정적인 환경 영향을 일으킨다.", "2020-고1-교육청-11월", ""]]}, {"w": "phenomenon", "ipa": "fəˈnɑːmɪnən", "m": "ⓝ 현상 (pl. phenomena)", "d": [["ⓝ", "a fact or event that can be observed, especially one that is unusual or interesting", "관찰할 수 있는 사실이나 사건, 특히 특이하거나 흥미로운 것"]], "et": "그리스어 phainomenon (나타나는 것) ← phainein (보이다)", "ex": "눈앞에 나타나는 것", "g": [["유의어", "event (사건), occurrence (발생), fact (사실)"], ["파생어", "phenomena ⓝ 현상(복수형)"]], "c": ["an occupational phenomenon (직업 관련 현상)", "a biological phenomenon (생물학적 현상)", "natural phenomena (자연 현상)"], "s": [["The recognition of burnout as an occupational phenomenon by the WHO in 2019 marked an important moment in the discourse on workplace mental health.", "2019년 세계보건기구(WHO)가 번아웃을 는)", "based solely on (오로지 ~에 근거한)", "solely on individuals (오로지 개인에게만)"], "s": [["This reframing is essential, as it opens the door to systemic interventions and policy-level changes rather than placing the burden solely on individuals to cope or adapt.", "이러한 관점의 재구성은 필수적인데, 대처하거나 적응해야 하는 부담을 오로지 개인에게만 지우기보다는 체계 차원의 개입과 정책 수준의 변화로 가는 문을 열어 주기 때문이다.", "본문", ""], ["You have to make very fast assumptions about whether that animal is safe or not, based solely on its appearance.", "당신은 오로지 그 동물의 겉모습만을 근거로 그것이 안전한지 아닌지에 대해 매우 빠르게 추정해야 한다.", "2020-고1-교육청-9월", ""], ["The best dealers offer a much broader service than merely having their goods on display and 'selling from stock'.", "최고의 판매상은 단지 상품을 진열해 두고 '재고에서 판매하는 것'보다 훨씬 더 폭넓은 서비스를 제공한다.", "2025-평가원-9월", ""]]}, {"w": "remedy", "ipa": "ˈremədi", "m": "ⓝ 해결책, 치료(법) ⓥ 바로잡다, 치료하다", "d": [["ⓝ", "a successful way of dealing with a problem; a treatment for an illness", "문제를 성공적으로 다루는 방법; 병의 치료법"]], "et": "re (다시) + mederi (고치다)", "ex": "다시 낫게 하는 것", "g": [["유의어", "solution (해결책), cure (치료), treatment (치료), fix (해결책)"], ["관련어", "cause (원인), problem (문제)"]], "c": ["individual-level remedies (개인 수준의 해결책)", "home remedies for (~에 대한 민간요법)"], "s": [["It invites employers to adopt structural interventions rather than relying solely on individual-level remedies.", "그것은 고용주들이 오로지 개인 수준의 해결책에만 의존하기보다는 구조적 개입을 채택하도록 이끈다.", "본문", ""], ["We live in a time when everyone seems to be looking for quick and sure solutions.", "우리는 모두가 빠르고 확실한 해결책을 찾고 있는 것처럼 보이는 시대에 살고 있다.", "2022-평가원-9월", ""], ["Primary care doctors who focus on diagnosing known diseases and giving familiar treatments will probably be replaced by AI doctors.", "알려진 질병을 진단하고 익숙한 치료를 하는 데 집중하는 1차 진료 의사들은 아마 AI 의사로 대체될 것이다.", "2020-고1-교육청-9월", ""]]}, {"w": "collaborate", "ipa": "kəˈlæbəreɪt", "m": "ⓥ 협력하다, 공동으로 작업하다", "d": [["ⓥ", "to work together with someone to produce or achieve something", "무언가를 만들거나 이루기 위해 누군가와 함께 일하다"]], "et": "com (함께) + laborare (일하다)", "ex": "함께 일하다", "g": [["유의어", "cooperate (협력하다), work together (함께 일하다), team up (협력하다)"], ["반의어", "compete (경쟁하다)"], ["파생어", "collaboration ⓝ 협력, collaborator ⓝ 협력자, collaborative ⓐ 협력적인"]], "c": ["collaborate with (~와 협력하다)", "invite openness and collaboration (개방성과 협력을 이끌어 내다)", "collaborate for resource efficiency (자원 효율을 위해 협력하다)"], "s": [["In practice, this means clinicians should collaborate with occupational health and leadership to address root causes.", "실제로 이것은 임상의들이 근본 원인을 해결하기 위해 산업 보건 부서 및 지도부와 협력해야 한다는 것을 의미한다.", "본문", ""], ["It is a useful way to understand the dynamic nature of sport businesses which need to collaborate for resource efficiency purposes but potentially compete with each other.", "그것은 자원 효율을 위해 협력해야 하지만 잠재적으로는 서로 경쟁하기도 하는 스포츠 사업의 역동적인 본질을 이해하는 유용한 방법이다.", "2026-수능", ""], ["Difficulties arise when we do not think of people and machines as collaborative systems, but assign whatever tasks can be automated to the machines and leave the rest to people.", "사람과 기계를 협력하는 체계로 생각하지 않고, 자동화할 수 있는 일은 무엇이든 기계에 맡기고 나머지는 사람에게 남겨 둘 때 문제가 생긴다.", "2021-수능", ""]]}, {"w": "root", "ipa": "ruːt", "m": "ⓐ 근본적인 ⓝ 뿌리, 근원 ⓥ (be rooted in) ~에 뿌리를 두다", "d": [["ⓝ", "the basic cause or origin of something", "어떤 것의 기본적인 원인이나 기원"], ["ⓥ", "to have something as its origin (be rooted in)", "어떤 것에 기원을 두다(be rooted in)"]], "et": "고대 노르드어 rót (뿌리)", "ex": "식물의 뿌리 → 근원", "g": [["유의어", "origin (기원), source (근원), basis (토대), cause (원인)"], ["반의어", "result (결과), effect (결과)"]], "c": ["underlying causes (근본 원인)", "root causes (근본 원인)", "be rooted in (~에 뿌리를 두다)", "the roots of (~의 근원)"], "s": [["In practice, this means clinicians should collaborate with occupational health and leadership to address root causes.", "실제로 이것은 임상의들이 근본 원인을 해결하기 위해 산업 보건 부서 및 지도부와 협력해야 한다는 것을 의미한다.", "본문", ""], ["Sometimes these internal narratives we form not only shape our beliefs and opinions but also become deeply rooted in our identity.", "때때로 우리가 만드는 이러한 내면의 이야기는 우리의 신념과 의견을 형성할 뿐만 아니라 우리의 정체성에 깊이 뿌리내리게 된다.", "2026-수능", ""], ["First, it redistributes manganese from deeper soil layers to shallow soil layers using its roots as a small pipe.", "첫째, 그것은 자신의 뿌리를 작은 관처럼 이용하여 더 깊은 토양층의 망간을 얕은 토양층으로 재분배한다.", "2022-고1-교육청-3월", ""]]}, {"w": "recover", "ipa": "rɪˈkʌvər", "m": "ⓥ 회복하다, 되찾다", "d": [["ⓥ", "to become healthy again after an illness or difficult situation; to get something back", "병이나 어려운 상황 뒤에 다시 건강해지다; 무언가를 되찾다"]], "et": "라틴어 recuperare (되찾다)", "ex": "다시 손에 넣다", "g": [["유의어", "heal (치유되다), get over (극복하다), regain (되찾다), restore (회복시키다)"], ["반의어", "worsen (악화되다), deteriorate (악화되다)"], ["파생어", "recovery ⓝ 회복"]], "c": ["recover from (~에서 회복하다)", "start to recover (회복되기 시작하다)", "recovery from (~로부터의 회복)"], "s": [["Individuals can help themselves recover from burnout by changing patterns that contribute to stress.", "개인은 스트레스의 원인이 되는 행동 양식을 바꿈으로써 번아웃에서 스스로 회복할 수 있다.", "본문", ""], ["I was really concerned since he had just recovered from his knee surgery.", "그가 무릎 수술에서 막 회복했던 터라 나는 정말 걱정했다.", "2022-고1-교육청-11월", ""], ["Why do plants have this preferential ability to recover from disaster?", "식물은 왜 재해로부터 회복하는 이런 특별한 능력을 갖고 있을까?", "2023-평가원-9월", ""]]}, {"w": "resilience", "ipa": "rɪˈzɪliəns", "m": "ⓝ 회복력, 탄력성", "d": [["ⓝ", "the ability to become healthy, happy, or strong again after a difficult situation", "어려운 상황 뒤에 다시 건강하고 행복하고 강해지는 능력"]], "et": "re (다시) + salire (뛰다) → resilire (되튀다) + -ence", "ex": "다시 튀어 오르는 힘", "g": [["유의어", "strength (강인함), endurance (인내), flexibility (유연성)"], ["반의어", "vulnerability (취약성), weakness (약함)"], ["파생어", "resilient ⓐ 회복력 있는"]], "c": ["individual resilience (개인의 회복력)", "build resilience (회복력을 기르다)", "become more resilient (회복력이 더 강해지다)"], "s": [["It signaled a shift away from viewing burnout as a personal failing or a matter of individual resilience, toward understanding it as a structural issue rooted in organizational culture, leadership practices, and the broader socio-economic context of work.", "그것은 번아웃을 개인적 결함이나 개인의 회복력 문제로 보는 관점에서 벗어나, 조직 문화, 리더십 관행, 그리고 더 넓은 일의 사회경제적 맥락에 뿌리를 둔 구조적 문제로 이해하는 방향으로의 전환을 알렸다.", "본문", ""], ["Parenting experts say children need to learn independence and resilience.", "양육 전문가들은 아이들이 독립심과 회복력을 배워야 한다고 말한다.", "2026-고1-교육청-3월", ""], ["This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation.", "뇌의 이 부분은 스트레스에 직면해서도 회복력을 유지하도록 도와주며 기분 조절에도 관여한다.", "2025-고2-교육청-3월", ""]]}, {"w": "socio-economic", "ipa": "ˌsoʊsioʊˌiːkəˈnɑːmɪk", "m": "ⓐ 사회 경제적인", "d": [["ⓐ", "relating to both social and economic conditions", "사회적 조건과 경제적 조건 모두와 관련된"]], "et": "socio (사회) + economic (경제의)", "ex": "사회와 경제가 함께 얽힌", "g": [["관련어", "social (사회의), economic (경제의)"]], "c": ["the socio-economic context of work (노동의 사회 경제적 맥락)", "socio-economic patterns (사회 경제적 패턴)"], "s": [["It signaled a shift away from viewing burnout as a personal failing or a matter of individual resilience, toward understanding it as a structural issue rooted in organizational culture, leadership practices, and the broader socio-economic context of work.", "그것은 번아웃을 개인의 실패나 개인적 회복력의 문제로 보던 관점에서 벗어나, 조직 문화와 리더십 관행, 그리고 노동을 둘러싼 더 넓은 사회 경제적 맥락에 뿌리를 둔 구조적 문제로 이해하는 쪽으로의 전환을 알렸다.", "본문", ""], ["Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more.", "새 상점이나 공공 서비스 시설의 위치를 정하려면 인구 분포, 도로와 공공 설비의 위치, 사회 경제적 패턴 등을 고려해야 한다.", "2026-평가원-6월", ""], ["Nor does the traditional view recognise the role that non-intellectual factors, especially institutional and socio-economic ones, play in scientific developments.", "또한 전통적인 관점은 비지적인 요인들, 특히 제도적이고 사회 경제적인 요인들이 과학의 발전에서 하는 역할을 인정하지 않는다.", "2020-수능", ""]]}, {"w": "burden", "ipa": "ˈbɜːrdn", "m": "ⓝ 부담, 짐 ⓥ 부담을 지우다", "d": [["ⓝ", "something difficult or unpleasant that you have to deal with or worry about", "처리하거나 걱정해야 하는 어렵거나 불쾌한 것"]], "et": "고대 영어 byrthen (짐) ← beran (나르다)", "ex": "나르는 짐", "g": [["유의어", "load (짐), weight (무게, 부담), responsibility (책임), pressure (압박)"], ["반의어", "relief (안도, 경감)"]], "c": ["placing the burden on (~에게 부담을 지우는 것)", "the burden of (~의 부담)", "an unavoidable burden (피할 수 없는 부담)"], "s": [["This reframing is essential, as it opens the door to systemic interventions and policy-level changes rather than placing the burden solely on individuals to cope or adapt.", "이러한 관점의 재구성은 필수적인데, 대처하거나 적응해야 하는 부담을 오로지 개인에게만 지우기보다는 체계 차원의 개입과 정책 수준의 변화로 가는 문을 열어 주기 때문이다.", "본문", ""], ["You'll have a reminder and motivator to get going on those things that are calling you, and you also won't have the burden of remembering all of them.", "당신은 당신을 부르고 있는 그 일들을 시작하게 해 줄 상기 수단이자 동기 부여 요인을 갖게 될 것이고, 또한 그것들을 모두 기억해야 하는 부담도 지지 않게 될 것이다.", "2020-고1-교육청-3월", ""], ["As I walked away, the burden I had carried, even though I did nothing wrong, vanished into the air.", "걸어 나오면서, 내가 아무 잘못도 하지 않았는데도 짊어지고 있던 짐이 허공으로 사라졌다.", "2024-고2-교육청-9월", ""]]}, {"w": "cope", "ipa": "koʊp", "m": "ⓥ 대처하다, 감당하다 (with)", "d": [["ⓥ", "to deal successfully with a difficult situation", "어려운 상황을 잘 처리하다"]], "et": "고대 프랑스어 coper (치다, 맞서다)", "ex": "어려움에 맞서 버티다", "g": [["유의어", "deal with (~을 처리하다), handle (다루다), manage (그럭저럭 해내다)"], ["관련어", "adapt (적응하다)"]], "c": ["cope with (~에 대처하다)", "cope or adapt (대처하거나 적응하다)"], "s": [["This reframing is essential, as it opens the door to systemic interventions and policy-level changes rather than placing the burden solely on individuals to cope or adapt.", "이러한 관점의 재구성은 필수적인데, 대처하거나 적응해야 하는 부담을 개인에게만 지우기보다 체계적인 개입과 정책 차원의 변화로 가는 문을 열어 주기 때문이다.", "본문", ""], ["How are they able to cope with such abstraction?", "그들은 어떻게 그런 추상적인 것에 대처할 수 있는가?", "2023-고2-교육청-9월", ""], ["You will achieve more, and feel confident as a benefit, if you schedule your most demanding tasks at times when you are best able to cope with them.", "가장 힘든 일들을 그것을 가장 잘 감당할 수 있는 시간에 배치하면, 더 많은 것을 이루고 덤으로 자신감도 느끼게 될 것이다.", "2023-고1-교육청-3월", ""]]}]}, {"q": "36", "t": "글의 순서", "items": [{"w": "motion", "ipa": "ˈmoʊʃn", "m": "ⓝ 움직임, 운동, 동작", "d": [["ⓝ", "the act or process of moving, or a particular movement", "움직이는 행위나 과정, 또는 특정한 동작"]], "et": "라틴어 movere (움직이다) → motio + -ion", "ex": "움직이는 것", "g": [["유의어", "movement (움직임), vibration (진동), action (동작), activity (활동)"], ["반의어", "rest (정지, 휴식)"]], "c": ["some kind of motion (어떤 종류의 움직임)", "slow motion (느린 동작)", "in motion (움직이는 중인)"], "s": [["All sound begins with some kind of motion, something that disturbs molecules in air, water, steel, wood, or other medium.", "모든 소리는 어떤 종류의 움직임, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자를 교란하는 무언가로부터 시작된다.", "본문", ""], ["In general, kinetic energy is the energy associated with motion, while potential energy represents the energy which is \"stored\" in a physical system.", "일반적으로 운동 에너지는 움직임과 관련된 에너지인 반면, 위치 에너지는 물리계에 '저장된' 에너지를 나타낸다.", "2021-고1-교육청-11월", ""], ["If N equals the number of people in the circle, then the maximum number of balls you can have in motion is N minus 1.", "N이 원 안에 있는 사람의 수와 같다면, 움직이게 할 수 있는 공의 최대 개수는 N 빼기 1이다.", "2018-수능", ""]]}, {"w": "disturb", "ipa": "dɪˈstɜːrb", "m": "ⓥ 방해하다, 어지럽히다; (상태를) 교란하다", "d": [["ⓥ", "to interrupt someone or to change the normal position or state of something", "누군가를 방해하거나 어떤 것의 정상적인 위치나 상태를 바꾸다"]], "et": "dis (완전히) + turbare (어지럽히다)", "ex": "완전히 휘저어 놓다", "g": [["유의어", "stir (휘젓다), shake (흔들다), upset (뒤엎다), interrupt (방해하다), interfere (간섭하다)"], ["반의어", "calm (진정시키다), settle (가라앉히다)"], ["파생어", "disturbance ⓝ 방해, 교란, disturbing ⓐ 불안하게 하는"]], "c": ["disturb molecules (분자를 교란하다)", "the disturbance of molecules (분자의 교란)", "disturb the (~을 방해하다, 어지럽히다)"], "s": [["That tree will disturb molecules and make a mess, but if no creature hears it, no bird, fox, or human, it has not made sound.", "그 나무는 분자를 교란하고 어지럽게 하겠지만, 새든 여우든 인간이든 어떤 생물도 그것을 듣지 못한다면 그것은 소리를 낸 것이 아니다.", "본문", ""], ["If communication between our eyes and our brains is disturbed, our perception of reality is altered accordingly.", "눈과 뇌 사이의 소통이 방해를 받으면, 그에 따라 현실에 대한 우리의 지각이 바뀐다.", "2022-고1-교육청-11월", ""], ["Grandma added that although she knew caterpillars did harm to cabbages, she didn't wish to disturb the natural balance of the environment.", "할머니는 애벌레가 양배추에 해를 끼친다는 것을 알지만 환경의 자연적 균형을 어지럽히고 싶지는 않다고 덧붙였다.", "2019-수능", ""]]}, {"w": "molecule", "ipa": "ˈmɑːlɪkjuːl", "m": "ⓝ 분자", "d": [["ⓝ", "the smallest unit of a substance, made of one or more atoms", "하나 이상의 원자로 이루어진, 물질의 가장 작은 단위"]], "et": "라틴어 moles (덩어리) + -cula (작은)", "ex": "작은 덩어리", "g": [["관련어", "atom (원자), particle (입자), substance (물질)"], ["파생어", "molecular ⓐ 분자의"]], "c": ["disturb molecules (분자를 교란하다)", "molecules in air (공기 중의 분자)", "bioluminescent molecules (생물 발광 분자)"], "s": [["All sound begins with some kind of motion, something that disturbs molecules in air, water, steel, wood, or other medium.", "모든 소리는 어떤 종류의 움직임, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자를 교란하는 무언가로부터 시작된다.", "본문", ""], ["The color of almost all bioluminescent molecules is blue-green, the same color as the ocean above.", "거의 모든 생물 발광 분자의 색은 그 위의 바다와 같은 색인 청록색이다.", "2021-고1-교육청-11월", ""], ["Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed.", "따라서 이 분자는 몸이 부족한 잠을 추적하고 필요할 때 잠을 유발하는 데 사용하는 것일 수 있다.", "2025-고1-교육청-9월", ""]]}, {"w": "note", "ipa": "noʊt", "m": "ⓥ 언급하다, 주목하다 ⓝ 메모, 쪽지; 음표", "d": [["ⓥ", "to mention something because it is important or interesting; to notice", "중요하거나 흥미로워서 어떤 것을 언급하다; 알아차리다"], ["ⓝ", "a short piece of writing; a single musical sound", "짧은 글; 하나의 음"]], "et": "라틴어 notare (표시하다) ← nota (표시)", "ex": "표시해 두다", "g": [["유의어", "point out (지적하다), mention (언급하다), remark (말하다), observe (말하다, 관찰하다)"], ["반의어", "ignore (무시하다), overlook (간과하다)"], ["파생어", "notable ⓐ 주목할 만한, noted ⓐ 유명한"]], "c": ["note that (~라고 언급하다)", "take notes (필기하다)", "worth noting (주목할 만한)"], "s": [["Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.", "Isaac Newton은 광파에는 색이 없으며, 색의 지각은 오직 살아 있는 유기체의 뇌 속에서만 일어난다고 언급했다.", "본문", ""], ["Marshall McLuhan, among others, noted that clothes are people's extended skin, wheels extended feet, camera and telescopes extended eyes.", "Marshall McLuhan 등은 옷은 사람의 확장된 피부이고, 바퀴는 확장된 발이며, 카메라와 망원경은 확장된 눈이라고 언급했다.", "2020-평가원-6월", ""], ["Note that set-aside land is more permanent than fallow land, which is usually left for only a year.", "휴경 보존지는 보통 1년 동안만 놀려 두는 휴한지보다 더 영구적이라는 점에 주목하라.", "2018-평가원-9월", ""]]}, {"w": "wave", "ipa": "weɪv", "m": "ⓝ 파동, 파도; 물결 ⓥ (손을) 흔들다", "d": [["ⓝ", "a form in which energy such as light or sound travels; a line of raised water in the sea", "빛이나 소리 같은 에너지가 전달되는 형태; 바다에서 솟아오른 물의 줄기"], ["ⓥ", "to move your hand from side to side as a greeting", "인사로 손을 좌우로 움직이다"]], "et": "고대 영어 wafian (손을 흔들다)", "ex": "흔들리며 퍼지는 것", "g": [["관련어", "vibration (진동), tide (조수)"]], "c": ["light waves (광파)", "pressure waves (압력파)", "sound waves (음파)"], "s": [["Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.", "Isaac Newton은 광파에는 색이 없으며, 색의 지각은 오직 살아 있는 유기체의 뇌 속에서만 일어난다고 언급했다.", "본문", ""], ["Sound is more than pressure waves, and indeed there can be no sound without a hearer.", "소리는 압력파 그 이상이며, 실제로 듣는 이가 없으면 소리도 있을 수 없다.", "2023-고1-교육청-9월", ""], ["And this time, standing upright, he battled the wave all the way back to shore.", "그리고 이번에 그는 똑바로 선 채로 해안까지 내내 파도와 싸웠다.", "2019-수능", ""]]}, {"w": "perception", "ipa": "pərˈsepʃn", "m": "ⓝ 지각, 인식", "d": [["ⓝ", "the way you notice things with your senses; the way you think about or understand something", "감각으로 사물을 알아차리는 방식; 어떤 것을 생각하거나 이해하는 방식"]], "et": "per (완전히) + capere (잡다) + -tion", "ex": "완전히 붙잡아 앎", "g": [["유의어", "awareness (인식), recognition (인식), sense (감각), understanding (이해)"], ["관련어", "perspective (관점), cognition (인지)"], ["파생어", "perceive ⓥ 지각하다, perceptual ⓐ 지각의"]], "c": ["the perception of color (색의 지각)", "perception of sound (소리의 지각)", "visual perception (시각적 지각)"], "s": [["Thus perception of sound begins at our eardrums — before it hits our eardrums, it is nothing more than the disturbance of molecules.", "따라서 소리의 지각은 우리의 고막에서 시작된다. 그것이 고막에 닿기 전에는 분자의 교란에 불과하다.", "본문", ""], ["By allowing the fingers to move, you've added time to the sensory perception of touch.", "손가락이 움직이게 함으로써 여러분은 촉각이라는 감각 지각에 시간을 더한 것이다.", "2021-수능", ""], ["Thus, sufficient space remains for the perception and learning of new images on the cerebral blackboard.", "따라서 대뇌의 칠판 위에는 새로운 이미지를 지각하고 학습할 충분한 공간이 남는다.", "2024-수능", ""]]}, {"w": "occur", "ipa": "əˈkɜːr", "m": "ⓥ 일어나다, 발생하다; (생각이) 떠오르다", "d": [["ⓥ", "to happen; to exist or be found somewhere", "일어나다; 어딘가에 존재하거나 발견되다"], ["ⓥ", "to come into your mind (occur to)", "마음속에 떠오르다(occur to)"]], "et": "ob (~을 향해) + currere (달리다)", "ex": "앞으로 달려 나오다", "g": [["유의어", "happen (일어나다), take place (일어나다), arise (발생하다), appear (나타나다)"], ["반의어", "disappear (사라지다)"], ["파생어", "occurrence ⓝ 발생, 사건"]], "c": ["only occurs in the brain (오직 뇌에서만 일어나다)", "occur naturally (자연적으로 발생하다)", "It occurs to A (A에게 ~라는 생각이 들다)"], "s": [["Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.", "Isaac Newton은 광파에는 색이 없으며, 색의 지각은 오직 살아 있는 유기체의 뇌 속에서만 일어난다고 언급했다.", "본문", ""], ["How the bandwagon effect occurs is demonstrated by the history of measurements of the speed of light.", "편승 효과가 어떻게 일어나는지는 빛의 속도 측정의 역사가 보여 준다.", "2021-수능", ""], ["It is natural for people to observe happenings and then seek explanations for why those happenings occurred.", "사람들이 일어난 일을 관찰한 다음 그 일이 왜 일어났는지에 대한 설명을 찾는 것은 자연스러운 일이다.", "2025-고1-교육청-6월", ""]]}, {"w": "living", "ipa": "ˈlɪvɪŋ", "m": "ⓐ 살아 있는 ⓝ 생계; 생활", "d": [["ⓐ", "alive now", "현재 살아 있는"], ["ⓝ", "the money you earn from your work; a way of life", "일해서 버는 돈; 생활 방식"]], "et": "live (살다) + -ing", "ex": "살고 있는", "g": [["유의어", "alive (살아 있는), live (살아 있는)"], ["반의어", "dead (죽은), nonliving (무생물의)"], ["관련어", "organism (유기체, 생물)"]], "c": ["a living organism (살아 있는 유기체)", "living things (생물)", "living room (거실)"], "s": [["Isaac Newton noted that light waves are colorless; the perception of color only occurs in the brain of a living organism.", "Isaac Newton은 광파에는 색이 없으며, 색의 지각은 오직 살아 있는 유기체의 뇌 속에서만 일어난다고 언급했다.", "본문", ""], ["Lithops are plants that are often called 'living stones' on account of their unique rock-like appearance.", "리톱스는 독특한 바위 같은 생김새 때문에 흔히 '살아 있는 돌'이라고 불리는 식물이다.", "2021-고1-교육청-6월", ""], ["This is slowly being replaced by the view that the economy is a part of the larger system of material flows that connect all living things.", "이것은 경제가 모든 생물을 연결하는 더 큰 물질 흐름 체계의 일부라는 관점으로 서서히 대체되고 있다.", "2024-고2-교육청-9월", ""]]}, {"w": "gauge", "ipa": "ɡeɪdʒ", "m": "ⓝ 계기, 측정기 ⓥ 측정하다, 판단하다", "d": [["ⓝ", "an instrument for measuring the amount or size of something", "어떤 것의 양이나 크기를 측정하는 기구"], ["ⓥ", "to measure or judge something", "어떤 것을 측정하거나 판단하다"]], "et": "고대 북부 프랑스어 gauger (측정하다)", "ex": "재는 도구", "g": [["유의어", "measure (측정하다), meter (계기), estimate (추정하다), assess (평가하다)"], ["관련어", "instrument (기구), measurement (측정)"]], "c": ["gauges and instruments (계기와 기구)", "measure that disturbance (그 교란을 측정하다)"], "s": [["We can measure that disturbance with gauges and instruments, but until it hits a brain, it is not sound.", "우리는 그 교란을 계기와 기구로 측정할 수 있지만, 그것이 뇌에 닿기 전까지 그것은 소리가 아니다.", "본문", ""], ["Consider units of measure, one kind of descriptive device we are familiar with using in physics.", "물리학에서 우리가 익숙하게 사용하는 일종의 기술(記述) 장치인 측정 단위를 생각해 보라.", "2025-고2-교육청-10월", ""], ["It is important to take a few steps back from the painting from time to time to assess your progress.", "이따금 그림에서 몇 걸음 물러나 진행 상황을 가늠하는 것이 중요하다.", "2024-고1-교육청-3월", ""]]}, {"w": "instrument", "ipa": "ˈɪnstrəmənt", "m": "ⓝ 기구, 도구; 악기", "d": [["ⓝ", "a tool used for a particular piece of work, especially for measuring; an object used for producing music", "특정 작업, 특히 측정에 쓰이는 도구; 음악을 만들어 내는 데 쓰이는 물건"]], "et": "in (위에) + struere (쌓다, 세우다) + -ment", "ex": "일을 세우는 데 쓰는 것", "g": [["유의어", "tool (도구), device (장치), equipment (장비)"], ["파생어", "instrumental 청-3월", ""]]}, {"w": "riddle", "ipa": "ˈrɪdl", "m": "ⓝ 수수께끼, 난제", "d": [["ⓝ", "a difficult question asked as a game; a mysterious problem", "놀이로 내는 어려운 질문; 불가사의한 문제"]], "et": "고대 영어 rædels (의견, 추측) ← rædan (조언하다, 해석하다)", "ex": "풀어야 할 말", "g": [["유의어", "puzzle (수수께끼, 퍼즐), mystery (미스터리), question (질문), problem (문제)"], ["반의어", "solution (해답), answer (답)"]], "c": ["an old philosophical riddle (오래된 철학적 수수께끼)", "solve the puzzle (퍼즐을 풀다)"], "s": [["You may have heard the old philosophical riddle, \"If a tree falls in the forest and no one is there to hear it, does it make it sound?\"", "여러분은 \"숲에서 나무가 쓰러지는데 그것을 들을 사람이 아무도 없다면, 그것은 소리를 내는가?\"라는 오래된 철학적 수수께끼를 들어 보았을 것이다.", "본문", ""], ["In this workshop, you will investigate crime scenes and learn skills necessary to become a detective and solve mysteries!", "이 워크숍에서 여러분은 범죄 현장을 조사하고 탐정이 되어 미스터리를 푸는 데 필요한 기술을 배우게 됩니다!", "2021-평가원-6월", ""], ["\"Hmm, I like mysteries,\" Mia replied.", "\"음, 나는 미스터리가 좋아.\"라고 Mia가 대답했다.", "2026-수능", ""]]}, {"w": "psychological", "ipa": "ˌsaɪkəˈlɑːdʒɪkl", "m": "ⓐ 심리적인, 심리학의", "d": [["ⓐ", "relating to the mind or to psychology", "마음이나 심리학과 관련된"]], "et": "그리스어 psykhē (영혼, 마음) + logia (학문) + -ical", "ex": "마음을 연구하는", "g": [["유의어", "mental (정신의), emotional (정서적인)"], ["반의어", "physical (신체적인, 물리적인)"], ["파생어", "psychology ⓝ 심리학, psychologist ⓝ 심리학자, psychologically ad. 심리적으로"]], "c": ["a psychological concept (심리적 개념)", "psychological studies (심리학 연구)", "psychological value (심리적 가치)"], "s": [["No, because sound is a psychological concept, a product of brains.", "아니다, 왜냐하면 소리는 심리적 개념, 즉 뇌의 산물이기 때문이다.", "본문", ""], ["Consider The Wizard of Oz as a psychological study of motivation.", "『오즈의 마법사』를 동기에 관한 심리학적 연구로 생각해 보라.", "2024-평가원-6월", ""], ["Studies in psychology have reported cases in which competitive incentives resulted in lower task effort, and their focus was on the psychological underpinnings of the reduction in motivation.", "심리학 연구들은 경쟁적 유인책이 더 낮은 과제 노력으로 이어진 사례들을 보고했는데, 그 연구들의 초점은 동기 저하의 심리적 기반에 IT Media Lab, describes this as seamless communication because there is no functional separation between the task and communication space.", "MIT 미디어 랩의 교수인 Ishii는 작업 공간과 의사소통 공간 사이에 기능적 분리가 없기 때문에 이것을 끊김 없는 의사소통이라고 설명한다.", "본문", ""], ["The fact that the intensity reflects the duration of the separation as well as the level of intimacy suggests that elephants have a sense of time as well.", "그 강도가 친밀함의 정도뿐 아니라 떨어져 있던 기간도 반영한다는 사실은 코끼리에게도 시간 감각이 있음을 시사한다.", "2020-수능", ""], ["The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.", "원하는 것과 필요한 것 사이의 구분이 흐려지면서, 우리의 재정적 우선순위는 유행을 따라가는 쪽으로 바뀐다.", "2024-고2-교육청-10월", ""]]}, {"w": "separate", "ipa": "ⓥ ˈsepəreɪt ⓐ ˈseprət", "m": "ⓥ 분리하다, 떼어 놓다 ⓐ 분리된, 별개의", "d": [["ⓥ", "to divide or keep things or people apart", "사물이나 사람들을 나누거나 떨어뜨려 두다"], ["ⓐ", "different and not connected", "다르고 연결되지 않은"]], "et": "se (떨어져) + parare (준비하다)", "ex": "따로 떼어 마련하다", "g": [["유의어", "divide (나누다), split (가르다), detach (떼어 내다), isolate (고립시키다)"], ["반의어", "combine (결합하다), connect (연결하다), unite (통합하다), join (결합하다)"], ["파생어", "separation ⓝ 분리, separately ad. 따로"]], "c": ["separated from (~로부터 분리된)", "separate A from B (A를 B와 분리하다)", "separate rooms (별개의 방)"], "s": [["However, when people are working remotely, the task space is often separated from the communication space.", "하지만 사람들이 원격으로 일할 때는 작업 공간이 의사소통 공간과 분리되는 경우가 많다.", "본문", ""], ["Although it may seem sensible, having two separate calendars for work and personal life can lead to distractions.", "합리적으로 보일 수도 있지만, 일과 개인 생활을 위해 두 개의 별개 달력을 갖는 것은 주의 산만으로 이어질 수 있다.", "2023-고1-교육청-6월", ""], ["However, through state land reforms and the development of additional sources of supply, water rights have become separated from land, and may be sold at auction.", "하지만 국가의 토지 개혁과 추가적인 공급원 개발을 통해 물에 대한 권리는 토지와 분리되었으며, 경매로 팔릴 수도 있다.", "2021-평가원-6월", ""]]}, {"w": "conference", "ipa": "ˈkɑːnfərəns", "m": "ⓝ 회의, 학회 (video conferencing 화상 회의)", "d": [["ⓝ", "a large formal meeting where people discuss their work or share ideas", "사람들이 업무를 논의하거나 생각을 나누는 큰 공식 회의"]], "et": "con (함께) + ferre (나르다) + -ence", "ex": "의견을 함께 가져옴", "g": [["유의어", "meeting (회의), convention (대회), assembly (집회), seminar (세미나)"], ["파생어", "confer ⓥ 상의하다, conferencing ⓝ (원격) 회의"]], "c": ["video conferencing (화상 회의)", "a conference call (전화 회의)", "a conference room (회의실)"], "s": [["For example, when video conferencing, people may have the face of their collaborator on one screen, while looking at a shared document on another.", "예를 들어 화상 회의를 할 때, 사람들은 한 화면에는 협력자의 얼굴을 띄워 두고 다른 화면으로는 공유 문서를 보고 있을 수 있다.", "본문", ""], ["Any scientist who announces a so-called discovery at a press conference without first permitting expert reviewers to examine his or her claims is automatically castigated as a publicity seeker.", "전문 검토자들이 자신의 주장을 검토하도록 먼저 허락하지 않고 기자 회견에서 이른바 발견을 발표하는 과학자는 누구든 자동적으로 관심을 끌려는 사람으로 비난받는다.", "2019-평가원-6월", ""], ["It's as if to help with our slow Wi-Fi, we disconnect our phone and tablet, just so that our video conference call won't lag.", "그것은 마치 느린 와이파이에 도움이 되도록 휴대 전화와 태블릿의 연결을 끊는 것과 같은데, 그저 화상 회의 통화가 끊기지 않게 하려는 것이다.", "2026-평가원-6월", ""]]}, {"w": "collaborator", "ipa": "kəˈlæbəreɪtər", "m": "ⓝ 협력자, 공동 작업자", "d": [["ⓝ", "a person who works with another person to produce or achieve something", "무언가를 만들거나 이루기 위해 다른 사람과 함께 일하는 사람"]], "et": "com (함께) + laborare (일하다) + -or (사람)", "ex": "함께 일하는 사람", "g": [["유의어", "partner (동반자), co-worker (동료), colleague (동료), teammate (팀 동료)"], ["반의어", "competitor (경쟁자), rival (경쟁자)"], ["파생어", "collaborate ⓥ 협력하다, collaboration ⓝ 협력"]], "c": ["the remote collaborator (원격 협력자)", "collaborate face to face (대면하여 협업하다)"], "s": [["In this case, it is impossible to see many of the remote collaborator's communication cues at the same time as looking at the task space.", "이 경우에는 작업 공간을 보면서 동시에 원격 협력자의 많은 의사소통 신호를 보는 것이 불가능하다.", "본문", ""], ["This twist in the tale of the trait that gives fireflies their name was discovered ent on another.", "예를 들어 화상 회의를 할 때, 사람들은 한 화면에는 협력자의 얼굴을 띄워 두고 다른 화면으로는 공유 문서를 보고 있을 수 있다.", "본문", ""], ["But before you hit the Send key, make sure that you read your document carefully one last time.", "하지만 '보내기' 키를 누르기 전에 마지막으로 한 번 더 문서를 꼼꼼히 읽었는지 확인하라.", "2021-고1-교육청-3월", ""], ["The collection of pictures, tools, and historical documents made the gold miners arriving to Qukkon come to life.", "사진, 도구, 역사적 문서들의 모음은 Qukkon에 도착한 금광꾼들을 생생하게 되살려 냈다.", "2026-평가원-6월", ""]]}, {"w": "at the same time", "ipa": "æt ðə seɪm taɪm", "m": "동시에; 그와 동시에, 하지만", "d": [["phr.", "together, simultaneously; used to introduce another fact that should be considered", "함께, 동시에; 고려해야 할 또 다른 사실을 소개할 때 씀"]], "et": "at (~에) + the same (같은) + time (시간)", "ex": "같은 시간에", "g": [["유의어", "simultaneously (동시에), at once (한꺼번에), together (함께), while (~하는 동안)"], ["반의어", "separately (따로), one after another (차례로)"]], "c": ["at the same time as (~와 동시에)", "at the same time (동시에)"], "s": [["In this case, it is impossible to see many of the remote collaborator's communication cues at the same time as looking at the task space.", "이 경우에는 작업 공간을 보면서 동시에 원격 협력자의 많은 의사소통 신호를 보는 것이 불가능하다.", "본문", ""], ["Because it's almost impossible to throw and catch at the same time.", "왜냐하면 던지는 것과 받는 것을 동시에 하는 것은 거의 불가능하기 때문이다.", "2018-수능", ""], ["At the same time, they attempt to control for the potential effects of all other variables.", "동시에 그들은 다른 모든 변수가 미칠 수 있는 영향을 통제하려고 시도한다.", "2023-고2-교육청-6월", ""]]}, {"w": "in this case", "ipa": "ɪn ðɪs keɪs", "m": "이 경우에", "d": [["phr.", "in the situation that has just been described", "방금 설명한 상황에서"]], "et": "in (~에서) + this (이) + case (경우)", "ex": "이러한 경우에", "g": [["유의어", "in this situation (이 상황에서), here (여기서)"], ["관련어", "in that case (그렇다면), in the case of (~의 경우에)"]], "c": ["In this case, it is impossible to (이 경우에는 ~하는 것이 불가능하다)", "in the case of (~의 경우에)"], "s": [["In this case, it is impossible to see many of the remote collaborator's communication cues at the same time as itions because they've been exposed repeatedly to \"background noise\" since early childhood.", "그들은 많은 십 대들이 어린 시절부터 '배경 소음'에 반복적으로 노출되어 왔기 때문에 이상적이지 않은 조건에서도 실제로 생산적으로 공부할 수 있다고 주장한다.", "2020-고1-교육청-3월", ""]]}, {"w": "psychologist", "ipa": "saɪˈkɑːlədʒɪst", "m": "ⓝ 심리학자", "d": [["ⓝ", "a person who studies the human mind and human behavior", "인간의 마음과 행동을 연구하는 사람"]], "et": "그리스어 psykhē (마음) + logia (학문) + -ist (사람)", "ex": "마음을 연구하는 사람", "g": [["관련어", "psychiatrist (정신과 의사)"], ["파생어", "psychology ⓝ 심리학, psychological ⓐ 심리적인"]], "c": ["a social psychologist (사회 심리학자)", "educational psychologist (교육 심리학자)", "a clinical psychologist (임상 심리학자)"], "s": [["In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.", "1977년에 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 일반 상식 퀴즈 같은 60개의 진술이 참인지 거짓인지를 얼마나 확신하는지 물었다.", "본문", ""], ["According to educational psychologist Susan Engel, curiosity begins to decrease as young as four years old.", "교육 심리학자 Susan Engel에 따르면, 호기심은 네 살이라는 어린 나이부터 줄어들기 시작한다.", "2023-고1-교육청-6월", ""], ["As a graduate student at the University of Iowa, Festinger was influenced by Kurt Lewin, a leading social psychologist.", "아이오와 대학교의 대학원생이었을 때, Festinger는 선도적인 사회 심리학자인 Kurt Lewin의 영향을 받았다.", "2023-평가원-9월", ""]]}, {"w": "certain", "ipa": "ˈsɜːrtn", "m": "ⓐ 확신하는; 확실한; 특정한, 어떤", "d": [["ⓐ", "having no doubt that something is true", "어떤 것이 사실임을 의심하지 않는"], ["ⓐ", "particular, but not named or described", "특정하지만 이름을 대거나 묘사하지 않은"]], "et": "라틴어 certus (확정된) ← cernere (가려내다)", "ex": "가려내어 확정된", "g": [["유의어", "sure (확신하는), confident (확신하는), convinced (확신하는)"], ["반의어", "uncertain (불확실한), doubtful (의심스러운)"], ["관련어", "particular (특정한)"], ["파생어", "certainly ad. 확실히, certainty ⓝ 확실성, uncertainty ⓝ 불확실성"]], "c": ["how certain they were that (~라고 얼마나 확신하는지)", "certain of (~을 확신하는)", "to a certain extent (어느 정도까지)"], "s": [["In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.", "1977년에 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 일반 상식 퀴즈 같은 60개의 진술이 참인지 거짓인지를 얼마나 확신하는지 물었다.", "본문", ""], ["Looking at her handiwork, which is beautifully done, she is certain that the cafe will be a success.", "아름답게 완성된 자신의 작품을 바라보며, 그녀는 그 카페가 성공할 것이라고 확신한다.", "2023-고2-교육청-3월", ""], ["It was Valentine's Day on Friday and Peter was certain that his wife, Amy, was going to love his surprise.", "금요일은 밸런타인데이였고, Peter는 그의 아내 Amy가 자신의 깜짝 선물을 무척 좋아할 것이라고 확신했다.", "2025-수능", ""]]}, {"w": "general", "ipa": "ˈdʒenrəl", "m": "ⓐ 일반적인, 보편적인; 전반적인", "d": [["ⓐ", "involving or affecting most people or things; not detailed", "대부분의 사람이나 사물과 관련되거나 영향을 미치는; 상세하지 않은"]], "et": "라틴어 genus (종류) → generalis (종 전체에 관한)", "ex": "종류 전체에 관한", "g": [["유의어", "common (흔한), universal (보편적인), broad (넓은), overall (전반적인)"], ["반의어", "specific (구체적인), particular (특정한)"], ["파생어", "generally ad. 일반적으로, generalize ⓥ 일반화하다, generalization ⓝ 일반화"]], "c": ["general-knowledge statements (일반 상식 진술)", "in general (일반적으로)", "the general public (일반 대중)"], "s": [["In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false.", "1977년에 심리학자 Lynn Hasher와 David Goldstein은 한 무리의 대학생들에게 일반 상식 퀴즈 같은 60개의 진술이 참인지 거짓인지를 얼마나 확신하는지 물었다.", "본문", ""], ["In general, most students are often closely tuned in to their teacher's body language.", "일반적으로 대부분의 학생들은 흔히 교사의 몸짓 언어에 민감하게 반응한다.", "2021-고1-교육청-11월", ""], ["There is often a lot of uncertainty in the realm of science, which the general public finds uncomfortable.", "과학의 영역에는 흔히 많은 불확실성이 있는데, 일반 대중은 그것을 불편하게 여긴다.", "2021-고1-교육청-11월", ""]]}, {"w": "evaluate", "ipa": "ɪˈvæljueɪt", "m": "ⓥ 평가하다", "d": [["ⓥ", "to judge or calculate the quality, importance, or value of something", "어떤 것의 질, 중요성, 가치를 판단하거나 계산하다"]], "et": "e (밖으로) + valere (가치가 있다) + -ate", "ex": "가치를 끌어내 따지다", "g": [["유의어", "assess (평가하다), judge (판단하다), rate (평가하다), estimate (추정하다)"], ["파생어", "evaluation ⓝ 평가"]], "c": ["evaluate the statements (진술을 평가하다)", "evaluate the (~을 평가하다)", "evaluation of (~에 대한 평가)"], "s": [["The students were asked to evaluate the sixty statements three times, at two-week intervals.", "학생들은 2주 간격으로 세 번에 걸쳐 그 60개의 진술을 평가하도록 요청받았다.", "본문", ""], ["Information has become a recognized entity to be measured, evaluated, and priced.", "정보는 측정되고, 평가되고, 가격이 매겨지는 인정된 실체가 되었다.", "2019-수능", ""], ["The judges then evaluated each vocalist's performance carefully.", "그런 다음 심사위원들은 각 가수의 공연을 꼼꼼하게 평가했다.", "2026-고1-교육청-6월", ""]]}, {"w": "interval", "ipa": "ˈɪntərvl", "m": "ⓝ (시간·공간의) 간격; 중간 휴식", "d": [["ⓝ", "a period of time or a space between two events or things", "두 사건이나 사물 사이의 시간이나 공간"]], "et": "inter (사이) + vallum (성벽)", "ex": "성벽 사이의 공간", "g": [["유의어", "gap (간격), break (휴식), pause (멈춤), period (기간)"]], "c": ["every two weeks (2주마다)", "at two-week intervals (2주 간격으로)", "at regular intervals (일정한 간격으로)"], "s": [["The students were asked to evaluate the sixty statements three times, at two-week intervals.", "학생들은 2주 간격으로 세 번에 걸쳐 그 60개의 진술을 평가하도록 요청받았다.", "본문", ""], ["They remember, in a systematic way, how often sounds occur, in what order, with what intervals, and with what changes of pitch.", "그들은 소리가 얼마나 자주, 어떤 순서로, 어떤 간격으로, 어떤 음높이 변화와 함께 나타나는지를 체계적인 방식으로 기억한다.", "2021-고1-교육청-11월", ""], ["One curious fact is that animals that are hibernating also have periods of sleep.", "한 가지 흥미로운 사실은 겨울잠을 자는 동물들에게도 수면 기간이 있다는 것이다.", "2024-고2-교육청-9월", ""]]}, {"w": "crucially", "ipa": "ˈkruːʃəli", "m": "ad. 결정적으로, 중요하게", "d": [["ad.", "in a way that is extremely important", "매우 중요한 방식으로"]], "et": "crucial ← 라틴어 crux (십자가, 갈림길) + -ly", "ex": "갈림길에서 결정짓듯이", "g": [["유의어", "importantly (중요하게), critically (결정적으로), essentially (본질적으로)"], ["파생어", "crucial ⓐ 결정적인, 매우 중요한"]], "c": ["most importantly (가장 중요하게는)", "crucial to (~에 매우 중요한)", "a crucial factor (결정적인 요인)", "a crucial difference (결정적인 차이)"], "s": [["Crucially, only twenty of the statements were repeated each time; the other forty were new.", "결정적으로, 진술 중 20개만 매번 반복되었고 나머지 40개는 새로운 것이었다.", "본문", ""], ["Crucially, however, we can only take up one perspective at a time.", "하지만 결정적으로, 우리는 한 번에 하나의 관점만 취할 수 있다.", "2023-고1-교육청-11월", ""], ["And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence.", "그리고 우리가 스스로에게 동기를 부여하려 할 때, 다른 사람들과의 유대감을 높이는 일을 하는 것은 장기적인 끈기에 매우 중요할 수 있다.", "2025-고1-교육청-3월", ""]]}, {"w": "repeat", "ipa": "rɪˈpiːt", "m": "ⓥ 반복하다, 되풀이하다", "d": [["ⓥ", "to say, write, or do something again", "어떤 것을 다시 말하거나 쓰거나 하다"]], "et": "re (다시) + petere (추구하다, 향하다)", "ex": "다시 향하다", "g": [["유의어", "restate (다시 말하다), replicate (반복하다, 재현하다)"], ["파생어", "repetition ⓝ 반복, repetitive ⓐ 반복적인, repeatedly ad. 반복적으로"]], "c": ["repeated versus non-repeated (반복된 것 대 반복되지 않은 것)", "repeat back (따라 말하다)", "repeats itself (반복되다)"], "s": [["Crucially, only twenty of the statements were repeated each time; the other forty were new.", "결정적으로, 진술 중 20개만 매번 반복되었고 나머지 40개는 새로운 것이었다.", "본문", ""], ["She had to repeat the words several times before the old man's eyes opened.", "그녀는 노인이 눈을 뜨기 전까지 그 말을 여러 번 반복해야 했다.", "2023-고1-교육청-6월", ""], ["So in the case of civilizations, \"history repeats itself\" seems to be an oversimplification.", "그러므로 문명의 경우, '역사는 반복된다'는 말은 지나친 단순화인 것 같다.", "2025-고1-교육청-6월", ""]]}, {"w": "compare", "ipa": "kəmˈper", "m": "ⓥ 비교하다; 비유하다", "d": [["ⓥ", "to examine people or things to see how they are similar or different", "사람이나 사물이 어떻게 비슷하거나 다른지 살펴보다"], ["ⓥ", "to say that someone or something is like another (compare A to B)", "누군가나 무언가가 다른 것과 같다고 말하다(compare A to B)"]], "et": "com (함께) + par (동등한)", "ex": "동등하게 나란히 놓다", "g": [["유의어", "contrast (대조하다), match (맞추어 보다), weigh (따져 보다)"], ["파생어", "comparison ⓝ cific period of time.", "그러므로 우리가 여러 과학 분야에 걸쳐 논문을 발표한 사람에게 깜짝 놀랄 때, 각 주제는 특정한 기간 동안 탐구되었다는 것을 깨달아야 한다.", "2024-수능", ""]]}, {"w": "in other words", "ipa": "ɪn ˈʌðər wɜːrdz", "m": "다시 말해서, 즉", "d": [["phr.", "used to introduce an explanation that is simpler or clearer", "더 간단하거나 분명한 설명을 시작할 때 씀"]], "et": "in (~으로) + other (다른) + words (말)", "ex": "다른 말로 하면", "g": [["유의어", "that is (즉), namely (즉)"], ["관련어", "for example (예를 들어), in short (요컨대)"]], "c": ["in other words (다시 말해서)"], "s": [["In other words, the more often you hear a statement, the more 'true' it sounds.", "다시 말해, 어떤 진술을 더 자주 들을수록 그것은 더 '사실'처럼 들린다.", "본문", ""], ["In other words, they are valued because of their market potential.", "다시 말해, 그것들은 시장 잠재력 때문에 가치를 인정받는다.", "2021-평가원-9월", ""], ["In other words, there is a metabolic expense to maintaining fat.", "다시 말해, 지방을 유지하는 데에는 대사적 비용이 든다.", "2025-고2-교육청-9월", ""]]}, {"w": "illusory", "ipa": "ɪˈluːsəri", "m": "ⓐ 착각의, 환상에 불과한, 실체 없는", "d": [["ⓐ", "not real, although it seems to be", "그렇게 보이지만 실제가 아닌"]], "et": "illusion ← 라틴어 illudere (조롱하다) ← in (~에 대해) + ludere (놀다) + -ory", "ex": "장난처럼 속이는", "g": [["유의어", "false (거짓의), misleading (오해를 일으키는), deceptive (기만적인), imaginary (가상의)"], ["반의어", "real (실제의), genuine (진짜의), actual (실제의)"], ["파생어", "illusion ⓝ 착각, 환상"]], "c": ["the illusory truth effect (진실 착각 효과)", "the illusion of (~이라는 착각)", "overcome illusions (착각을 극복하다)"], "s": [["This became known as the illusory truth effect.", "이것은 진실 착각 효과로 알려지게 되었다.", "본문", ""], ["The \"individual\" is a legal, religious, and political fiction just as the \"I\" is a grammatical illusion.", "'개인'이란 '나'가 문법적 착각인 것과 마찬가지로 법적, 종교적, 정치적 허구이다.", "2021-평가원-9월", ""], ["Otherwise, you're sacrificing your potential for the illusion of professionalism.", "그렇지 않으면 당신은 전문성이라는 착각을 위해 자신의 잠재력을 희생하고 있는 것이다.", "2022-평가원-6월", ""]]}, {"w": "effect", "ipa": "ɪˈfekt", "m": "ⓝ 효과, 영향, 결과", "d": [["ⓝ", "a change, result, or condition that is caused by something", "어떤 것에 의해 일어난 변화, 결과, 상태"]], "et": volve to do (~하도록 진화하다)", "evolve into (~으로 발전하다)", "evolve over time (시간이 지나며 발전하다)"], "s": [["Human beings have evolved to make the most of the resources available to them in ways that are subtle and complicated.", "인간은 미묘하고 복잡한 방식으로 자신이 이용할 수 있는 자원을 최대한 활용하도록 진화해 왔다.", "본문", ""], ["The universe was not designed for us to evolve, we have no privileged position in the universe; however, the laws and constants of physics allowed advanced life to evolve.", "우주는 우리가 진화하도록 설계되지 않았고 우리는 우주에서 특권적 위치를 갖지 않지만, 물리학의 법칙과 상수는 고등 생명체가 진화하도록 허용했다.", "2025-고1-교육청-10월", ""], ["With the industrial society evolving into an information-based society, the concept of information as a product, a commodity with its own value, has emerged.", "산업 사회가 정보 기반 사회로 진화하면서, 그 자체의 가치를 지닌 상품, 즉 하나의 제품으로서의 정보라는 개념이 등장했다.", "2019-수능", ""]]}, {"w": "resource", "ipa": "ˈriːsɔːrs", "m": "ⓝ 자원, 재원, 자료", "d": [["ⓝ", "a supply of something such as money, materials, or information that can be used when needed", "필요할 때 사용할 수 있는 돈, 물자, 정보 등의 공급원"]], "et": "re (다시) + surgere (솟아오르다)", "ex": "필요할 때 다시 솟아나 도움이 되는 것", "g": [["유의어", "supply (공급, 비축물), source (원천), asset (자산)"], ["관련어", "shortage (부족), scarcity (결핍)"], ["파생어", "resourceful ⓐ 기지가 있는, 수완이 좋은"]], "c": ["make the most of resources (자원을 최대한 활용하다)", "natural resources (천연자원)", "limited resources (한정된 자원)"], "s": [["Human beings have evolved to make the most of the resources available to them in ways that are subtle and complicated.", "인간은 미묘하고 복잡한 방식으로 자신이 이용할 수 있는 자원을 최대한 활용하도록 진화해 왔다.", "본문", ""], ["For example, if you come across an article or resource that you think might interest a connection, share it with them, even if you haven't spoken in a while.", "예를 들어, 인맥이 흥미로워할 것 같은 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았더라도 그들과 그것을 공유하라.", "2025-고1-교육청-10월", ""], ["Managers of natural resources typically face market incentives that provide financial rewards for exploitation.", "천연자원 관리자들은 보통 (자원) 개발에 대해 금전적 보상을 제공하는 시장 유인에 직면한다.", "2024-수능", ""]]}, {"w": "subtle" s much as beginners when performing complex tasks or combining multiple tasks.", "흥미롭게도, 전문가들은 복잡한 과제를 수행하거나 여러 과제를 결합할 때 초보자들만큼 어려움을 겪지 않는다.", "2024-평가원-6월", ""]]}, {"w": "conduct", "ipa": "kənˈdʌkt (ⓥ) / ˈkɑːndʌkt (ⓝ)", "m": "ⓥ 수행하다, 실시하다, 지휘하다 ⓝ 행동, 처신", "d": [["ⓥ", "to organize and carry out an activity", "어떤 활동을 계획하고 실행하다"], ["ⓝ", "the way a person behaves", "사람이 행동하는 방식"]], "et": "con (함께) + ducere (이끌다)", "ex": "함께 이끌어 나가다", "g": [["유의어", "carry out (수행하다), perform (실행하다), run (실시하다)"], ["파생어", "conductor ⓝ 지휘자, 전도체"]], "c": ["conduct an experiment (실험을 하다)", "conduct a survey (설문 조사를 실시하다)", "conduct research (연구를 수행하다)"], "s": [["When we change our diets, especially when we do so quickly, we are effectively conducting huge experiments in nutrition.", "우리가 식단을 바꿀 때, 특히 빠르게 그렇게 할 때, 우리는 사실상 영양에 관한 거대한 실험을 하고 있는 것이다.", "본문", ""], ["In 2006, researchers conducted a study on the motivations for helping after the September 11th terrorist attacks against the United States.", "2006년에 연구자들은 미국에 대한 9·11 테러 공격 이후 사람들이 남을 돕는 동기에 관한 연구를 수행했다.", "2023-고2-교육청-9월", ""], ["With this purpose in mind, we believe your firm is ideal to carry out such a project.", "이러한 목적을 염두에 두고, 저희는 귀사가 그러한 프로젝트를 수행하기에 이상적이라고 생각합니다.", "2020-고1-교육청-6월", ""]]}, {"w": "experiment", "ipa": "ɪkˈsperɪmənt", "m": "ⓝ 실험 ⓥ 실험하다, 시도하다", "d": [["ⓝ", "a scientific test done to find out something or to prove an idea", "무언가를 알아내거나 생각을 증명하기 위해 하는 과학적 시험"], ["ⓥ", "to try out new ideas or methods", "새로운 생각이나 방법을 시도해 보다"]], "et": "experiri (시도하다, 경험하다)", "ex": "직접 시도해 보는 것", "g": [["유의어", "test (시험), trial (시도, 시험), investigation (조사)"], ["파생어", "experimental ⓐ 실험적인, experimentation ⓝ 실험"]], "c": ["conduct an experiment (실험을 하다)", "in an experiment (실험에서)", "experiment with (~을 시험 삼아 해 보다)"], "s": [["When we change our diets, especially when we do so quickly, we are effectively conducting huge experiments in nutrition.", "우리가 식단을 바꿀 때, 특히 빠르게 그렇게 할 때, 우리는 사실상 영양에 관한 거대한 실험을 하고 있는 것이다.", "본문", ""], ["Kivetz, Urminsky, and Zheng partnered with a café to test the motivating effect of illusory progress in an experiment.", "Kivetz, Urminsky, Zheng은 한 실험에서 착각에 의한 진척의 동기 부여 효과를 검증하기 위해 한 카페와 협력했다.", "2025-고1-교육청-10월", ""], ["Moreover, the ease with which AI can generate content can discourage the kind of struggle and experimentation that often leads to breakthroughs.", "게다가 AI가 콘텐츠를 쉽게 생성할 수 있다는 점은 종종 획기적인 발전으로 이어지는 종류의 분투와 실험을 가로막을 수 있다.", "2025-고1-교육청-10월", ""]]}, {"w": "nutrition", "ipa": "nuˈtrɪʃn", "m": "ⓝ 영양, 영양 섭취", "d": [["ⓝ", "the process of taking in and using food for health and growth", "건강과 성장을 위해 음식을 섭취하고 이용하는 과정"]], "et": "nutrire (먹이다, 기르다)", "ex": "몸을 먹여 기르는 것", "g": [["유의어", "diet (식단)"], ["파생어", "nutritional ⓐ 영양의, nutrient ⓝ 영양소, nutritious ⓐ 영양가 높은"]], "c": ["nutrition transition (영양 전환)", "nutritional science (영양학)", "proper nutrition (적절한 영양 섭취)"], "s": [["Nutritional science is still young and there is so much we do not know.", "영양학은 아직 초기 단계이며 우리가 모르는 것이 매우 많다.", "본문", ""], ["Max Kleiber, a pioneer in the study of animal biology, was best known for his research on animal nutrition and metabolism.", "동물 생물학 연구의 선구자인 Max Kleiber는 동물의 영양과 신진대사에 관한 연구로 가장 잘 알려져 있었다.", "2026-수능", ""], ["There are, however, combinations of foods that add up to a healthful or unhealthful diet.", "그러나 합쳐져서 건강한 식단이나 건강하지 않은 식단이 되는 음식의 조합은 존재한다.", "2023-고1-교육청-6월", ""]]}, {"w": "humility", "ipa": "hjuːˈmɪləti", "m": "ⓝ 겸손, 겸허", "d": [["ⓝ", "the quality of not thinking that you are better or more important than others", "자신이 다른 사람보다 낫거나 더 중요하다고 생각하지 않는 자질"]], "et": "humus (땅)", "ex": "땅처럼 자신을 낮추는 태도", "g": [["반의어", "pride (자만)"], ["관련어", "modest (겸손한), arrogant (오만한)"], ["파생어", "humble ⓐ 겸손한"]], "c": ["have humility (겸손함을 지니다)", "with humility (겸손하게)", "a sense of humility (겸손한 마음)"], "s": [["We ought to have more humility.", "우리는 더 많은 겸손함을 가져야 한다.", "본문", ""], ["The discovery that man's knowledge is not, and never has been, perfectly accurate has had a humbling and perhaps a calming effect upon the soul of modern man.", "인간의 지식이 완벽하게 정확하지 않으며 결코 그런 적이 없었다는 발견은 현대인의 영혼을 겸허하게 하고 아마도 진정시키는 효과를 가져왔다.", "2021-평가원-9월", ""], ["It is, therefore, my humble request to you to allow us to use old newspapers that have been stored in the school library.", "그러므로 학교 도서관에 보관된 오래된 신문을 저희가 사용할 수 있도록 허락해 주시기를 정중히 요청드립니다.", "2021-고1-교육청-11월", ""]]}, {"w": "millennium", "ipa": "mɪˈleniəm", "m": "ⓝ 천 년 (복수형 millennia)", "d": [["ⓝ", "a period of one thousand years", "천 년의 기간"]], "et": "mille (천) + annus (해, 년)", "ex": "천 개의 해", "g": [["유의어", "a thousand years (천 년)"], ["관련어", "century (100년, 세기), decade (10년)"]], "c": ["for thousands of years (수천 년 동안)", "for millennia (수천 년 동안)", "the new millennium (새천년)"], "s": [["If we have eaten certain foods in certain ways for millennia, we should assume until it is proven otherwise that there is probably a good reason why.", "만약 우리가 수천 년 동안 특정 음식을 특정한 방식으로 먹어 왔다면, 달리 입증될 때까지는 아마 그럴 만한 타당한 이유가 있을 것이라고 가정해야 한다.", "본문", ""], ["For millennia, the focus of those involved with food as a human and economic phenomenon was on its production, preservation, distribution, pricing and other practical concerns.", "수천 년 동안, 인간적·경제적 현상으로서의 음식에 관여한 사람들의 관심은 음식의 생산, 보존, 유통, 가격 책정 및 기타 실용적인 문제에 있었다.", "2026-평가원-6월", ""], ["However, humans have been replacing diverse natural habitats with artificial monoculture for millennia.", "그러나 인간은 수천 년 동안 다양한 자연 서식지를 인공적인 단일 경작지로 대체해 왔다.", "2021-평가원-9월", ""]]}, {"w": "assume", "ipa": "əˈsuːm", "m": "ⓥ 가정하다, 추정하다, (책임을) 맡다", "d": [["ⓥ", "to think that something is true without having proof; to take on a responsibility or role", "증거 없이 무언가가 사실이라고 생각하다; 책임이나 역할을 떠맡다"]], "et": "ad (~에) + sumere (취하다)", "ex": "어떤 생각을 사실로 취하다", "g": [["유의어", "suppose (가정하다), believe (믿다), take for granted (당연하게 여기다), take on (떠맡다)"], ["파생어", "assumption ⓝ 가정, 추정"]], "c": ["assume that (~라고 가정하다)", "it is safe to assume that (~라고 생각해도 무방하다)", "assume responsibility (책임을 지다)"], "s": [["We should assume that traditionally made fatty blood sausages are preferable to lean, factory-made salamis; that spoonfuls of honey are superior to sprinkles of sweeteners.", "우리는 전통 방식으로 만든 지방이 많은 블러드 소시지가 기름기 없는 공장제 살라미보다 더 낫고, 꿀 몇 숟가락이 감미료를 몇 번 뿌린 것보다 더 우수하다고 가정해야 한다.", "본문", ""], ["Most people assume that conflict is bad and that being in one's \"comfort zone\" is good.", "대부분의 사람들은 갈등은 나쁘고 자신의 '안전지대'에 머무는 것은 좋다고 생각한다.", "2021-고1-교육청-9월", ""], ["Suppose you have been working on the solution to a challenging technological problem for many years.", "당신이 수년 동안 어려운 기술적 문제의 해결책을 연구해 왔다고 가정해 보라.", "2026-고1-교육청-6월", ""]]}, {"w": "otherwise", "ipa": "ˈʌðərwaɪz", "m": "ad. 달리, 다르게, 그렇지 않으면", "d": [["ad.", "in a different way; if not, or else", "다른 방식으로; 그렇지 않으면"]], "et": "other (다른) + wise (방식)", "ex": "다른 방식으로", "g": [["유의어", "differently (다르게), or else (그렇지 않으면)"]], "c": ["until (it is) proven otherwise (달리 입증될 때까지)", "think otherwise (달리 생각하다)", "unless otherwise stated (달리 명시되지 않는 한)"], "s": [["If we have eaten certain foods in certain ways for millennia, we should assume until it is proven otherwise that there is probably a good reason why.", "만약 우리가 수천 년 동안 특정 음식을 특정한 방식으로 먹어 왔다면, 달리 입증될 때까지는 아마 그럴 만한 타당한 이유가 있을 것이라고 가정해야 한다.", "본문", ""], ["A greater variety of food leads people to eat more than they would otherwise.", "음식의 종류가 더 다양하면 사람들은 그렇지 않을 때보다 더 많이 먹게 된다.", "2018-수능", ""], ["Moreover, commitments make people willing to perform actions that they would not otherwise perform.", "게다가 약속은 사람들이 그렇지 않았다면 하지 않았을 행동을 기꺼이 하게 만든다.", "2025-고2-교육청-3월", ""]]}, {"w": "neatly", "ipa": "ˈniːtli", "m": "ⓐⓓ 깔끔하게, 딱 맞게", "d": [["ⓐⓓ", "in a tidy way; exactly and simply", "깔끔하게; 정확하고 간단하게"]], "et": "neat (깔끔한) + -ly (부사)", "ex": "깔끔하게 딱 들어맞게", "g": [["파생어", "neat ⓐ 깔끔한"], ["유의어", "precisely (정확히)"]], "c": ["fit neatly (딱 들어맞다)", "be neatly set apart from ~ (~와 깔끔하게 구분되다)"], "s": [["Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly processed ones that do.", "현대의 식단 기준표에 딱 들어맞지 않는 전통 음식이, 그 기준에 들어맞는 고도로 가공된 음식보다 대체로 선택되어야 한다.", "본문", ""], ["Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.", "어떤 사람들은 사람들이 책으로 하는 다른 모든 일과 깔끔하게 구분될 수 있는, 읽기라고 알려진 논리적으로 일관된 단일한 개념이 있다고 주장한다.", "2024-고2-교육청-10월", ""]]}, {"w": "contemporary", "ipa": "kənˈtempəreri", "m": "ⓐ 현대의, 동시대의 ⓝ 동시대 사람", "d": [["ⓐ", "belonging to the present time; living or happening at the same time", "현재에 속하는; 같은 시대에 살거나 일어나는"], ["ⓝ", "a person living at the same time as another", "다른 사람과 같은 시대에 사는 사람"]], "et": "con (함께) + tempus (시간) + -ary", "ex": "같은 시간에 속한", "g": [["유의어", "modern (현대의), current (현재의), present-day (오늘날의)"], ["반의어", "ancient (고대의), traditional (전통적인)"]], "c": ["contemporary society (현대 사회)", "contemporary art (현대 미술)", "a contemporary of (~와 동시대 사람)"], "s": [["Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly processed ones that do.", "현대의 식단 기준에 깔끔하게 들어맞지 않는 전통 음식이, 그 기준에 들어맞는 고도로 가공된 음식보다 일반적으로 선택되어야 한다.", "본문", ""], ["In our contemporary world, television and film are particularly influential media, and it is likely that the introduction of more scientist-heroes would help to make science more attractive.", "우리의 현대 세계에서 텔레비전과 영화는 특히 영향력 있는 매체이며, 더 많은 과학자 영웅을 등장시키는 것은 과학을 더 매력적으로 만드는 데 도움이 될 것이다.", "2022-평가원-6월", ""], ["Many modern pop musicians, one example being Paul McCartney, can't read music at all.", "많은 현대 팝 음악가들은, Paul McCartney가 그 한 예인데, 악보를 전혀 읽지 못한다.", "2020-평가원-6월", ""]]}, {"w": "dietary", "ipa": "ˈdaɪəteri", "m": "ⓐ 식사의, 식단의", "d": [["ⓐ", "relating to the food that people eat", "사람들이 먹는 음식과 관련된"]], "et": "diet (식단) + -ary (형용사)", "ex": "식단에 관한", "g": [["관련어", "diet (식단), nutrition (영양)"]], "c": ["the dietary food plate (식단 기준표)", "dietary fat (식이 지방)"], "s": [["Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly processed ones that do.", "현대의 식단 기준표에 딱 들어맞지 않는 전통 음식이, 그 기준에 들어맞는 고도로 가공된 음식보다 대체로 선택되어야 한다.", "본문", ""], ["Harvard researchers who made claims in the late 1960s about the problems with dietary fat, leading the nation away from perceiving sugar as one of the main causes in health problems, were funded in part by the sugar industry.", "1960년대 후반에 식이 지방의 문제점을 주장하여 국민이 설탕을 건강 문제의 주요 원인 중 하나로 인식하지 않게 만든 하버드 연구자들은 일부 설탕 업계의 자금 지원을 받았다.", "2025-고2-교육청-3월", ""]]}, {"w": "processed", "ipa": "ˈprɑːsest", "m": "ⓐ 가공된, 처리된", "d": [["ⓐ", "(of food) treated or changed by an industrial method, often with chemicals added", "(음식이) 산업적 방법으로 처리되거나 변형된, 흔히 화학 물질이 첨가된"]], "et": "pro (앞으로) + cedere (가다)", "ex": "여러 단계를 거쳐 앞으로 나아가게 처리된", "g": [["유의어", "manufactured (제조된), factory-made (공장에서 만든), refined (정제된), artificial (인공적인)"], ["반의어", "natural (자연 그대로의), raw (날것의), fresh (신선한)"], ["파생어", "process ⓝ 과정 ⓥ 처리하다, processing ⓝ 가공, 처리"]], "c": ["highly processed food (고도로 가공된 식품)", "processed meat (가공육)", "process information (정보를 처리하다)"], "s": [["Traditional foods that don't fit neatly on the contemporary dietary food plate should generally be chosen over highly processed ones that do.", "현대의 식단 기준에 깔끔하게 들어맞지 않는 전통 음식이, 그 기준에 들어맞는 고도로 가공된 음식보다 일반적으로 선택되어야 한다.", "본문", ""], ["But do you really know what you are eating when you buy processed foods, canned foods, and packaged goods?", "하지만 가공식품, 통조림 식품, 포장 식품을 살 때 당신은 자신이 무엇을 먹고 있는지 정말 알고 있는가?", "2020-고1-교육청-3월", ""], ["Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.", "신경 과학의 발견에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리된다.", "2024-고2-교육청-10월", ""]]}, {"w": "preferable", "ipa": "ˈprefrəbl", "m": "ⓐ 더 나은, 더 바람직한", "d": [["ⓐ", "better or more suitable than something else", "다른 것보다 더 낫거나 더 적합한"]], "et": "prae (앞에) + ferre (나르다) + -able", "ex": "앞에 놓을 만한", "g": [["유의어", "better (더 나은), superior (우월한), more desirable (더 바람직한)"], ["반의어", "inferior (열등한), undesirable (바람직하지 않은)"], ["파생어", "prefer ⓥ 선호하다, preference ⓝ 선호"]], "c": ["be preferable to (~보다 낫다; than 쓰지 않음)", "it is preferable to do (~하는 것이 바람직하다)"], "s": [["We should assume that traditionally made fatty blood sausages are preferable to lean, factory-made salamis; that spoonfuls of honey are superior to sprinkles of sweeteners.", "우리는 전통 방식으로 만든 지방이 많은 블러드 소시지가 기름기 없는 공장제 살라미보다 더 낫고, 꿀 몇 숟가락이 감미료를 몇 번 뿌린 것보다 더 우수하다고 가정해야 한다.", "본문", ""], ["When a person's beliefs are threatened by an \"inconvenient fact,\" sometimes it is preferable to challenge the fact.", "어떤 사람의 신념이 '불편한 사실'에 의해 위협받을 때, 때로는 그 사실에 이의를 제기하는 것이 더 낫다.", "2020-평가원-9월", ""], ["The above graph shows the percentages of U.K. consumers who preferred purchasing clothes from sustainable brands by age and gender in 2020.", "위 도표는 2020년 연령 및 성별에 따라 지속 가능한 브랜드의 옷을 구매하는 것을 선호한 영국 소비자들의 비율을 보여 준다.", "2025-고1-교육청-10월", ""]]}, {"w": "superior", "ipa": "suːˈpɪriər", "m": "ⓐ 우수한, 우월한, 상급의 ⓝ 상사, 윗사람", "d": [["ⓐ", "better in quality or higher in rank than something or someone else", "다른 것이나 다른 사람보다 질이 더 좋거나 지위가 더 높은"], ["ⓝ", "a person of higher rank", "더 높은 지위의 사람"]], "et": "super (위에) + -ior (비교급)", "ex": "더 위에 있는", "g": [["유의어", "better (더 나은), excellent (뛰어난), preferable (더 나은)"], ["반의어", "inferior (열등한)"], ["파생어", "superiority ⓝ 우월성"]], "c": ["be superior to (~보다 우수하다; than 쓰지 않음)", "superior quality (우수한 품질)"], "s": [["We should assume that traditionally made fatty blood sausages are preferable to lean, factory-made salamis; that spoonfuls of honey are superior to sprinkles of sweeteners.", "우리는 전통 방식으로 만든 지방이 많은 블러드 소시지가 기름기 없는 공장제 살라미보다 더 낫고, 꿀 몇 숟가락이 감미료를 몇 번 뿌린 것보다 더 우수하다고 가정해야 한다.", "본문", ""], ["But what happens when the only available comparison target we have is superior or better off than we are?", "하지만 우리가 가진 유일한 비교 대상이 우리보다 우월하거나 형편이 더 나을 때는 어떤 일이 일어나는가?", "2018-평가원-9월", ""], ["\"Sophia, your choice was excellent!\" she said with a delighted smile.", "\"Sophia, 네 선택은 훌륭했어!\"라고 그녀는 기쁜 미소를 지으며 말했다.", "2022-평가원-6월", ""]]}, {"w": "witness", "ipa": "ˈwɪtnəs", "m": "ⓥ 목격하다, 보다 ⓝ 목격자, 증인", "d": [["ⓥ", "to see something happen", "어떤 일이 일어나는 것을 보다"], ["ⓝ", "a person who sees an event, such as a crime or an accident", "범죄나 사고 같은 사건을 본 사람"]], "et": "wit (알다) + -ness", "ex": "직접 보아서 아는 사람", "g": [["유의어", "observe (관찰하다), see (보다), notice (알아차리다)"]], "c": ["witness a change (변화를 목격하다)", "witness an accident (사고를 목격하다)", "bear witness to (~을 증언하다, 보여 주다)"], "s": [["Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들로 하여금 자신들의 식단이 너무 멀리 와 버린 것은 아닌지 의문을 갖게 해야 한다.", "본문", ""], ["We are now witnessing a fundamental shift in our resource demands.", "우리는 지금 자원 수요의 근본적인 변화를 목격하고 있다.", "2020-수능", ""], ["Knight left school in 1850, at age 12, to earn money for her family at a nearby textile factory, where she witnessed a fellow worker injured by faulty equipment.", "Knight는 1850년 12살의 나이에 학교를 그만두고 근처 직물 공장에서 가족을 위해 돈을 벌었는데, 그곳에서 동료 노동자가 결함 있는 장비 때문에 다치는 것을 목격했다.", "2022-고1-교육청-11월", ""]]}, {"w": "fare", "ipa": "fer", "m": "ⓥ (잘/못) 지내다, 해 나가다 ⓝ 요금, 운임", "d": [["ⓥ", "to be successful or unsuccessful in a particular situation", "특정 상황에서 잘 해 나가거나 잘 해 나가지 못하다"], ["ⓝ", "the money you pay to travel by bus, train, plane, etc.", "버스, 기차, 비행기 등을 타기 위해 내는 돈"]], "et": "faran (고대 영어: 가다, 여행하다)", "ex": "길을 가다 → 살아가다 / 여행 요금", "g": [["유의어", "do (해 나가다), get along (지내다), manage (그럭저럭 해내다), cope (대처하다)"], ["관련어", "fee (요금)"]], "c": ["fare well / poorly (잘 / 형편없이 지내다)", "fare better than (~보다 더 잘 해내다)", "bus fare (버스 요금)"], "s": [["Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들로 하여금 자신들의 식단이 너무 멀리 와 버린 것은 아닌지 의문을 갖게 해야 한다.", "본문", ""], ["We usually get along best with people who we think are like us.", "우리는 보통 우리와 비슷하다고 생각하는 사람들과 가장 잘 지낸다.", "2022-고1-교육청-3월", ""], ["When at last they arrived at the restaurant, to make matters worse, they were charged three times more than the usual fare due to the heavy traffic.", "마침내 식당에 도착했을 때, 설상가상으로 그들은 교통 체증 때문에 평소 요금보다 세 배나 많은 금액을 청구받았다.", "2020-평가원-9월", ""]]}, {"w": "undergo", "ipa": "ˌʌndərˈɡoʊ", "m": "ⓥ 겪다, 경험하다, (수술 등을) 받다 (undergo-underwent-undergone)", "d": [["ⓥ", "to experience something, especially a change or something unpleasant", "특히 변화나 불쾌한 일을 경험하다"]], "et": "under (아래) + go (가다)", "ex": "어떤 상황 아래를 지나가다", "g": [["유의어", "experience (경험하다), go through (겪다), suffer (겪다)"]], "c": ["undergo a transition (전환을 겪다)", "undergo change (변화를 겪다)", "undergo surgery (수술을 받다)"], "s": [["Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들로 하여금 자신들의 식단이 너무 멀리 와 버린 것은 아닌지 의문을 갖게 해야 한다.", "본문", ""], ["Similarly, genomes that have undergone more copying processes will have gathered more mistakes.", "마찬가지로, 더 많은 복제 과정을 거친 유전체는 더 많은 오류를 축적했을 것이다.", "2024-고2-교육청-10월", ""], ["Once we have received that information and it has gone through a cognitive validation, we accept that person as more trustworthy.", "일단 우리가 그 정보를 받고 그것이 인지적 검증을 거치면, 우리는 그 사람을 더 신뢰할 만하다고 받아들인다.", "2024-평가원-6월", ""]]}, {"w": "transition", "ipa": "trænˈzɪʃn", "m": "ⓝ 전환, 이행, 과도기", "d": [["ⓝ", "the process of changing from one state or condition to another", "한 상태나 조건에서 다른 상태로 바뀌는 과정"]], "et": "trans (건너) + ire (가다)", "ex": "한 상태에서 다른 상태로 건너감", "g": [["유의어", "change (변화), shift (전환), conversion (전환)"]], "c": ["a nutrition transition (영양 전환)", "the transition from A to B (A에서 B로의 전환)", "a period of transition (과도기)"], "s": [["Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들로 하여금 자신들의 식단이 너무 멀리 와 버린 것은 아닌지 의문을 갖게 해야 한다.", "본문", ""], ["The shift from analog to digital technology significantly influenced how music was produced.", "아날로그에서 디지털 기술로의 전환은 음악이 제작되는 방식에 상당한 영향을 미쳤다.", "2024-평가원-9월", ""], ["Greeks and Romans were the first to make the transition from modeling shadows to cast shadows, a practice that implied a consistent light source, a fixed point of view, and an understanding of geometric projection.", "그리스인과 로마인은 입체감을 표현하는 그림자에서 드리운 그림자로 처음 전환한 사람들이었는데, 이 방식은 일관된 광원, 고정된 시점, 그리고 기하학적 투영에 대한 이해를 함축했다.", "2025-평가원-6월", ""]]}, {"w": "question", "ipa": "ˈkwestʃən", "m": "ⓥ 의문을 제기하다, 질문하다 ⓝ 질문, 문제", "d": [["ⓥ", "to have or express doubts about something; to ask someone questions", "무언가에 대해 의심을 품거나 표현하다; 누군가에게 질문하다"]], "et": "quaerere (찾다, 묻다)", "ex": "진실을 찾아 묻다", "g": [["유의어", "doubt (의심하다), challenge (이의를 제기하다), reconsider (재고하다), wonder (궁금해하다)"], ["반의어", "accept (받아들이다), trust (믿다)"], ["파생어", "questionable ⓐ 의심스러운"]], "c": ["question whether (~인지 의문을 갖다)", "make A question B (A가 B에 의문을 갖게 하다)", "beyond question (의심의 여지 없이)"], "s": [["Witnessing how poorly traditional societies are faring as they undergo a nutrition transition should make those who have already completed it question whether their diets have moved too far.", "전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은, 이미 그 전환을 마친 사람들로 하여금 자신들의 식단이 너무 멀리 와 버린 것은 아닌지 의문을 갖게 해야 한다.", "본문", ""], ["Given the level of anonymity with all that resides on the Internet, it's sensible to question the validity of any data that you may receive.", "인터넷에 존재하는 모든 것이 익명성을 띤다는 점을 고려하면, 당신이 받을 수 있는 어떤 데이터든 그 타당성에 의문을 제기하는 것이 현명하다.", "2024-평가원-6월", ""], ["Indeed, questioning the truth of a statement and then choosing not to believe it requires additional mental steps.", "실제로 어떤 진술의 ly conservation organizations, including the Audubon Society, and helped with the establishment of Glacier National Park in 1910.", "Grinnell은 Audubon 협회를 포함한 초기 자연 보호 단체들을 세우는 데 기여했고, 1910년 Glacier 국립공원의 설립을 도왔다.", "2026-고1-교육청-6월", ""]]}, {"w": "transparency", "ipa": "trænsˈpærənsi", "m": "ⓝ 투명성, 투명함", "d": [["ⓝ", "the quality of being open and honest so that others can see what is being done", "다른 사람들이 무슨 일이 행해지는지 볼 수 있도록 개방적이고 정직한 성질"]], "et": "trans (통과하여) + parere (보이다) + -ency", "ex": "속까지 꿰뚫어 보이는 성질", "g": [["유의어", "openness (개방성), disclosure (공개), clarity (명확성), honesty (정직)"], ["반의어", "secrecy (비밀 유지)"], ["파생어", "transparent ⓐ 투명한, 명백한"]], "c": ["complete transparency (완전한 투명성)", "lack of transparency (투명성 부족)", "increase transparency (투명성을 높이다)"], "s": [["They have grown up in a world where information is freely available, and they expect complete transparency from the brands they support.", "그들은 정보를 자유롭게 이용할 수 있는 세상에서 자랐고, 자신이 지지하는 브랜드에 완전한 투명성을 기대한다.", "본문", ""], ["Transparency is vital.", "투명성은 매우 중요하다.", "본문", ""], ["You invite openness and collaboration when you speak with your palms facing up.", "손바닥을 위로 향한 채 말하면 개방성과 협력을 이끌어 낼 수 있다.", "2025-고1-교육청-3월", ""]]}, {"w": "vital", "ipa": "ˈvaɪtl", "m": "ⓐ 매우 중요한, 필수적인; 생명의, 활기 있는", "d": [["ⓐ", "necessary for the success or existence of something; full of energy", "무언가의 성공이나 존재에 꼭 필요한; 활력이 넘치는"]], "et": "vita (생명)", "ex": "생명에 꼭 필요한", "g": [["유의어", "essential (필수적인), crucial (결정적인), necessary (필요한)"], ["반의어", "unnecessary (불필요한), minor (사소한)"]], "c": ["be vital to/for (~에 필수적이다)", "play a vital role (매우 중요한 역할을 하다)", "vital organs (생명 유지에 필수적인 장기)"], "s": [["Transparency is vital.", "투명성은 매우 중요하다.", "본문", ""], ["They play a vital role in this area's ecosystem as a wide range of animals, as well as humans, consume them.", "인간뿐만 아니라 매우 다양한 동물들이 그것들을 먹기 때문에, 그것들은 이 지역의 생태계에서 매우 중요한 역할을 한다.", "2020-평가원-6월", ""], ["When our worries exceed our control, however, they cause us unnecessary suffering.", "그러나 걱정이 우리의 ": "ⓝ 책임, 책임감, 설명 의무", "d": [["ⓝ", "the fact of being responsible for your decisions or actions and being expected to explain them", "자신의 결정이나 행동에 책임이 있고 그것을 설명할 것이 기대되는 것"]], "et": "ad (~에게) + computare (계산하다) + -ability", "ex": "자신의 행동을 계산해 설명할 수 있는 상태", "g": [["유의어", "responsibility (책임), liability (법적 책임)"], ["파생어", "accountable ⓐ 책임이 있는"]], "c": ["lack accountability (책임감이 부족하다)", "be held accountable for (~에 대해 책임을 지다)"], "s": [["Gen Z is skeptical of large corporations and institutions that lack accountability.", "Z세대는 책임감이 부족한 대기업과 기관들을 의심한다.", "본문", ""], ["At the heart of this process is the tension between the professions' pursuit of autonomy and the public's demand for accountability.", "이 과정의 핵심에는 전문직의 자율성 추구와 대중의 책임성 요구 사이의 긴장이 있다.", "2022-평가원-9월", ""], ["However, every individual needs to take responsibility for combating this threat by becoming more information literate.", "그러나 모든 개인은 정보 활용 능력을 더 갖춤으로써 이 위협에 맞서는 데 책임을 질 필요가 있다.", "2021-고1-교육청-6월", ""]]}, {"w": "available", "ipa": "əˈveɪləbl", "m": "ⓐ 이용할 수 있는, 구할 수 있는; 시간이 있는", "d": [["ⓐ", "able to be used, obtained, or reached; free to do something", "사용하거나 얻거나 연락할 수 있는; 무언가를 할 시간이 있는"]], "et": "ad (~에) + valere (가치 있다, 힘이 있다) + -able", "ex": "쓸모 있게 손에 닿는", "g": [["유의어", "accessible (접근 가능한), free (시간이 있는)"], ["반의어", "unavailable (이용할 수 없는), inaccessible (접근할 수 없는)"], ["파생어", "availability ⓝ 이용 가능성"]], "c": ["freely available (자유롭게 이용할 수 있는)", "available to (~가 이용할 수 있는)", "readily available (손쉽게 구할 수 있는)"], "s": [["They have grown up in a world where information is freely available, and they expect complete transparency from the brands they support.", "그들은 정보를 자유롭게 이용할 수 있는 세상에서 자랐고, 자신이 지지하는 브랜드에 완전한 투명성을 기대한다.", "본문", ""], ["Human beings have evolved to make the most of the resources available to them in ways that are subtle and complicated.", "인간은 미묘하고 복잡한 방식으로 자신이 이용할 수 있는 자원을 최대한 활용하도록 진화해 왔다.", "2025-고1-교육청-10월", ""], ["Shoot a bow like Robin Hood. (only available for ages 6 and above)", "로빈 후 s the most important step in understanding business ethics.", "윤리적 문제를 인식하는 것은 기업 윤리를 이해하는 데 가장 중요한 단계이다.", "2023-평가원-9월", ""]]}, {"w": "practice", "ipa": "ˈpræktɪs", "m": "ⓝ 관행, 관습; 실천; 연습 ⓥ 연습하다, 실천하다", "d": [["ⓝ", "a usual way of doing something; the actual doing of something; repeated exercise to improve a skill", "무언가를 하는 일상적인 방식; 실제로 행하는 것; 기술을 향상시키기 위한 반복 연습"]], "et": "praktikos (그리스어: 실행하는)", "ex": "실제로 행하는 것", "g": [["유의어", "custom (관습), habit (습관), method (방식)"], ["반의어", "theory (이론)"], ["파생어", "practical ⓐ 실용적인"]], "c": ["banking practices (은행 업무 관행)", "put A into practice (A를 실행에 옮기다)", "common practice (흔한 관행)"], "s": [["Moreover, ethical banking practices are more important than ever.", "게다가, 윤리적인 은행 업무 관행이 그 어느 때보다 중요하다.", "본문", ""], ["More often than not, it's good to adopt the practices of those around you.", "대개는 주변 사람들의 관행을 받아들이는 것이 좋다.", "2023-고1-교육청-3월", ""], ["Overly rigid habits and conventions, no matter how well-considered or well-intentioned, threaten innovation.", "지나치게 경직된 습관과 관습은, 아무리 잘 숙고되고 좋은 의도를 지녔더라도, 혁신을 위협한다.", "2025-평가원-9월", ""]]}, {"w": "implication", "ipa": "ˌɪmplɪˈkeɪʃn", "m": "ⓝ 영향, 결과; 함축, 암시", "d": [["ⓝ", "a possible effect or result of an action or decision; something that is suggested without being stated directly", "어떤 행동이나 결정의 가능한 영향이나 결과; 직접 언급되지 않고 암시되는 것"]], "et": "in (안으로) + plicare (접다) + -ation", "ex": "안으로 접혀 들어가 숨어 있는 의미나 결과", "g": [["유의어", "consequence (결과), effect (영향), impact (영향), suggestion (암시)"], ["파생어", "imply ⓥ 암시하다, 함축하다"]], "c": ["ethical implications (윤리적 영향)", "have implications for (~에 영향을 미치다)", "by implication (함축적으로, 암암리에)"], "s": [["Gen Z cares about the environment, social justice, and the ethical implications of their financial decisions.", "Z세대는 환경, 사회 정의, 그리고 자신의 금융 결정이 갖는 윤리적 영향에 관심을 가진다.", "본문", ""], ["Governmental substitution for citizen duty and involvement can have serious implications.", "정부가 시민의 의무와 참여를 대신하는 것은 심각한 영향을 미칠 수 있다.", "2022-평가원-9월", ""], ["These changing motivational goals in old age have implications for attention to and processing of social cues from the environment.", "노년기의 이러한 동기적 목표 변화는 환경으로부터 오는 사회적 단서에 주의를 기울이고 그것을 처리하는 데 영향을 미친다.", "2022-평가원-6월", ""]]}, {"w": "sustainable", "ipa": "səˈsteɪnəbl", "m": "ⓐ 지속 가능한, 환경을 파괴하지 않는", "d": [["ⓐ", "able to continue over time without damaging the environment or using up resources", "환경을 훼손하거나 자원을 고갈시키지 않고 오랫동안 지속될 수 있는"]], "et": "sub (아래에서) + tenere (붙잡다) + -able", "ex": "아래에서 떠받쳐 계속 유지할 수 있는", "g": [["유의어", "renewable (재생 가능한), eco-friendly (친환경적인), lasting (지속적인)"], ["반의어", "unsustainable (지속 불가능한)"], ["파생어", "sustain ⓥ 지속시키다, sustainability ⓝ 지속 가능성"]], "c": ["sustainable investing (지속 가능한 투자)", "sustainable development (지속 가능한 발전)", "environmental sustainability (환경적 지속 가능성)"], "s": [["They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund harmful practices.", "그들은 지속 가능한 투자, 자신의 가치관에 맞는 기업을 지원하는 것, 그리고 자신의 돈이 해로운 관행에 자금을 대는 데 쓰이지 않도록 보장하는 것에 관심이 있다.", "본문", ""], ["This type of farming is sustainable because the soil stays healthy.", "이런 유형의 농업은 토양이 건강하게 유지되기 때문에 지속 가능하다.", "2024-고1-교육청-3월", ""], ["The present rate of human consumption is completely unsustainable.", "현재의 인간 소비 속도는 전혀 지속 가능하지 않다.", "2021-수능", ""]]}, {"w": "ensure", "ipa": "ɪnˈʃʊr", "m": "ⓥ 보장하다, 반드시 ~하게 하다", "d": [["ⓥ", "to make certain that something happens or is true", "어떤 일이 반드시 일어나거나 사실이 되도록 하다"]], "et": "en (~하게 만들다) + sure (확실한)", "ex": "확실하게 만들다", "g": [["유의어", "guarantee (보장하다), make sure (확실히 하다), secure (확보하다)"]], "c": ["ensure that (반드시 ~하도록 하다)", "ensure safety (안전을 보장하다)", "ensure success (성공을 보장하다)"], "s": [["They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund harmful practices.", "그들은 지속 가능한 투자, 자신의 가치관에 맞는 기업을 지원하는 것, 그리고 자신의 돈이 해로운 관행에 자금을 대는 데 쓰이지 않도록 보장하는 것에 관심이 있다.", "본문", ""], ["Such reporting helps ensure that private investors have reliable information on which to base their investment decisions.", "그러한 보고는 민간 투자자들이 투자 결정의 근거로 삼을 신뢰할 만한 정보를 갖도록 보장하는 데 도움이 된다.", "2018-평가원-9월", ""], ["Managers of each department must make sure that all dangerous equipment and machinery are safely stored.", "각 부서의 관리자는 모든 위험한 장비와 기계가 안전하게 보관되도록 반드시 확인해야 한다.", "2019-평가원-6월", ""]]}, {"w": "fund", "ipa": "fʌnd", "m": "ⓥ 자금을 대다 ⓝ 자금, 기금", "d": [["ⓥ", "to provide money for an activity or organization", "어떤 활동이나 조직에 돈을 제공하다"], ["ⓝ", "an amount of money saved or collected for a purpose", "어떤 목적을 위해 모으거나 저축한 돈"]], "et": "fundus (바닥, 기초)", "ex": "일의 바탕이 되는 돈", "g": [["유의어", "finance (자금을 조달하다), pay for (~의 비용을 대다), sponsor (후원하다), support (지원하다)"], ["파생어", "funding ⓝ 자금 (지원)"]], "c": ["fund a project (프로젝트에 자금을 대다)", "raise funds (자금을 모으다)", "be funded by (~의 자금 지원을 받다)"], "s": [["They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund harmful practices.", "그들은 지속 가능한 투자, 자신의 가치관에 맞는 기업을 지원하는 것, 그리고 자신의 돈이 해로운 관행에 자금을 대는 데 쓰이지 않도록 보장하는 것에 관심이 있다.", "본문", ""], ["Though we wish to participate in the event, we do not have the necessary funds to travel to London.", "저희는 그 행사에 참가하고 싶지만, 런던까지 가는 데 필요한 자금이 없습니다.", "2022-고1-교육청-3월", ""], ["To fund her private lessons, she began performing in Atlantic City, adopting the stage name \"Nina Simone.\"", "개인 레슨 비용을 마련하기 위해 그녀는 'Nina Simone'이라는 예명을 쓰며 Atlantic City에서 공연하기 시작했다.", "2025-고2-교육청-10월", ""]]}, {"w": "beneficial", "ipa": "ˌbenɪˈfɪʃl", "m": "ⓐ 유익한, 이로운", "d": [["ⓐ", "having a good effect; helpful or useful", "좋은 영향을 주는; 도움이 되거나 유용한"]], "et": "bene (좋게) + facere (하다) + -ial", "ex": "좋은 일을 해 주는", "g": [["유의어", "helpful (도움이 되는), advantageous (유리한), favorable (유리한)"], ["반의어", "harmful (해로운), damaging (손상을 주는)"], ["파생어", "benefit ⓝ 이익 ⓥ 이익을 얻다"]], "c": ["be beneficial to/for (~에 유익하다)", "mutually beneficial (상호 이익이 되는)", "beneficial effects (유익한 효과)"], "s": [["They are interested in sustainable investing, supporting businesses that match their values, and ensuring that their money is not being used to fund harmful practices.", "그들은 지속 가능한 투자, 자신의 가치관에 맞는 기업을 지원하는 것, 그리고 자신의 돈이 해로운 관행에 자금을 대는 데 쓰이지 않도록 보장하는 것에 관심이 있다.", "본문", ""], ["Gardening is particularly beneficial for those who find traditional exercise challenging.", "정원 가꾸기는 전통적인 운동을 어려워하는 사람들에게 특히 유익하다.", "2025-고1-교육청-9월", ""], ["This results in the exclusion or displacement of the poor neighbourhood's residents, who were intended to benefit from the ecosystem services provided by the new green space.", "이것은 새로운 녹지 공간이 제공하는 생태계 서비스로부터 혜택을 받도록 의도되었던 가난한 지역 주민들의 배제나 이주를 초래한다.", "2025-고1-교육청-10월", ""]]}, {"w": "responsible", "ipa": "rɪˈspɑːnsəbl", "m": "ⓐ 책임 있는, 책임감 있는; (~의) 원인이 되는", "d": [["ⓐ", "having the duty of dealing with something; sensible and able to be trusted; being the cause of something", "무언가를 처리할 의무가 있는; 분별 있고 믿을 수 있는; 무언가의 원인이 되는"]], "et": "re (다시) + spondere (약속하다) + -ible", "ex": "약속에 응답할 수 있는", "g": [["유의어", "ethical (윤리적인), accountable (책임이 있는), reliable (믿을 만한), dependable (의지할 수 있는)"], ["반의어", "irresponsible (무책임한)"], ["파생어", "responsibility ⓝ 책임"]], "c": ["socially responsible (사회적으로 책임 있는)", "be responsible for (~에 책임이 있다; ~의 원인이 되다)", "take responsibility for (~에 책임을 지다)"], "s": [["Banks that offer socially responsible investment opportunities and are committed to environmental sustainability will attract Gen Z's attention.", "사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능성에 전념하는 은행들이 Z세대의 관심을 끌 것이다.", "본문", ""], ["In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors.", "이런 의미에서 정신적 발달은 사회적 양식을 내면화하여 점차 다른 책임감 있는 행위자들 사이에서 책임감 있는 행위자가 되는 것으로 이루어진다.", "2024-고2-교육청-9월", ""], ["Or they think that it is irresponsible, immature, and childish to give themselves regularly over to play.", "또는 그들은 규칙적으로 놀이에 몰두하는 것이 무책임하고 미성숙하며 유치하다고 생각한다.", "2020-수능", ""]]}, {"w": "commit
