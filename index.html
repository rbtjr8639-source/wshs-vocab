<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우송고 고1 모의고사 어휘 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Layout: school-issued word book. Navy masthead with the WSH mark, sticky exam + question bar, one ruled entry per word (identity | relations, examples underneath). */
:root{
  --paper:#f4f6fa; --sheet:#ffffff; --ink:#18213a; --muted:#5b6478; --rule:#dce1ea;
  --navy:#21409a; --navy-ink:#ffffff; --navy-soft:#e8ecf7;
  --green:#3f8f33; --green-soft:#e6f2e2; --yellow:#f1b442; --yellow-ink:#7a5208; --yellow-soft:#fdf2db;
  --red:#b23a48; --red-soft:#f8e6e8;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf2; --muted:#9ba4b8; --rule:#2a3350;
    --navy:#8ea6ec; --navy-ink:#0f1424; --navy-soft:#1f2a4a;
    --green:#86cf78; --green-soft:#1b2e1d; --yellow:#f1b442; --yellow-ink:#f3c66d; --yellow-soft:#2f2614;
    --red:#ef8f9b; --red-soft:#3a1f25; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e7eaf2; --muted:#9ba4b8; --rule:#2a3350;
  --navy:#8ea6ec; --navy-ink:#0f1424; --navy-soft:#1f2a4a;
  --green:#86cf78; --green-soft:#1b2e1d; --yellow:#f1b442; --yellow-ink:#f3c66d; --yellow-soft:#2f2614;
  --red:#ef8f9b; --red-soft:#3a1f25; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.62}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}

/* masthead */
header.mast{background:var(--sheet);border-bottom:1px solid var(--rule)}
header.mast .wrap{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;padding-top:20px;padding-bottom:18px}
.plate{background:#fff;border-radius:6px;padding:6px 8px;line-height:0;border:1px solid var(--rule)}
.plate img{height:58px;width:auto;display:block}
.mast h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.mast .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.stripe{height:4px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--yellow) 70% 85%,var(--green) 85% 100%)}

/* sticky bar */
nav.bar{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(0,0,0,.02)}
nav.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exams{display:inline-flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden}
.exam{font:inherit;font-size:13.5px;font-weight:700;border:0;background:transparent;color:var(--navy);padding:6px 12px;cursor:pointer}
.exam+.exam{border-left:1px solid var(--navy)}
.exam[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.tools{display:flex;gap:8px;margin-left:auto}
#q{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);width:170px}
.toggle{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:inherit;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid transparent;background:transparent;color:var(--muted);padding:3px 10px;border-radius:4px;cursor:pointer}
.tab:hover{color:var(--ink);background:var(--paper)}
.tab[aria-pressed="true"]{color:var(--ink);border-color:var(--rule);background:var(--paper);box-shadow:inset 0 -3px 0 var(--yellow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* key */
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:14px 0 0}
.key span{display:inline-flex;align-items:center;gap:6px}

main{padding-bottom:64px}
section.qsec{margin-top:30px}
.qhead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:end;padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:12px}
.qno{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums;position:relative;padding-right:4px}
.qno small{font-family:var(--body);font-size:13px;font-weight:700;margin-left:1px}
.qtitle{font-size:16.5px;font-weight:700;text-wrap:balance}
.qtitle .typ{display:inline-block;font-size:12px;font-weight:700;color:var(--yellow-ink);background:var(--yellow-soft);border-radius:3px;padding:0 6px;margin-right:8px;vertical-align:2px}
.qcnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}

article.card{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--navy);border-radius:4px;padding:16px 20px 14px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:10px 28px}
.no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.word{font-family:var(--display);font-size:25px;font-weight:700;color:var(--navy)}
.ipa{font-family:var(--display);color:var(--muted);font-size:15px}
.mean{font-weight:700;font-size:15.5px;margin-top:2px}
.def{font-size:13.5px;color:var(--muted);margin-top:5px}
.def .en{font-family:var(--display);font-style:italic;color:var(--ink);font-size:14.5px}
.ety{margin-top:10px;font-size:13.5px;border-left:3px solid var(--yellow);background:var(--paper);padding:6px 10px}
.ety b{font-weight:700;margin-right:4px}
.rel{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.rrow{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:start}
.lab{font-size:11.5px;font-weight:700;padding:1px 0;text-align:center;line-height:1.75;border-radius:3px}
.lab.syn{background:var(--green-soft);color:var(--green)}
.lab.ant{background:var(--red-soft);color:var(--red)}
.lab.der{background:var(--navy-soft);color:var(--navy)}
.lab.oth{background:var(--yellow-soft);color:var(--yellow-ink)}
.lab.col{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.rrow ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
.ent{font-family:var(--display);font-size:14.5px}
.ko{color:var(--muted)}
.exs{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:10px;counter-reset:ex}
.exi{display:grid;grid-template-columns:20px 1fr;gap:8px}
.exi::before{counter-increment:ex;content:counter(ex);font-size:12px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;padding-top:3px;text-align:right}
.exen{font-family:var(--display);font-size:15.5px;line-height:1.55}
.exen mark{background:none;color:var(--navy);font-weight:700}
.exen mark.r{color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:2px;text-underline-offset:3px}
.exko{font-size:13.5px;color:var(--muted)}
.src{display:inline-block;font-family:var(--body);font-style:normal;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:3px;margin-right:7px;vertical-align:2px;line-height:1.7;font-variant-numeric:tabular-nums}
.src.pass{background:var(--navy);color:var(--navy-ink)}
.src.gi{background:transparent;color:var(--yellow-ink);border:1px solid var(--yellow);line-height:1.55}
.hidden{display:none!important}
body.quiz .mean,body.quiz .def .k,body.quiz .exko,body.quiz .rrow .ko{filter:blur(5px);cursor:pointer;transition:filter .15s}
body.quiz .revealed{filter:none!important}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--rule);padding:16px 0 30px}
@media (max-width:760px){
  article.card{grid-template-columns:1fr;padding:14px 14px 12px}
  .plate img{height:44px}
  .mast h1{font-size:19px}
  .tools{margin-left:0;width:100%}
  #q{flex:1;width:auto}
  .qno{font-size:28px}
  .qhead{grid-template-columns:auto 1fr}
  .qcnt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:12mm}
  nav.bar,.key,footer{display:none}
  html{font-size:10px}
  body{font-size:10.5px;line-height:1.45}
  .wrap{max-width:none;padding:0}
  header.mast .wrap{padding:0 0 8px}
  .plate img{height:40px}
  .mast h1{font-size:16px}
  .tools{width:auto}
  section.qsec{margin-top:10px}
  section.qsec+section.qsec{break-before:page}
  .qhead{grid-template-columns:auto 1fr auto;margin-bottom:6px;padding-bottom:4px}
  .qno{font-size:22px}
  .qtitle{font-size:12.5px}
  .qcnt{display:inline}
  .list{gap:6px}
  article.card{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)!important;padding:8px 10px 7px!important;gap:4px 14px;break-inside:avoid;border-left-width:2px}
  .word{font-size:17px}
  .ipa{font-size:11px}
  .mean{font-size:11.5px}
  .def{font-size:10px;margin-top:2px}
  .def .en{font-size:10.5px}
  .ety{font-size:10px;margin-top:5px;padding:3px 7px}
  .rel{gap:3px;font-size:10px}
  .rrow{grid-template-columns:40px 1fr;gap:5px}
  .lab{font-size:9px}
  .ent{font-size:10.5px}
  .exs{gap:4px;padding-top:5px}
  .exi{grid-template-columns:14px 1fr;gap:5px}
  .exen{font-size:11px;line-height:1.4}
  .exko{font-size:10px}
  .src{font-size:8.5px}
  body{background:#fff;color:#000;font-size:11pt}
  article.card{page-break-inside:avoid}
  body.quiz .mean,body.quiz .def .k,body.quiz .exko,body.quiz .rrow .ko{filter:none}
}
</style>
</head>

turies has led people to add state citizenship to other identities, such as family, people group, or religion.", "지난 몇 세기에 걸친 민족 국가의 부상으로 사람들은 가족, 민족 집단, 종교 같은 다른 정체성에 국가 시민권을 더하게 되었다.", "본문", ""], ["This experience meant more than just winning; it confirmed her identity as an artist.", "이 경험은 단순한 승리 이상의 의미가 있었다. 그것은 예술가로서의 그녀의 정체성을 확인해 주었다.", "2024-고2-교육청-3월", ""], ["There is pressure to conform rather than to maintain their cultural identities, however, and these conflicts are greatly determined by the community to which one migrates.", "그러나 자신의 문화적 정체성을 유지하기보다 순응하라는 압력이 있으며, 이러한 갈등은 이주해 간 공동체에 의해 크게 좌우된다.", "2024-평가원-9월", ""]]}, {"w": "religion", "ipa": "rɪˈlɪdʒən", "m": "ⓝ 종교, 신앙", "d": [["ⓝ", "a belief in a god or gods and the activities connected with it", "신에 대한 믿음과 그와 관련된 활동"]], "et": "라틴어 religio (경외, 의무) ← re (다시) + ligare (묶다)라는 설이 있음", "ex": "신과 다시 묶어 주는 것 (어원에는 여러 설이 있음)", "g": [["유의어", "faith (신앙), belief (믿음)"], ["파생어", "religious ⓐ 종교의, 독실한"]], "c": ["family, people group, or religion (가족, 민족 집단, 또는 종교)", "religion and personal identity (종교와 개인적 정체성)", "religious beliefs (종교적 신념)"], "s": [["The rise of nation-states over the last few centuries has led people to add state citizenship to other identities, such as family, people group, or religion.", "지난 몇 세기에 걸친 민족 국가의 부상으로 사람들은 가족, 민족 집단, 종교 같은 다른 정체성에 국가 시민권을 더하게 되었다.", "본문", ""], ["Social mobility increased, and people began to exercise a higher degree of choice regarding, for instance, their profession, their marriage, or their religion.", "사회적 이동성이 증가했고, 사람들은 예를 들어 직업, 결혼, 종교에 관해 더 높은 수준의 선택권을 행사하기 시작했다.", "2021-고1-교육청-11월", ""], ["But I'm not just talking about race, skin color, or religion.", "하지만 저는 단지 인종, 피부색, 종교에 대해서만 말하고 있는 것이 아닙니다.", "2022-고1-교육청-3월", ""]]}, {"w": "given", "ipa": "ˈɡɪvn", "m": "prep. ~을 고려하면 ⓐ 주어진, 특정한 ⓝ 기정사실", "d": [["prep.", "considering a particular fact", "특정 사실을 고려하면"], ["ⓐ", "already arranged or fixed; specific", "이미 정해진; 특정한"]], "et": "give (주다)의 과거분사", "ex": "주어진 것을 고려하면", "g": [["유의어", "considering (~을 고려하면), in view of (~에 비추어), in light of (~에 비추어)"], ["관련어", "assumption (가정)"]], "c": ["given that (~을 고려하면)", "in a given situation (주어진 상황에서)", "take as a given (기정사실로 받아들이다)"], "s": [["Given the connections between people around the world and the common challenges we face, we need to layer global citizenship on to these other identities.", "전 세계 사람들 사이의 연결과 우리가 직면한 공통의 과제를 고려하면, 우리는 이러한 다른 정체성 위에 세계 시민 의식을 덧입힐 필요가 있다.", "본문", ""], ["Given your positive impact, we would like to offer an extension of your contract for the next academic year.", "선생님께서 끼치신 긍정적인 영향을 고려하여, 다음 학년도까지 계약을 연장해 드리고자 합니다.", "2025-고2-교육청-6월", ""], ["The inflow of data from our senses could create an overwhelming chaos, especially given the enormous amount of information available in culture and society.", "감각으로부터 유입되는 데이터는, 특히 문화와 사회에서 이용할 수 있는 엄청난 양의 정보를 고려하면, 압도적인 혼란을 일으킬 수 있다.", "2023-고2-교육청-9월", ""]]}, {"w": "connection", "ipa": "kəˈnekʃn", "m": "ⓝ 연결, 관련성; 관계, 인맥", "d": [["ⓝ", "a relationship between people, things, or ideas", "사람, 사물, 생각 사이의 관계"]], "et": "con (함께) + nectere (묶다) + -ion", "ex": "함께 묶어 놓음", "g": [["유의어", "link (연결), tie (유대), relationship (관계), bond (유대)"], ["반의어", "isolation (고립), separation (분리)"], ["파생어", "connect ⓥ 연결하다, connected ⓐ 연결된, connectedness ⓝ 유대감"]], "c": ["connection between (~ 사이의 연결)", "social connections (사회적 관계)", "maintain connections (관계를 유지하다)"], "s": [["Given the connections between people around the world and the common challenges we face, we need to layer global citizenship on to these other identities.", "전 세계 사람들 사이의 연결과 우리가 직면한 공통의 과제를 고려하면, 우리는 이러한 다른 정체성 위에 세계 시민 의식을 덧입힐 필요가 있다.", "본문", ""], ["Social connections are so essential for our survival and well-being that we not only cooperate with others to build relationships, we also compete with others for friends.", "사회적 관계는 우리의 생존과 행복에 매우 중요해서, 우리는 관계를 맺기 위해 다른 사람들과 협력할 뿐 아니라 친구를 얻기 위해 다른 사람들과 경쟁하기도 한다.", "2020-고1-교육청-9월", ""], ["However, after long absences, members of family and bond groups greet one another with incredibly theatrical displays.", "그러나 오랫동안 떨어져 있다가 다시 만나면, 가족과 유대 집단의 구성원들은 엄청나게 극적인 몸짓으로 서로 인사한다.", "2020-수능", ""]]}, {"w": "common", "ipa": "ˈkɑːmən", "m": "ⓐ 공통의, 공동의; 흔한", "d": [["ⓐ", "shared by two or more people or groups", "둘 이상의 사람이나 집단이 공유하는"], ["ⓐ", "happening often; ordinary", "자주 일어나는; 평범한"]], "et": "라틴어 communis (공동의, 함께 나누는)", "ex": "함께 나누는", "g": [["유의어", "shared (공유된), mutual (상호의), usual (흔한)"], ["반의어", "rare (드문), unusual (특이한), individual (개인의)"], ["파생어", "commonly ad. 흔히, community ⓝ 공동체"]], "c": ["common challenges (공통의 과제)", "have ~ in common (~을 공통으로 가지다)", "common sense (상식)"], "s": [["Given the connections between people around the world and the common challenges we face, we need to layer global citizenship on to these other identities.", "전 세계 사람들 사이의 연결과 우리가 직면한 공통의 과제를 고려하면, 우리는 이러한 다른 정체성 위에 세계 시민 의식을 덧입힐 필요가 있다.", "본문", ""], ["It is common sense that people's inner beliefs may drive their external behavior.", "사람들의 내적 신념이 그들의 외적 행동을 이끌 수 있다는 것은 상식이다.", "2025-고1-교육청-6월", ""], ["As a consequence, knowledge passed down through the oral traditions of stories and shared experiences.", "그 결과, 지식은 이야기와 공유된 경험이라는 구전 전통을 통해 전해졌다.", "2023-고2-교육청-9월", ""]]}, {"w": "challenge", "ipa": "ˈtʃælɪndʒ", "m": "ⓝ 도전, 과제, 난제 ⓥ 도전하다, 이의를 제기하다", "d": [["ⓝ", "something difficult that tests strength, skill, or ability", "힘, 기술, 능력을 시험하는 어려운 일"], ["ⓥ", "to question whether something is true or right", "어떤 것이 사실인지 옳은지 문제를 제기하다"]], "et": "라틴어 calumnia (거짓 고발) → 고대 프랑스어 chalenge (비난, 이의 제기)", "ex": "이의를 제기하다, 맞서다", "g": [["유의어", "difficulty (어려움), problem (문제), issue (문제, 쟁점), task (과제)"], ["파생어", "challenging ⓐ 도전적인, 힘든"]], "c": ["face challenges (도전에 직면하다)", "a major challenge (주요 과제)", "challenge the idea (그 생각에 이의를 제기하다)"], "s": [["Given the connections between people around the world and the common challenges we face, we need to layer global citizenship on to these other identities.", "전 세계 사람들 사이의 연결과 우리가 직면한 공통의 과제를 고려하면, 우리는 이러한 다른 정체성 위에 세계 시민 의식을 덧입힐 필요가 있다.", "본문", ""], ["None of this is easy, and challenges are never met once and for all time.", "이 중 어느 것도 쉽지 않으며, 도전 과제는 결코 한 번에 영원히 해결되지 않는다.", "2020-평가원-6월", ""], ["Parental practices at times when their children are faced with emotional challenges also impact emotion regulation development.", "자녀가 정서적 어려움에 직면했을 때 부모가 대하는 방식도 감정 조절 능력의 발달에 영향을 미친다.", "2024-고2-교육청-3월", ""]]}, {"w": "face", "ipa": "feɪs", "m": "ⓥ 직면하다, 마주하다 ⓝ 얼굴", "d": [["ⓥ", "to have to deal with a difficult situation", "어려운 상황을 다루어야 하다"]], "et": "라틴어 facies (모습, 얼굴)", "ex": "얼굴을 맞대다", "g": [["유의어", "confront (맞서다), encounter (마주치다), deal with (다루다)"], ["반의어", "avoid (피하다), escape (벗어나다)"]], "c": ["the challenges we face (우리가 직면한 과제)", "be faced with (~에 직면하다)", "face to face (얼굴을 맞대고)"], "s": [["Given the connections between people around the world and the common challenges we face, we need to layer global citizenship on to these other identities.", "전 세계 사람들 사이의 연결과 우리가 직면한 공통의 과제를 고려하면, 우리는 이러한 다른 정체성 위에 세계 시민 의식을 덧입힐 필요가 있다.", "본문", ""], ["Accordingly, many of the world's cities face an unprecedented accessibility crisis, and are characterized by unsustainable mobility systems.", "그에 따라 세계의 많은 도시는 전례 없는 접근성 위기에 직면해 있으며, 지속 불가능한 이동 체계를 특징으로 한다.", "2024-평가원-6월", ""], ["Farmers also often confront complex and difficult-to-observe phenomena that would be hard to manage even if they could run controlled experiments.", "농부들은 또한 통제된 실험을 할 수 있다 하더라도 다루기 어려울, 복잡하고 관찰하기 힘든 현상에 자주 직면한다.", "2023-평가원-9월", ""]]}, {"w": "layer", "ipa": "ˈleɪər", "m": "ⓥ 층층이 쌓다, 겹쳐 놓다 ⓝ 층, 겹", "d": [["ⓥ", "to put something on top of something else", "어떤 것 위에 다른 것을 올려놓다"], ["ⓝ", "a level or sheet of something that lies over or under something else", "다른 것의 위나 아래에 놓인 한 겹"]], "et": "lay (놓다) + -er", "ex": "놓아 올린 것, 한 겹", "g": [["유의어", "add (더하다), stack (쌓다)"]], "c": ["layer A on to B (A를 B 위에 덧입히다)", "add A to B (A를 B에 더하다)", "an additional layer (추가적인 층)", "layers o  정체성에 관한 이야기가 단 하나만 있는 것은 아니다.", "본문", ""], ["A reason for a conclusion is very unlikely to consist in a single claim.", "결론에 대한 이유가 단 하나의 주장으로 이루어질 가능성은 매우 낮다.", "2025-고2-교육청-6월", ""], ["They know that you study for multiple-choice tests differently than you study for essay tests.", "그들은 객관식 시험을 공부하는 방식이 논술 시험을 공부하는 방식과 다르다는 것을 안다.", "2023-고1-교육청-3월", ""]]}, {"w": "precisely", "ipa": "prɪˈsaɪsli", "m": "ad. 바로, 정확히", "d": [["ad.", "exactly; used to emphasize that something is completely correct", "정확히; 어떤 것이 완전히 옳음을 강조할 때 씀"]], "et": "라틴어 praecidere (잘라 내다) ← prae (앞) + caedere (자르다) + -ly", "ex": "앞을 딱 잘라 낸 듯 정확하게", "g": [["유의어", "exactly (정확히), accurately (정확하게), just (바로)"], ["반의어", "roughly (대략), approximately (대략)"], ["파생어", "precise ⓐ 정확한, precision ⓝ 정밀성"]], "c": ["precisely because (바로 ~ 때문에)", "precisely that (바로 그것)", "precisely controlled (정밀하게 통제된)"], "s": [["Instead, it's precisely because we have obligations to our families, those in our community, and those around the world.", "오히려 그것은 바로 우리가 가족, 지역 사회의 사람들, 그리고 전 세계 사람들에 대해 의무를 지니고 있기 때문이다.", "본문", ""], ["But precisely because of that, there will be much more money to pay human doctors and lab assistants to do groundbreaking research and develop new medicines or surgical procedures.", "그러나 바로 그 때문에, 인간 의사와 실험 보조원이 획기적인 연구를 하고 새로운 약이나 수술 절차를 개발하도록 지급할 돈이 훨씬 더 많아질 것이다.", "2020-고1-교육청-9월", ""], ["In short, we may never know precisely how high is the highest mountain, but we continue to be certain that we can get to the top nevertheless.", "요컨대, 우리는 가장 높은 산이 정확히 얼마나 높은지 결코 알 수 없을지도 모르지만, 그래도 그 정상에 오를 수 있다는 것은 계속 확신한다.", "2021-평가원-9월", ""]]}, {"w": "obligation", "ipa": "ˌɑːblɪˈɡeɪʃn", "m": "ⓝ 의무, 책임", "d": [["ⓝ", "something that you must do because of a law, promise, or duty", "법, 약속, 의무 때문에 반드시 해야 하는 것"]], "et": "ob (~에게) + ligare (묶다) + -tion", "ex": "누군가에게 묶여 있음", "g": [["유의어", "duty (의무), responsibility (책임), commitment (약속, 책무)"], ["반의어", "freedom (자유), choice (선택)"], ["관련어", "legal (법적인), moral (도덕 , {"w": "clue", "ipa": "kluː", "m": "ⓝ 단서, 실마리", "d": [["ⓝ", "a piece of information that helps you find the answer to a problem", "문제의 답을 찾는 데 도움이 되는 정보"]], "et": "clew (실타래) ← 고대 영어 cliewen (실 뭉치)", "ex": "미로에서 길을 찾게 해 주는 실타래", "g": [["유의어", "hint (힌트), cue (단서), sign (징후), evidence (증거)"]], "c": ["provide clues about (~에 대한 단서를 제공하다)", "visual clues (시각적 단서)", "solve clues (단서를 풀다)"], "s": [["Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "히드라와 불멸의 해파리 같은 종은 노화 과정을 물리치는 방법에 대한 단서를 줄 수도 있기 때문에 노인학자들을 흥분시킨다.", "본문", ""], ["He won't have a clue other than weight and maybe overall size.", "그에게는 무게와 아마도 전체적인 크기 외에는 아무런 단서가 없을 것이다.", "2021-수능", ""], ["Clues to past environmental change are well preserved in many different kinds of rocks.", "과거 환경 변화의 단서는 여러 종류의 암석에 잘 보존되어 있다.", "2018-평가원-6월", ""]]}, {"w": "defeat", "ipa": "dɪˈfiːt", "m": "ⓥ 물리치다, 이기다; 좌절시키다 ⓝ 패배", "d": [["ⓥ", "to win against someone or overcome something", "누군가를 이기거나 무언가를 극복하다"]], "et": "de (반대) + facere (하다) → 고대 프랑스어 desfait (망가뜨려진)", "ex": "해 놓은 것을 무너뜨리다", "g": [["유의어", "overcome (극복하다), beat (이기다), conquer (정복하다), stop (멈추게 하다), reverse (되돌리다)"], ["반의어", "lose to (~에게 지다), surrender (항복하다)"], ["파생어", "defeated ⓐ 패배한, 낙담한"]], "c": ["defeat the aging process (노화 과정을 물리치다)", "a defeated heart (낙담한 마음)", "in spite of this defeat (이 패배에도 불구하고)"], "s": [["Species such as hydra and the immortal jellyfish excite gerontologists because they may provide clues about how to defeat the aging process.", "히드라와 불멸의 해파리 같은 종은 노화 과정을 물리치는 방법에 대한 단서를 줄 수도 있기 때문에 노인학자들을 흥분시킨다.", "본문", ""], ["A god called Moinee was defeated by a rival god called Dromerdeener in a terrible battle up in the stars.", "Moinee라는 신이 별들 위에서 벌어진 끔찍한 전투에서 Dromerdeener라는 경쟁 신에게 패배했다.", "2020-고1-교육청-3월", ""], ["Therefore, overcoming your instinct to avoid uncomfortable things at first is essential.", "그러므로 처음에 불편한 것을 피하려는 본능을 극복하는 것이 필수적이다.", "2021-고1  may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.", "겉으로 드러나는 노화가 없다는 점에 관해 우리가 몇 가지 흥미로운 사실을 알게 될지도 모르지만, 그러한 발견이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다.", "본문", ""], ["In the mid-1950s, however, a number of faults in this view of history became apparent.", "그러나 1950년대 중반에 이러한 역사관의 여러 결함이 분명해졌다.", "2020-수능", ""], ["A classic example is the apparent association between children's shoe size and reading ability.", "전형적인 예는 아이들의 신발 크기와 읽기 능력 사이의 겉보기 연관성이다.", "2020-고1-교육청-11월", ""]]}, {"w": "relevant", "ipa": "ˈreləvənt", "m": "ⓐ 관련 있는, 적절한", "d": [["ⓐ", "closely connected to the subject or situation being discussed", "논의 중인 주제나 상황과 밀접하게 연결된"]], "et": "라틴어 relevare (다시 들어 올리다) ← re (다시) + levare (올리다)", "ex": "다시 들어 올려 쓸모가 있는", "g": [["유의어", "related (관련된), applicable (적용할 수 있는), pertinent (적절한)"], ["반의어", "irrelevant (무관한), unrelated (관련 없는)"], ["관련어", "apply to (~에 적용되다)"], ["파생어", "relevance ⓝ 관련성"]], "c": ["be relevant to (~와 관련이 있다)", "stay relevant (여전히 의미가 있다)", "equally as relevant as (~만큼이나 관련 있는)"], "s": [["Although we may learn some fascinating things about their lack of apparent aging, it is not at all clear how relevant those findings will be to human aging.", "겉으로 드러나는 노화가 없다는 점에 관해 우리가 몇 가지 흥미로운 사실을 알게 될지도 모르지만, 그러한 발견이 인간의 노화와 얼마나 관련이 있을지는 전혀 분명하지 않다.", "본문", ""], ["Only that which survived in some form in the present was considered relevant.", "어떤 형태로든 현재까지 남아 있는 것만이 관련 있는 것으로 여겨졌다.", "2020-수능", ""], ["Questions of morality are often pushed to the side in legislative debate, labeled too controversial, too difficult to answer, or, worst of all, irrelevant to the project.", "도덕의 문제는 입법 논쟁에서 너무 논란이 많다거나, 답하기 너무 어렵다거나, 최악의 경우 그 사업과 무관하다는 꼬리표가 붙은 채 흔히 뒷전으로 밀려난다.", "2023-평가원-9월", ""]]}, {"w": "universal", "ipa": "ˌjuːnɪˈvɜːrsl", "m": "ⓐ 보편적인, 전 세계적인", "d": [["ⓐ", "true or right in all situations; involving everyone", "모든 상황에서 참이거나 옳은; 모두를 포함하는"]], "et": "라틴어 universus (전체의) ← uni (하나) + versus (돌린)", "ex": "하나로 모두 돌려 묶은", "g": [["유의어", "general (일반적인), common (공통의), shared (공유된), global (세계적인)"], ["반의어", "particular (특정한), specific (구체적인), local (지역적인)"], ["파생어", "universe ⓝ 우주, universally ad. 보편적으로"]], "c": ["biology is universal (생물학은 보편적이다)", "apparent universality (겉보기의 보편성)", "universal or authoritative (보편적이거나 권위 있는)"], "s": [["Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "때때로 생물학은, 특히 근본적인 메커니즘과 관련될 때는, 보편적이다.", "본문", ""], ["Linking the disciplines comes naturally when the terms and tools are presented as part of a universal imagination.", "용어와 도구가 보편적 상상력의 일부로 제시될 때 학문 분야들을 연결하는 일은 자연스럽게 이루어진다.", "2023-고2-교육청-6월", ""], ["We almost universally accept that playing video games is at best a pleasant break from a student's learning and more often what prevents a student from accomplishing their goals.", "우리는 비디오 게임을 하는 것이 기껏해야 학습 중의 즐거운 휴식이고, 더 흔하게는 학생이 목표를 이루지 못하게 막는 것이라고 거의 보편적으로 받아들인다.", "2025-수능", ""]]}, {"w": "fundamental", "ipa": "ˌfʌndəˈmentl", "m": "ⓐ 근본적인, 기본적인", "d": [["ⓐ", "relating to the most basic and important parts of something", "어떤 것의 가장 기본적이고 중요한 부분과 관련된"]], "et": "라틴어 fundamentum (토대) ← fundus (바닥)", "ex": "바닥에 깔린 토대의", "g": [["유의어", "basic (기본적인), essential (필수적인), underlying (근본적인)"], ["반의어", "minor (사소한), superficial (피상적인)"], ["파생어", "fundamentally ad. 근본적으로"]], "c": ["fundamental mechanisms (근본적인 메커니즘)", "a fundamental shift (근본적인 변화)", "fundamental particles (기본 입자)"], "s": [["Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "때때로 생물학은, 특히 근본적인 메커니즘과 관련될 때는, 보편적이다.", "본문", ""], ["Paying with plastic fundamentally changes the way we spend money, altering the calculus of our financial decisions.", "카드로 지불하는 것은 우리가 돈을 쓰는 방식을 근본적으로 바꾸어 재정적 결정의 계산법을 변화시킨다.", "2025-고1-교육청-6월", ""], ["Increasing aid for the world's poorest peoples can be an essential part of effective mitigation.", "세계 최빈곤층에 대한 원조를 늘리는 것은 효과적인 (기후 변화) 완화의 필수적인 부분이 될 수 있다.", "2019-수능", ""]]}, {"w": "mechanism", "ipa": "ˈmekənɪzəm", "m": "ⓝ 메커니즘, 작동 원리; 기계 장치", "d": [["ⓝ", "a process or system that makes something happen", "어떤 일이 일어나게 하는 과정이나 체계"], ["ⓝ", "a set of moving parts in a machine", "기계 안의 움직이는 부품들"]], "et": "그리스어 mēkhanē (기계, 장치) + -ism", "ex": "장치처럼 작동하는 방식", "g": [["유의어", "process (과정), system (체계), means (수단)"], ["파생어", "mechanical ⓐ 기계적인, mechanic ⓝ 정비공"]], "c": ["fundamental mechanisms (근본적인 메커니즘)", "causal mechanisms (인과적 메커니즘)", "price-setting mechanism (가격 결정 방식)"], "s": [["Sometimes biology is universal, especially if it relates to fundamental mechanisms.", "때때로 생물학은, 특히 근본적인 메커니즘과 관련될 때는, 보편적이다.", "본문", ""], ["That is, the explanation of scientific generalizations comes from the causal mechanisms that produce the regularities.", "즉, 과학적 일반화에 대한 설명은 규칙성을 만들어 내는 인과적 메커니즘에서 나온다.", "2022-수능", ""], ["All this happens in a matter of minutes but is a natural defense mechanism that we perform in the real world.", "이 모든 일은 몇 분 만에 일어나지만, 그것은 우리가 현실 세계에서도 하는 자연스러운 방어 기제이다.", "2024-평가원-6월", ""]]}, {"w": "translate", "ipa": "trænsˈleɪt", "m": "ⓥ (~로) 적용하다, 바뀌다; 번역하다", "d": [["ⓥ", "to change something into a different form; to apply something to a different situation", "무언가를 다른 형태로 바꾸다; 다른 상황에 적용하다"], ["ⓥ", "to change words into another language", "말을 다른 언어로 옮기다"]], "et": "trans (건너) + latus (옮겨진) ← ferre (나르다)", "ex": "건너편으로 옮기다", "g": [["유의어", "apply (적용하다), transfer (옮기다), carry over (이어지다), convert (바꾸다), transform (변형하다)"], ["파생어", "translation ⓝ 번역, translator ⓝ 번역가"]], "c": ["translate into (~으로 옮겨지다, 이어지다)", "be translated to the public (대중에게 전달되다)", "what that translates to is (그것이 의미하는 바는)"], "s": [["But in other cases, even discoveries in rats or mice, which are mammals and biologically much closer to us, are difficult to translate into humans.", "그러나 다른 경우에는 포유류이고 생물학적으로 우리와 훨씬 더 가까운 쥐에게서 얻은 발견조차 인간에게 적용하기 어렵다.", "본문", ""], ["One of her novels has been translated into more than eighty languages.", "그녀의 소설 중 한 편은 egulations can all lead to power plants that pollute less by switching away from coal.", "보조금, 세금, 규제는 모두 발전소가 석탄에서 벗어나 오염을 덜 일으키도록 이끌 수 있다.", "본문", ""], ["Often, however, these regulations do not work adequately, as the Enron scandal in 2001 clearly illustrates.", "그러나 2001년 Enron 스캔들이 분명히 보여 주듯이, 이러한 규제는 흔히 제대로 작동하지 않는다.", "2018-평가원-9월", ""], ["Regulatory mandates are blunt swords; they tend to neglect diversity and may have serious unintended adverse effects.", "규제 명령은 무딘 칼이다. 그것은 다양성을 무시하는 경향이 있고 의도치 않은 심각한 부작용을 낳을 수 있다.", "2023-수능", ""]]}, {"w": "pollute", "ipa": "pəˈluːt", "m": "ⓥ 오염시키다", "d": [["ⓥ", "to make air, water, or land dirty and harmful", "공기, 물, 땅을 더럽고 해롭게 만들다"]], "et": "라틴어 polluere (더럽히다)", "ex": "더럽히다", "g": [["유의어", "contaminate (오염시키다), poison (오염시키다)"], ["반의어", "clean (깨끗이 하다)"], ["관련어", "emit (배출하다)"], ["파생어", "pollution ⓝ 오염"]], "c": ["pollute less (오염을 덜 일으키다)", "air pollution (대기 오염)", "polluted air (오염된 공기)"], "s": [["Subsidies, taxes, and regulations can all lead to power plants that pollute less by switching away from coal.", "보조금, 세금, 규제는 모두 발전소가 석탄에서 벗어나 오염을 덜 일으키도록 이끌 수 있다.", "본문", ""], ["Do they have a record of polluting the environment, or do they have fair-trade practices and an end-of-life plan for the products they make?", "그 기업들에게 환경을 오염시킨 기록이 있는가, 아니면 공정 거래 관행과 자신들이 만드는 제품의 폐기 계획을 갖추고 있는가?", "2023-고2-교육청-9월", ""], ["Worse, some are contaminated with other substances and contain ingredients not listed on the label.", "더 나쁜 것은, 일부 제품은 다른 물질에 오염되어 있고 라벨에 적혀 있지 않은 성분을 포함하고 있다는 것이다.", "2021-고1-교육청-11월", ""]]}, {"w": "switch", "ipa": "swɪtʃ", "m": "ⓥ 바꾸다, 전환하다 ⓝ 전환; 스위치", "d": [["ⓥ", "to change from one thing to another", "한 가지에서 다른 것으로 바꾸다"]], "et": "중세 네덜란드어 swijch (가는 가지, 회초리)", "ex": "휙 바꾸다", "g": [["유의어", "change (바꾸다), shift (전환하다), convert (전환하다), move away from (~에서 벗어나다)"], ["반의어", "maintain (유지하다), keep (유지하다)"]], "c": ["switch away from (~에서 벗어나 전환하다)", "switch from A to B (A에서 B로 바꾸다)", "switch over topics (화제를 바꾸다)"], "s": [["Subsidies, taxes, and regulations can all lead to power plants that pollute less by switching away from coal.", "보조금, 세금, 규제는 모두 발전소가 석탄에서 벗어나 오염을 덜 일으키도록 이끌 수 있다.", "본문", ""], ["It takes willpower to switch off the world, even for an hour.", "단 한 시간이라도 세상을 꺼 두려면 의지력이 필요하다.", "2022-평가원-6월", ""], ["This simple switch challenges your brain, activating pathways that aren't typically engaged and promoting greater flexibility in thinking.", "이 간단한 전환은 뇌에 자극을 주어, 평소 잘 쓰이지 않는 경로를 활성화하고 사고의 유연성을 높여 준다.", "2025-고2-교육청-10월", ""]]}, {"w": "profit", "ipa": "ˈprɑːfɪt", "m": "ⓝ 이익, 수익 ⓥ 이익을 얻다", "d": [["ⓝ", "money that you gain from business after paying costs", "비용을 지불하고 남은 사업상의 돈"]], "et": "라틴어 proficere (나아가다, 이롭다) ← pro (앞으로) + facere (하다)", "ex": "앞으로 나아가게 하는 것", "g": [["유의어", "gain (이득), income (소득), earnings (수입), benefit (이익)"], ["반의어", "loss (손실)"], ["파생어", "profitable ⓐ 수익성 있는, profitability ⓝ 수익성"]], "c": ["profits can be higher (이윤이 더 높아질 수 있다)", "all profits (모든 수익금)", "profit from (~에서 이익을 얻다)"], "s": [["In all cases, profits can be higher from making the transition, even taking the related costs into account.", "모든 경우에, 관련 비용을 고려하더라도 전환을 하면 이윤이 더 높아질 수 있다.", "본문", ""], ["Consistency and repeatability are more likely to suppress fresh thinking than to bring your company profit.", "일관성과 반복성은 회사에 이익을 가져다주기보다 참신한 사고를 억누를 가능성이 더 크다.", "2024-고2-교육청-9월", ""], ["The oil trading company Enron had cooked its books to overstate its profitability in its mandated reports.", "석유 거래 회사인 Enron은 의무 보고서에서 수익성을 부풀리기 위해 장부를 조작했다.", "2018-평가원-9월", ""]]}, {"w": "take ~ into account", "ipa": "teɪk ɪntuː əˈkaʊnt", "m": "~을 고려하다, 참작하다", "d": [["phr.", "to consider something when making a judgment or decision", "판단하거나 결정할 때 어떤 것을 고려하다"]], "et": "account (계산, 설명) ← 고대 프랑스어 aconter (세다)", "ex": "계산에 넣다", "g": [["유의어", "consider (고려하다), take into consideration (고려하다), allow for (참작하다)"], ["반의어", "ignore (무시하다), overlook (간과하다)"]], "c": ["take the related costs into account (관련 비용을 고려하다)", "take ~ fully into account (~을 충분히 고려하다)", "take into account the context (맥락을 고려하다)"], "s": [["In all cases, profits can be higher from making the transition, even taking the related costs into account.", "모든 경우에, 관련 비용을 고려하더라도 전환을 하면 이윤이 더 높아질 수 있다.", "본문", ""], ["Situational ethics is an ethical theory that takes into account the context of a situation or an act when judging whether it is ethical.", "상황 윤리는 어떤 상황이나 행위가 윤리적인지 판단할 때 그 맥락을 고려하는 윤리 이론이다.", "2026-수능", ""], ["Good management of technological resources needs to take them fully into account.", "기술 자원을 잘 관리하려면 그것들을 충분히 고려해야 한다.", "2023-고2-교육청-6월", ""]]}, {"w": "prefer", "ipa": "prɪˈfɜːr", "m": "ⓥ 선호하다, ~을 더 좋아하다", "d": [["ⓥ", "to like one thing or person better than another", "어떤 것이나 사람을 다른 것보다 더 좋아하다"]], "et": "pre (앞에) + ferre (나르다, 두다)", "ex": "앞에 놓다, 더 중히 여기다", "g": [["유의어", "favor (선호하다), choose (선택하다), would rather (차라리 ~하겠다), like better (더 좋아하다)"], ["파생어", "preference ⓝ 선호, preferable ⓐ 더 나은, preferred ⓐ 선호되는"]], "c": ["prefer A over/to B (B보다 A를 선호하다)", "prefer to do (~하는 것을 선호하다)", "taste preferences (맛 선호)"], "s": [["The power plants prefer subsidies over regulations or taxes.", "발전소들은 규제나 세금보다 보조금을 선호한다.", "본문", ""], ["They found that when they can't see the price tag, people prefer cheaper wine to pricier bottles.", "그들은 가격표를 볼 수 없을 때 사람들이 더 비싼 와인보다 더 싼 와인을 선호한다는 것을 발견했다.", "2019-평가원-9월", ""], ["Both humans and rats have evolved taste preferences for sweet foods, which provide rich sources of calories.", "인간과 쥐는 모두 단 음식에 대한 맛 선호를 진화시켜 왔는데, 단 음식은 풍부한 열량원을 제공한다.", "2018-수능", ""]]}, {"w": "expansion", "ipa": "ɪkˈspænʃn", "m": "ⓝ 확장, 팽창, 확대", "d": [["ⓝ", "an increase in size, number, or importance", "크기, 수, 중요성의 증가"]], "et": "ex (밖으로) + pandere (펼치다) + -sion", "ex": "밖으로 펼쳐 넓힘", "g": [["유의어", "growth (성장), increase (증가), extension (확장)"], ["반의어", "contraction (축소), reduction (감소)"], ["파생어", "expand ⓥ 확장하다"]], "c": ["the expansion of (~의 확장)", "rapid expansion (급속한 확장)", "expand beyond (~을 넘어 확장되다)"], "s": [["But the \"expansion\" of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.", "그러나 보조금을 통한 그들의 기회 집합의 '확장'은 다른 이들의 기회 집합의 축소와 짝을 이룰 수밖에 없다.", "본문", ""], ["The expansion of sports tourism in the twentieth century has been influenced by further developments in transportation.", "20세기 스포츠 관광의 확장은 교통수단이 더욱 발전한 데 영향을 받았다.", "2025-수능", ""], ["But if we only go where we feel confident, then confidence never expands beyond that.", "하지만 우리가 자신 있다고 느끼는 곳에만 간다면, 자신감은 결코 그 이상으로 커지지 않는다.", "2024-평가원-9월", ""]]}, {"w": "contraction", "ipa": "kənˈtrækʃn", "m": "ⓝ 축소, 수축", "d": [["ⓝ", "the process of becoming smaller", "더 작아지는 과정"]], "et": "con (함께) + trahere (끌다) + -tion", "ex": "함께 끌어당겨 오그라듦", "g": [["유의어", "reduction (감소), decrease (감소), decline (감소)"], ["반의어", "expansion (확장), growth (성장)"], ["파생어", "contract ⓥ 수축하다 ⓝ 계약"]], "c": ["the contraction of (~의 축소)", "a contraction in supply (공급의 감소)", "the expansion of (~의 확장)"], "s": [["But the \"expansion\" of their opportunity set through subsidies has to be matched by the contraction of the opportunity set of others.", "그러나 보조금을 통한 그들의 기회 집합의 '확장'은 다른 이들의 기회 집합의 축소와 짝을 이룰 수밖에 없다.", "본문", ""], ["Following an oil price jump of 10 per cent due to a contraction in supply, an economy (as typified by the US economy) typically sees its output (GDP) slowed by close to 1 percentage point.", "공급 감소로 유가가 10퍼센트 급등하면, (미국 경제로 대표되는) 경제는 일반적으로 산출량(GDP)이 1퍼센트포인트 가까이 둔화된다.", "2025-고2-교육청-6월", ""], ["As arms and legs rotate around joints, muscles activate and deactivate, contract and relax.", "팔과 다리가 관절을 중심으로 회전할 때, 근육은 활성화되었다가 비활성화되고, 수축했다가 이완한다.", "2025-고2-교육청-10월", ""]]}, {"w": "at the expense of", "ipa": "æt ðə ɪkˈspens əv", "m": "~을 희생하여, ~의 비용으로", "d": [["phr.", "causing harm or loss to someone or something else in order to gain something", "무언가를 얻기 위해 다른 사람이나 것에 해나 손실을 끼쳐"]], "et": "expense (비용) ← 라틴어 expendere (지불하다)", "ex": "다른 사람의 비용으로", "g": [["유의어", "sacrifice (희생하다), harm (해를 끼치다)"], ["관련어", "expense (비용), cost (대가)"]], "c": ["at the expense of the ordinary individual (보통 사람을 희생하여)", "at one's own expense (자비로)", "at the expense of those they serve (그들이 봉사하는 사람들을 희생하여)"], "s": [["The electricity companies' \"freedom\" is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.", "전력 회사들의 '자유'는 보통 사람을 희생시켜 커지는데, 그 사람은 보조금을 대기 위해 늘어난 세금에 시달려야 한다.", "본문", ""], ["As an example, in Kenya, farmers are actively encouraged to grow export crops such as tea and coffee at the expense of basic food production.", "예를 들어 케냐에서는 농부들이 기본 식량 생산을 희생하면서 차와 커피 같은 수출용 작물을 재배하도록 적극적으로 장려된다.", "2018-수능", ""], ["In 1893, Dunbar published his first book, Oak and Ivy, at his own expense.", "1893년에 Dunbar는 자비로 첫 번째 책인 『Oak and Ivy』를 출판했다.", "2021-고1-교육청-9월", ""]]}, {"w": "suffer from", "ipa": "ˈsʌfər frəm", "m": "ⓥ ~으로 고통받다, ~에 시달리다", "d": [["ⓥ", "to experience something bad, such as pain, illness, or difficulty", "고통, 질병, 어려움 같은 나쁜 일을 겪다"]], "et": "sub (아래에서) + ferre (견디다)", "ex": "아래에서 견뎌 내다", "g": [["유의어", "undergo (겪다), endure (견디다), experience (경험하다), bear (떠안다)"], ["반의어", "benefit from (~으로 이익을 얻다)"], ["파생어", "suffering ⓝ 고통"]], "c": ["suffer from increased taxation (늘어난 세금에 시달리다)", "suffer from color blindness (색맹을 앓다)", "people suffering from (~으로 고통받는 사람들)"], "s": [["The electricity companies' \"freedom\" is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.", "전력 회사들의 '자유'는 보통 사람을 희생시켜 커지는데, 그 사람은 보조금을 대기 위해 늘어난 세금에 시달려야 한다.", "본문", ""], ["Hence, places can be full of tourists and thus suffer from overtourism.", "그래서 어떤 장소는 관광객으로 가득 차 과잉 관광에 시달릴 수 있다.", "2024-수능", ""], ["Throughout her life, she created art representing the voices of people suffering from social injustice.", "평생 동안 그녀는 사회적 불의로 고통받는 사람들의 목소리를 대변하는 예술 작품을 만들었다.", "2021-고1-교육청-3월", ""]]}, {"w": "taxation", "ipa": "tækˈseɪʃn", "m": "ⓝ 과세, 조세, 세금", "d": [["ⓝ", "the system of collecting taxes; money collected as taxes", "세금을 걷는 제도; 세금으로 걷은 돈"]], "et": "tax ← 라틴어 taxare (평가하다) + -ation", "ex": "값을 매겨 걷는 것", "g": [["유의어", "tax (세금), duty (관세)"], ["관련어", "subsidy (보조금), revenue (세입)"]], "c": ["increased taxation (늘어난 세금)", "the imposition of tax (세금 부과)", "pay taxes (세금을 내다)"], "s": [["The electricity companies' \"freedom\" is increased at the expense of the ordinary individual, who must suffer from increased taxation to pay for the subsidy.", "전력 회사들의 '자유'는 보통 사람을 희생시켜 커지는데, 그 사람은 보조금을 대기 위해 늘어난 세금에 시달려야 한다.", "본문", ""], ["But, in fact, the moral questions of taxation are at the very heart of the creation of tax laws.", "그러나 사실 과세의 도덕적 문제는 세법 제정의 핵심에 있다.", "2023-평가원-9월", ""], ["Historically, drafters of tax legislation are attentive to questions of economics and history, and less attentive to moral questions.", "역사적으로 세법 입안자들은 경제와 역사의 문제에는 주의를 기울이지만, 도덕적 문제에는 덜 주의를 기울인다.", "2023-평가원-9월", ""]]}, {"w": "perspective", "ipa": "pərˈspektɪv", "m": "ⓝ 관점, 시각; 원근법", "d": [["ⓝ", "a particular way of thinking about something", "어떤 것에 대한 특정한 사고방식"]], "et": "per (통하여) + specere (보다)", "ex": "꿰뚫어 보는 시각", "g": [["유의어", "viewpoint (관점), point of view (관점), standpoint (입장), outlook (견해)"], ["관련어", "in terms of (~의 관점에서)"]], "c": ["from the perspective of (~의 관점에서)", "a global perspective (세계적인 관점)", "put ~ in perspective (~을 균형 있게 보다)"], "s": [["Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.", "게다가 순수한 효율성의 관점에서 보면, 보조금은 경제를 왜곡하는데, 전력 회사가 배출량을 제한하는 데 성공하더라도 자신이 하는 일의 비용 전체를 감당하지 않기 때문이다.", "본문", ""], ["Each event allows the student to examine the concept from a different perspective.", "각각의 활동은 학생이 그 개념을 다른 관점에서 살펴볼 수 있게 해 준다.", "2020-평가원-6월", ""], ["When you are right about something, you close off the possibility of another viewpoint or opportunity.", "어떤 일에 대해 자신이 옳다고 할 ed something they care deeply about, it's theirs, and this powerful sense of ownership distorts their perception of value which causes them to overprice their products.", "그들은 자신이 깊이 아끼는 것을 만들었고 그것은 그들의 것이므로, 이 강한 소유 의식이 가치에 대한 인식을 왜곡하여 제품 가격을 지나치게 높게 매기게 만든다.", "2025-고1-교육청-6월", ""], ["However, self-reports can be plagued by several kinds of distortion.", "그러나 자기 보고는 여러 종류의 왜곡에 시달릴 수 있다.", "2023-고2-교육청-6월", ""]]}, {"w": "emission", "ipa": "iˈmɪʃn", "m": "ⓝ 배출(물), 배기가스", "d": [["ⓝ", "a gas or other substance sent into the air", "공기 중으로 내보내지는 가스나 다른 물질"]], "et": "e (밖으로) + mittere (보내다) + -sion", "ex": "밖으로 내보냄", "g": [["유의어", "discharge (배출), release (방출), output (배출량)"], ["파생어", "emit ⓥ 내뿜다, 배출하다"]], "c": ["limit emissions (배출량을 제한하다)", "carbon emissions (탄소 배출)", "greenhouse gas emissions (온실가스 배출)"], "s": [["Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.", "게다가 순수한 효율성의 관점에서 보면, 보조금은 경제를 왜곡하는데, 전력 회사가 배출량을 제한하는 데 성공하더라도 자신이 하는 일의 비용 전체를 감당하지 않기 때문이다.", "본문", ""], ["Claims that local food production cut greenhouse gas emissions by reducing the burning of transportation fuel are usually not well founded.", "지역 식품 생산이 운송 연료의 연소를 줄여 온실가스 배출을 감소시킨다는 주장은 대개 근거가 충분하지 않다.", "2023-고1-교육청-9월", ""], ["Factories were discharging mercury into the waters of Minamata Bay, which also harbored a commercial fishing industry.", "공장들은 미나마타만의 바다에 수은을 배출하고 있었는데, 그곳에는 상업적 어업도 자리 잡고 있었다.", "2018-수능", ""]]}, {"w": "limit", "ipa": "ˈlɪmɪt", "m": "ⓥ 제한하다 ⓝ 한계, 제한", "d": [["ⓥ", "to stop something from becoming larger or greater than a particular amount", "어떤 것이 특정한 양보다 커지지 않게 막다"]], "et": "라틴어 limes (경계, 국경)", "ex": "경계를 정하다", "g": [["유의어", "restrict (제한하다), control (통제하다), reduce (줄이다)"], ["반의어", "expand (확대하다), extend (넓히다)"], ["파생어", "limitation ⓝ 한계, limited ⓐ 제한된"]], "c": ["limit emissions (배출량을 제한하다)", "be limited to (~으로 제한되다)", "within limits (한계 내에서)"], "s": [["Moreover, from the perspective of pure efficiency, the subsidy distorts the economy because the electricity company is not facing the full costs of what it does, even if it is successful in limiting emissions.", "게다가 순수한 효율성의 관점에서 보면, 보조금은 경제를 왜곡하는데, 전력 회사가 배출량을 제한하는 데 성공하더라도 자신이 하는 일의 비용 전체를 감당하지 않기 때문이다.", "본문", ""], ["Over the past few decades, architecture as an idea and practice has increasingly limited its definition of itself.", "지난 수십 년 동안, 하나의 개념이자 실천으로서의 건축은 스스로에 대한 정의를 점점 더 제한해 왔다.", "2020-평가원-9월", ""], ["What if you were limited to, say, fifty spoken words tomorrow?", "만약 내일 당신이 말할 수 있는 단어가 이를테면 50개로 제한된다면 어떨까?", "2025-고1-교육청-6월", ""]]}, {"w": "consumption", "ipa": "kənˈsʌmpʃn", "m": "ⓝ 소비(량), 섭취", "d": [["ⓝ", "the amount of energy, food, or goods that is used", "사용되는 에너지, 음식, 물건의 양"]], "et": "con (완전히) + sumere (취하다) + -tion", "ex": "완전히 취해서 다 써 버림", "g": [["유의어", "use (사용), intake (섭취)"], ["반의어", "production (생산), saving (절약)"], ["관련어", "demand (수요)"], ["파생어", "consume ⓥ 소비하다, consumer ⓝ 소비자"]], "c": ["electricity consumption (전기 소비)", "final energy consumption (최종 에너지 소비)", "the present rate of human consumption (현재의 인간 소비 속도)"], "s": [["Indeed, electricity prices may end up lower than they should be and electricity consumption higher, which will worsen global warming, even though the emissions per unit of electricity have been reduced.", "실제로 전기 가격은 마땅한 수준보다 결국 더 낮아지고 전기 소비량은 더 많아질 수 있는데, 이는 전기 단위당 배출량이 줄었더라도 지구 온난화를 악화시킬 것이다.", "본문", ""], ["In a society that rejects the consumption of insects there are some individuals who overcome this rejection, but most will continue with this attitude.", "곤충 섭취를 거부하는 사회에서도 이러한 거부감을 극복하는 사람들이 일부 있지만, 대부분은 이런 태도를 유지할 것이다.", "2022-고1-교육청-9월", ""], ["Some consumers buy skin creams and baby products for their soothing effect on the skin.", "일부 소비자들은 피부를 진정시키는 효과 때문에 스킨크림과 유아용품을 구매한다.", "2020-고1-교육청-3월", ""]]}, {"w": "worsen", "ipa": "ˈwɜːrsn", "m": "ⓥ 악화시키다, 악화되다", "d": [["ⓥ",  일자리를 잃는다.", "2023-고2-교육청-6월", ""], ["Reduction or elimination of these factors may require societal action, such as public awareness and public health measures.", "이러한 요인을 줄이거나 없애려면 대중의 인식 제고나 공중 보건 조치 같은 사회적 행동이 필요할 수 있다.", "2022-수능", ""]]}]}, {"q": "31", "t": "빈칸", "items": [{"w": "view", "ipa": "vjuː", "m": "ⓥ 보다, 여기다 ⓝ 견해, 관점; 경치", "d": [["ⓥ", "to think about someone or something in a particular way", "누군가나 무언가를 특정한 방식으로 생각하다"], ["ⓝ", "a personal opinion or way of thinking", "개인적인 의견이나 사고방식"]], "et": "라틴어 videre (보다) → 고대 프랑스어 veue (봄)", "ex": "보는 방식", "g": [["유의어", "regard (여기다), consider (간주하다), see (보다), look at (~을 보다), examine (살펴보다)"], ["파생어", "viewer ⓝ 시청자, viewpoint ⓝ 관점"]], "c": ["view A as B (A를 B로 여기다)", "view ~ through a lens (~을 렌즈를 통해 보다)", "point of view (관점)"], "s": [["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "스타트렉 세계를 경제적 렌즈로 보는 사람은 거의 없겠지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 세상을 들여다보는 창을 얻게 된다.", "본문", ""], ["If you can't understand their view, you're probably just blind to their way of thinking.", "그들의 견해를 이해할 수 없다면, 당신은 아마 그들의 사고방식을 보지 못하고 있는 것이다.", "2021-고1-교육청-9월", ""], ["For example, the cultivators of the Himalayas and Karakoram view forests as essentially a convertible resource.", "예를 들어 히말라야와 카라코람의 경작자들은 숲을 본질적으로 다른 용도로 바꿀 수 있는 자원으로 여긴다.", "2019-평가원-9월", ""]]}, {"w": "lens", "ipa": "lenz", "m": "ⓝ 렌즈; (사고의) 관점, 시각", "d": [["ⓝ", "a curved piece of glass that makes things look larger or clearer; a particular way of looking at something", "물체를 더 크거나 선명하게 보이게 하는 곡면 유리; 어떤 것을 바라보는 특정한 방식"]], "et": "라틴어 lens (렌즈콩) ← 볼록한 모양이 렌즈콩을 닮은 데서", "ex": "렌즈콩 모양의 유리", "g": [["유의어", "perspective (관점), viewpoint (관점), point of view (관점), standpoint (입장), angle (시각)"]], "c": ["through an economic lens (경제적 렌즈를 통해)", "through a lens that is similar to the eye (눈과 비슷한 렌즈를 통해)", "lenses for his eyeglasses (그의 안경 렌즈)"], "s": [["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "스타트렉 세계를 경제적 렌즈로 보는 사람은 거의 없겠지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 세상을 들여다보는 창을 얻게 된다.", "본문", ""], ["We can experience the world only through the human lenses that make it intelligible to us.", "우리는 세상을 우리가 이해할 수 있게 해 주는 인간의 렌즈를 통해서만 경험할 수 있다.", "2023-평가원-6월", ""], ["This skill came in handy when he made lenses for his simple microscope.", "이 기술은 그가 자신의 간단한 현미경에 쓸 렌즈를 만들 때 유용했다.", "2022-고1-교육청-3월", ""]]}, {"w": "economic", "ipa": "ˌekəˈnɑːmɪk", "m": "ⓐ 경제의, 경제적인", "d": [["ⓐ", "relating to trade, industry, and money", "무역, 산업, 돈과 관련된"]], "et": "그리스어 oikonomia (가정 관리) ← oikos (집) + nomos (관리)", "ex": "살림을 꾸리는 일의", "g": [["유의어", "financial (재정의), commercial (상업의), monetary (화폐의)"], ["관련어", "economical (절약하는)"], ["파생어", "economy ⓝ 경제, economics ⓝ 경제학, economist ⓝ 경제학자"]], "c": ["economic benefits (경제적 이익)", "economic growth (경제 성장)", "economic prosperity (경제적 번영)"], "s": [["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "스타트렉 세계를 경제적 렌즈로 보는 사람은 거의 없겠지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 세상을 들여다보는 창을 얻게 된다.", "본문", ""], ["As the social and economic situation of countries got better, wage levels and working conditions improved.", "나라들의 사회적·경제적 상황이 나아지면서 임금 수준과 근로 조건이 개선되었다.", "2023-고1-교육청-3월", ""], ["But the economic benefits provided by these services, based on their non-market values, may exceed the economic value of the timber.", "그러나 비시장적 가치에 기반한 이러한 서비스가 제공하는 경제적 이익은 목재의 경제적 가치를 넘어설 수도 있다.", "2024-수능", ""]]}, {"w": "classical", "ipa": "ˈklæsɪkl", "m": "ⓐ 고전의, 고전적인; 전통적인", "d": [["ⓐ", "traditional and long-established in form or style; relating to ancient Greece and Rome", "형식이나 양식이 전통적이고 오래 확립된; 고대 그리스·로마와 관련된"]], "et": "라틴어 classicus (최상급 시민 계층의) ← classis (계급) + -al", "ex": "최고 수준으로 인정받은", "g": [["유의어", "traditional (전통적인), conventional (관습적인)"], ["반의어", "modern (현대의), contemporary (현대의)"], ["파생어", "classic ⓐ 전형적인, 고전의 ⓝ 고전"]], "c": ["classical economics (고전 경제학)", "classical music (클래식 음악)", "a classic example (전형적인 예)"], "s": [["All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need.", "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 줄 만큼 무엇이든 충분한 경우는 대개 없다는 개념에 기초한다.", "본문", ""], ["Partly because of notation, modern classical performance lacks the depth of nuance that is part of aural tradition.", "부분적으로는 기보법 때문에, 현대의 클래식 연주에는 청각적 전통의 일부인 깊은 뉘앙스가 부족하다.", "2020-평가원-6월", ""], ["This new classification system of his led to conflicts with many mineralogists who followed the conventional methods.", "그의 이 새로운 분류 체계는 관습적인 방식을 따르던 많은 광물학자들과의 갈등으로 이어졌다.", "2025-고2-교육청-3월", ""]]}, {"w": "notion", "ipa": "ˈnoʊʃn", "m": "ⓝ 개념, 생각, 관념", "d": [["ⓝ", "an idea or belief about something", "어떤 것에 대한 생각이나 믿음"]], "et": "라틴어 notio (개념, 앎) ← noscere (알다)", "ex": "알게 된 생각", "g": [["유의어", "idea (생각), concept (개념), belief (믿음), assumption (가정), premise (전제)"]], "c": ["the notion that (~라는 개념)", "a notion of quantity (양의 개념)", "the notion of the self (자아의 개념)"], "s": [["All of classical economics is based on the notion that there isn't usually enough of anything to give everyone everything they want or need.", "고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 줄 만큼 무엇이든 충분한 경우는 대개 없다는 개념에 기초한다.", "본문", ""], ["So it is with the notion that the world revolves around the human economy.", "세상이 인간의 경제를 중심으로 돌아간다는 생각도 마찬가지이다.", "2024-고2-교육청-9월", ""], ["But does that mean the entire concept of the self-driving car is not worth pursuing?", "하지만 그것이 자율 주행 자동차라는 개념 전체가 추구할 가치가 없다는 뜻일까?", "2024-고2-교육청-3월", ""]]}, {"w": "allocate", "ipa": "ˈæləkeɪt", "m": "ⓥ 배분하다, 할당하다", "d": [["ⓥ", "to give something officially to someone or something for a particular purpose", "특정 목적을 위해 무언가를 공식적으로 나누어 주다"]], "et": "ad (~에) + locare (놓다) ← locus (장소)", "ex": "자리를 정해 놓다", "g": [["유의어", "distribute (분배하다), assign (할당하다), divide (나누다)"], ["파생어", "allocation ⓝ 배분, 할당"]], "c": ["allocate goods and resources (재화와 자원을 배분하다)", "allocate it likewise (그것을 마찬가지로 배분하다)", "allocating tasks (과업 할당)"], "s": [["Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "그 때문에 우리는 시장과 가격 책정을 이용하여 그러한 재화, 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분한다.", "본문", ""], ["I kindly request an additional budget allocation for these expenses.", "이 비용들을 위한 추가 예산 배정을 정중히 요청드립니다.", "2024-고2-교육청-10월", ""], ["We will distribute the food to our neighbors on Christmas Eve.", "우리는 크리스마스이브에 이웃들에게 음식을 나누어 줄 것입니다.", "2021-수능", ""]]}, {"w": "result in", "ipa": "rɪˈzʌlt ɪn", "m": "ⓥ (결과적으로) ~을 낳다, 초래하다", "d": [["ⓥ", "to cause a particular situation to happen", "특정 상황이 일어나게 하다"]], "et": "result ← 라틴어 resultare (되튀다) ← re (뒤로) + salire (뛰다)", "ex": "되튀어 나온 결과를 낳다", "g": [["유의어", "lead to (~으로 이어지다), cause (일으키다), bring about (초래하다), produce (낳다), yield (낳다)"], ["관련어", "result from (~에서 비롯되다)"]], "c": ["result in the highest benefit (가장 큰 이익을 낳다)", "result in misfortune (불운을 초래하다)", "as a result (그 결과)"], "s": [["Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "그 때문에 우리는 시장과 가격 책정을 이용하여 그러한 재화, 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분한다.", "본문", ""], ["They believe that counting the number of children one has could result in misfortune and prefer to report fewer children than they have.", "그들은 자녀 수를 세는 것이 불운을 초래할 수 있다고 믿어서, 실제보다 더 적은 자녀 수를 보고하는 쪽을 택한다.", "2020-수능", ""], ["The fruit ripening process brings about the softening of cell walls, sweetening and the production of chemicals that give colour and flavour.", "과일이 익는 과정은 세포벽이 부드러워지고, 단맛이 늘어나며, 색과 맛을 내는 화학 물질이 생성되는 결과를 가져온다.", "2021-평가원-6월", ""]]}, {"w": "benefit", "ipa": "ˈbenɪfɪt", "m": "ⓝ 이익, 혜택 ⓥ 이롭다, 득을 보다", "d": [["ⓝ", "an advantage or helpful effect", "이점이나 도움이 되는 효과"], ["ⓥ", "to be useful to someone; to get help from something", "누군가에게 도움이 되다; 무언가로부터 도움을 얻다"]], "et": "bene (좋게) + facere (하다)", "ex": "좋은 일을 하다", "g": [["유의어", "advantage (이점), profit (이익), gain (이득)"], ["반의어", "harm (해), disadvantage (불리한 점), cost (대가)"], ["파생어", "beneficial ⓐ 유익한"]], "c": ["the highest benefit (가장 큰 이익)", "health benefits (건강상의 이점)", "benefit from (~으로부터 이익을 얻다)"], "s": [["Because of that, we use markets and pricing to allocate those goods, services, and resources to where they might result in the highest benefit.", "그 때문에 우리는 시장과 가격 책정을 이용하여 그러한 재화, 서비스, 자원을 가장 큰 이익을 낼 수 있는 곳에 배분한다.", "본문", ""], ["One message emphasized the opportunity to do good: donating would benefit students, faculty, and staff.", "한 메시지는 선행을 할 기회를 강조했다. 기부가 학생, 교수, 교직원에게 도움이 될 것이라는 내용이었다.", "2022-고1-교육청-9월", ""], ["Besides physical health, gardening has profound mental health benefits.", "신체 건강 외에도 정원 가꾸기는 정신 건강에 깊은 이점이 있다.", "2025-고1-교육청-9월", ""]]}, {"w": "scarcity", "ipa": "ˈskersəti", "m": "ⓝ 부족, 희소성", "d": [["ⓝ", "a situation in which there is not enough of something", "어떤 것이 충분하지 않은 상황"]], "et": "scarce (부족한) ← 라틴어 excerpere (골라내다) + -ity", "ex": "골라낼 만큼 드문 상태", "g": [["유의어", "shortage (부족), lack (결핍), deficiency (결핍)"], ["반의어", "abundance (풍부), plenty (풍부), surplus (과잉, 잉여)"], ["관련어", "not enough (충분하지 않은), insufficient (불충분한), limited (한정된)"], ["파생어", "scarce ⓐ 부족한, 드문, scarcely ad. 거의 ~않다"]], "c": ["limited supply (제한된 공급)", "problems of scarcity (희소성의 문제)", "scarcity of attention (주의력의 부족)", "scarce resources (부족한 자원)"], "s": [["In Star Trek, however, there isn't much scarcity.", "그러나 스타트렉에는 희소성이 별로 없다.", "본문", ""], ["In the unlimited condition shoppers bought 3.3 cans on average, whereas in the scarce condition, when there was a limit, they bought 5.3 on average.", "제한이 없는 조건에서 쇼핑객들은 평균 3.3캔을 샀지만, 구매 제한이 있는 희소 조건에서는 평균 5.3캔을 샀다.", "2023-고1-교육청-6월", ""], ["Whoever has an abundance of sugar hands some over; whoever is running short gets help.", "당이 풍부한 쪽은 일부를 내주고, 부족한 쪽은 도움을 받는다.", "2022-고1-교육청-11월", ""]]}, {"w": "reproduce", "ipa": "ˌriːprəˈduːs", "m": "ⓥ 복제하다, 재현하다; 번식하다", "d": [["ⓥ", "to make a copy of something; to produce young", "무언가를 복사하다; 새끼를 낳다"]], "et": "re (다시) + producere (만들어 내다)", "ex": "다시 만들어 내다", "g": [["유의어", "copy (복사하다), recreate (재현하다), breed (번식하다)"], ["파생어", "reproduction ⓝ 복제, 번식, reproductive ⓐ 생식의"]], "c": ["reproduce any food (어떤 음식이든 복제하다)", "reproduce past experiences (과거 경험을 재현하다)", "reproduce more slowly (더 느리게 번식하다)"], "s": [["Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 떨어진 곳과 소통하며, 별들 사이를 여행할 수 있게 되었다.", "본문", ""], ["A creature must get from the place it is born — often occupied by its parent — to a place where it can survive, grow, and reproduce.", "생물은 태어난 곳, 흔히 부모가 차지하고 있는 곳에서 살아남고 자라고 번식할 수 있는 곳으로 이동해야 한다.", "2024-고1-교육청-3월", ""], ["Naturally, your mind recreates what it just \"saw\" based on what it's been told.", "당연히 당신의 마음은 들은 내용을 바탕으로 방금 '본' 것을 재현한다.", "2020-고1-교육청-6월", ""]]}, {"w": "transport", "ipa": "trænsˈpɔːrt", "m": "ⓥ 수송하다, 이동시키다 ⓝ 수송, 교통수단", "d": [["ⓥ", "to move people or things from one place to another", "사람이나 물건을 한 곳에서 다른 곳으로 옮기다"]], "et": "trans (건너) + portare (나르다)", "ex": "건너편으로 나르다", "g": [["유의어", "carry (나르다), move (옮기다), deliver (배달하다)"], ["파생어", "transportation ⓝ 수송, 교통"]], "c": ["transport oneself (이동하다)", "public transport (대중교통)", "air transport (항공 운송)"], "s": [["Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 떨어진 곳과 소통하며, 별들 사이를 여행할 수 있게 되었다.", "본문", ""], ["Later, the arrival of air transport opened up more of the world and led to tourism growth.", "이후 항공 운송의 등장은 세계의 더 많은 곳을 열어 주었고 관광의 성장으로 이어졌다.", "2023-고1-교육청-3월", ""], ["When people think about the development of cities, rarely do they consider the critical role of vertical transportation.", "사람들은 도시의 발전을 생각할 때 수직 운송의 결정적인 역할을 거의 고려하지 않는다.", "2021-고1-교육청-6월", ""]]}, {"w": "in the blink of an eye", "ipa": "ɪn ðə blɪŋk əv ən aɪ", "m": "눈 깜짝할 사이에", "d": [["phr.", "extremely quickly", "아주 빠르게"]], "et": "blink (눈을 깜박임) ← 중세 영어 blenken (힐끗 보다)", "ex": "눈을 한 번 깜박이는 동안", "g": [["유의어", "instantly (즉시), immediately (곧바로), in no time (곧, 순식간에)"], ["관련어", "blink (눈을 깜박이다), in a snap (순식간에)"]], "c": ["transport ~ in the blink of an eye (눈 깜짝할 사이에 이동시키다)", "in a snap (순식간에)", "split-second decisions (순간적인 결정)"], "s": [["Technology has allowed that society to reproduce any food they want, transport themselves thousands of miles in the blink of an eye, communicate over light-years, and travel among the stars.", "기술 덕분에 그 사회는 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 수천 마일을 이동하고, 수 광년 떨어진 곳과 소통하며, 별들 사이를 여행할 수 있게 되었다.", "본문", ""], ["We use this type of forceful, pad-to-pad precision gripping without thinking about it, and literally in a snap.", "우리는 이런 종류의 힘 있는, 손가락 끝을 맞댄 정밀한 쥐기를 생각하지도 않고 말 그대로 순식간에 해낸다.", "2025-수능", ""], ["It is really challenging to deal with the fact that we're human and can't always respond instantly.", "우리가 인간이어서 항상 즉시 반응할 수는 없다는 사실을 감당하는 것은 정말 힘든 일이다.", "2024-고2-교육청-3월", ""]]}, {"w": "educate", "ipa": "ˈedʒukeɪt", "m": "ⓥ 교육하다, 가르치다", "d": [["ⓥ", "to teach someone, especially in a school or college", "특히 학교에서 누군가를 가르치다"]], "et": "e (밖으로) + ducere (이끌다)", "ex": "(능력을) 밖으로 이끌어 내다", "g": [["유의어", "teach (가르치다), train (훈련시키다), instruct (지도하다)"], ["파생어", "education ⓝ 교육, educational ⓐ 교육의, educator ⓝ 교육자"]], "c": ["be fully educated (충분히 교육받다)", "well educated (잘 교육받은)", "educate the public (대중을 교육하다)"], "s": [["All of humanity in that world has been fully educated so that they can participate in this prosperity.", "그 세계의 모든 인류는 이러한 번영에 참여할 수 있도록 충분히 교육받았다.", "본문", ""], ["His father, who was not well educated, had a deep interest in financial and political issues.", "그의 아버지는 교육을 많이 받지 못했지만, 재정과 정치 문제에 깊은 관심을 가졌다.", "2023-고1-교육청-6월", ""], ["Most designers are educated to work as individuals, and design literature contains countless references to 'the designer'.", "대부분의 디자이너는 개인으로 일하도록 교육받으며, 디자인 문헌에는 '디자이너'에 대한 언급이 무수히 많다.", "2023-평가원-9월", ""]]}, {"w": "participate in", "ipa": "pɑːrˈtɪsɪpeɪt ɪn", "m": "ⓥ ~에 참여하다, 참가하다", "d": [["ⓥ", "to take part in an activity or event", "어떤 활동이나 행사에 참여하다"]], "et": "pars (부분) + capere (잡다)", "ex": "한몫을 잡다", "g": [["유의어", "take part in (~에 참가하다), share in (~을 함께 누리다), join (함께하다), engage in (~에 관여하다)"], ["파생어", "participant ⓝ 참가자, participation ⓝ 참여"]], "c": ["participate in this prosperity (이 번영에 참여하다)", "participate in the event (행사에 참가하다)", "public participation (공공 참여)"], "s": [["All of humanity in that world has been fully educated so that they can participate in this prosperity.", "그 세계의 모든 인류는 이러한 번영에 참여할 수 있도록 충분히 교육받았다.", "본문", ""], ["The letter was addressed to his classmate Stephanie, who had also participated in the contest.", "그 편지는 그 대회에 함께 참가했던 그의 반 친구 Stephanie에게 보내는 것이었다.", "2021-평가원-6월", ""], ["Your participation will be helpful in building a safer school environment for our students.", "여러분의 참여는 우리 학생들을 위해 더 안전한 학교 환경을 만드는 데 도움이 될 것입니다.", "2024-평가원-9월", ""]]}, {"w": "prosperity", "ipa": "prɑːˈsperəti", "m": "ⓝ 번영, 번성", "d": [["ⓝ", "the state of being successful, especially by making a lot of money", "특히 돈을 많이 벌어 성공한 상태"]], "et": "라틴어 prosperitas ← prosperus (뜻대로 되는)", "ex": "바라는 대로 잘되는 상태", "g": [["유의어", "wealth (부), abundance (풍요), success (성공), well-being (행복)"], ["반의어", "poverty (가난), hardship (어려움)"], ["파생어", "prosper ⓥ 번영하다, prosperous ⓐ 번영하는"]], "c": ["economic prosperity (경제적 번영)", "collective prosperity (집단적 번영)", "participate in prosperity (번영에 참여하다)"], "s": [["All of humanity in that world has been fully educated so that they can participate in this prosperity.", "그 세계의 모든 인류는 이러한 번영에 참여할 수 있도록 충분히 교육받았다.", "본문", ""], ["The growing industry came to symbolize the convenience and prosperity of the American dream.", "성장하는 그 산업은 아메리칸드림의 편리함과 번영을 상징하게 되었다.", "2026-고1-교육청-3월", ""], ["Over the last few centuries, humanity's collective prosperity has skyrocketed, as technological progress has made us far wealthier than ever before.", "지난 몇 세기 동안 기술 진보가 우리를 그 어느 때보다 훨씬 더 부유하게 만들면서 인류의 집단적 번영은 급등했다.", "2024-고2-교육청-9월", ""]]}, {"w": "generative", "ipa": "ˈdʒenərətɪv", "m": "ⓐ 생성하는, 생성형의", "d": [["ⓐ", "able to produce or create something new", "새로운 것을 만들어 내거나 창조할 수 있는"]], "et": "라틴어 generare (낳다, 만들다) + -ive", "ex": "만들어 내는", "g": [["유의어", "creative (창조적인), productive (생산적인)"], ["파생어", "generate ⓥ 만들어 내다, generation ⓝ 생성; 세대"]], "c": ["generative AI (생성형 인공 지능)", "generate income (소득을 창출하다)", "generate ideas (아이디어를 만들어 내다)"], "s": [["Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다.", "본문", ""], ["Residents develop an identity in part based on how the landscape can generate income for the community.", "주민들은 그 경관이 지역 사회에 어떻게 소득을 창출할 수 있는지에 부분적으로 기반하여 정체성을 형성한다.", "2021-평가원-9월", ""], ["Creativity is the ability to generate novel and valuable ideas.", "창의성은 새롭고 가치 있는 아이디어를 만들어 내는 능력이다.", "2025-고1-교육청-10월", ""]]}, {"w": "dimension", "ipa": "daɪˈmenʃn", "m": "ⓝ 차원, 측면; 크기, 치수", "d": [["ⓝ", "a particular part or aspect of a situation", "상황의 특정한 부분이나 측면"], ["ⓝ", "a measurement such as length, height, or width", "길이, 높이, 너비 같은 치수"]], "et": "dis (따로) + metiri (재다) + -sion", "ex": "따로따로 잰 크기", "g": [["유의어", "aspect (측면), side (측면), area (영역), element (요소)"], ["파생어", "dimensional ⓐ 차원의"]], "c": ["many dimensions of (~의 많은 측면)", "three dimensions (3차원)", "performance dimensions (성과 측면)"], "s": [["Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다.", "본문", ""], ["The prominence of the social dimension in food writing might suggest that the flavor of food is taking a back seat.", "음식에 관한 글에서 사회적 측면이 두드러진다는 것은 음식의 맛이 뒷전으로 밀려나고 있음을 시사할지도 모른다.", "2025-고2-교육청-3월", ""], ["When observing a subject, you see depth and three dimensions.", "대상을 관찰할 때 당신은 깊이와 3차원을 본다.", "2025-고2-교육청-6월", ""]]}, {"w": "similarly", "ipa": "ˈsɪmələrli", "m": "ad. 마찬가지로, 비슷하게", "d": [["ad.", "in a similar way", "비슷한 방식으로"]], "et": "similar (비슷한) ← 라틴어 similis (닮은) + -ly", "ex": "닮은 방식으로", "g": [["유의어", "likewise (마찬가지로), in the same way (같은 방식으로), equally (똑같이)"], ["반의어", "differently (다르게)"], ["파생어", "similar ⓐ 비슷한, similarity ⓝ 유사성"]], "c": ["similarly highly abundant (마찬가지로 매우 풍요로운)", "Similarly, ... (마찬가지로, ~)", "similar to (~와 비슷한)"], "s": [["Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다.", "본문", ""], ["Similarly, almost everyone has birthmarks, which are due to mutations that occurred as our body's cells multiplied to form skin.", "마찬가지로 거의 모든 사람에게 모반이 있는데, 이는 우리 몸의 세포가 증식하여 피부를 형성할 때 일어난 돌연변이 때문이다.", "2024-고2-교육청-10월", ""], ["Learning does not happen in the same way for all people because cultural influences are influential from the beginning of life.", "문화적 영향은 생애 초기부터 큰 영향력을 발휘하기 때문에 학습은 모든 사람에게 같은 방식으로 일어나지 않는다.", "2020-고1-교육청-9월", ""]]}, {"w": "abundant", "ipa": "əˈbʌndənt", "m": "ⓐ 풍부한, 많은", "d": [["ⓐ", "existing in large quantities; more than enough", "대량으로 존재하는; 충분하고도 남는"]], "et": "ab (~에서) + undare (넘쳐흐르다) ← unda (물결)", "ex": "물결처럼 넘쳐흐르는", "g": [["유의어", "plentiful (풍부한), rich (풍부한), plenty of (많은)"], ["반의어", "scarce (부족한), rare (드문)"], ["파생어", "abundance ⓝ 풍부"]], "c": ["highly abundant (매우 풍부한)", "an abundant source (풍부한 원천)", "an abundance of (풍부한 ~)"], "s": [["Generative AI has the potential to allow many dimensions of our own society to be similarly highly abundant.", "생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워지게 할 잠재력을 지니고 있다.", "본문", ""], ["It's an affliction of abundance that drives you to keep all of your options open and to avoid risks.", "당신이 모든 선택지를 열어 두고 위험을 피하게 만드는 것은 바로 풍요가 낳은 고통이다.", "2020-고1-교육청-11월", ""], ["In the fading evening light, she found the two rare black birds in their nest.", "저물어 가는 저녁 빛 속에서 그녀는 둥지에 있는 희귀한 검은 새 두 마리를 발견했다.", "2019-평가원-9월", ""]]}, {"w": "universe", "ipa": "ˈjuːnɪvɜːrs", "m": "ⓝ 우주; (특정한) 세계, 영역", "d": [["ⓝ", "everything that exists, including all stars and planets; a particular world or area of experience", "모든 별과 행성을 포함해 존재하는 모든 것; 특정한 세계나 경험의 영역"]], "et": "uni (하나) + versus (돌린) ← vertere (돌리다)", "ex": "하나로 돌아가는 전체", "g": [["유의어", "cosmos (우주), world (세계)"], ["파생어", "universal ⓐ 보편적인, universally ad. 보편적으로"]], "c": ["the Star Trek universe (스타트렉 세계)", "the origin of the universe (우주의 기원)", "as old as the universe (우주만큼 오래된)"], "s": [["Few people may view the Star Trek universe through an economic lens, but doing so provides a window into a world that might soon be upon us.", "스타트렉 세계를 경제적 렌즈로 보는 사람은 거의 없겠지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 세상을 들여다보는 창을 얻게 된다.", "본문", ""], ["Many atoms in your body are nearly as old as the universe itself.", "당신 몸속의 많은 원자는 거의 우주만큼이나 오래되었다.", "2025-고1-교육청-9월", ""], ["The challenge this creates is as with everything in our universe: as the laws of physics explain, 'what goes up, must come down'.", "이것이 만들어 내는 과제는 우리 우주의 모든 것과 마찬가지인데, 물리 법칙이 설명하듯 '올라간 것은 반드시 내려온다'는 것이다.", "2026-고1-교육청-6월", ""]]}]}, {"q": "32", "t": "빈칸", "items": [{"w": "customer", "ipa": "ˈkʌstəmər", "m": "ⓝ 고객, 손님", "d": [["ⓝ", "a person who buys goods or services from a shop or business", "가게나 기업에서 상품이나 서비스를 사는 사람"]], "et": "custom (관습, 단골) ← 라틴어 consuetudo (습관) + -er", "ex": "늘 오는 단골", "g": [["유의어", "client (고객), consumer (소비자), buyer (구매자)"], ["반의어", "seller (판매자)"]], "c": ["customer service (고객 서비스)", "potential customers (잠재 고객)", "customer satisfaction (고객 만족)"], "s": [["People, whether customers or otherwise, want to feel heard.", "사람들은 고객이든 아니든 자신의 말이 경청되고 있다고 느끼고 싶어 한다.", "본문", ""], ["Far too often, companies collect valuable customer information that ends up buried and never used.", "너무나 자주 기업들은 귀중한 고객 정보를 수집하지만, 그 정보는 결국 묻혀서 전혀 사용되지 않는다.", "2021-고1-교육청-11월", ""], ["In fact, consumers who have a high need for touch tend to like products that provide this opportunity.", "실제로 촉각에 대한 욕구가 큰 소비자들은 그런 기회를 제공하는 제품을 좋아하는 경향이 있다.", "2020-고1-교육청-3월", ""]]}, {"w": "manager", "ipa": "ˈmænɪdʒər", "m": "ⓝ 관리자, 경영자, 책임자", "d": [["ⓝ", "a person who is in charge of running a business, department, or team", "사업체, 부서, 팀을 운영하는 책임자"]], "et": "manage ← 이탈리아어 maneggiare (말을 다루다) ← 라틴어 manus (손) + -er", "ex": "손으로 다루는 사람", "g": [["유의어", "supervisor (감독자), director (책임자), boss (상사)"], ["반의어", "employee (직원), worker (노동자)"], ["파생어", "manage ⓥ 관리하다, management ⓝ 경영, 관리"]], "c": ["speak to a manager (관리자와 이야기하다)", "project manager (프로젝트 관리자)", "managers of each department (각 부서의 관리자)"], "s": [["When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "누군가가 고객 서비스 센터에 전화하거나, 관리자와 이야기하게 해 달라고 요청하거나, 마음에 걸리는 일이 있어 당신의 사무실에 찾아올 때, 그들은 누군가가 자신의 우려를 들어 주고 그것을 해결해 줄 것이라고 느끼고 싶어 한다.", "본문", ""], ["John was once in the office of a manager, Michael, when the phone rang.", "한번은 John이 관리자인 Michael의 사무실에 있을 때 전화가 울렸다.", "2019-평가원-6월", ""], ["A problem, however, is that supervisors often work in locations apart from their employees and therefore are not able to observe their subordinates' performance.", "그러나 문제는 관리자들이 흔히 직원들과 떨어진 곳에서 일하기 때문에 부하 직원들의 업무 수행을 관찰할 수 없다는 것이다.", "2022-평가원-6월", ""]]}, {"w": "on one's mind", "ipa": "ɑːn wʌnz maɪnd", "m": "마음에 걸리는, 신경 쓰이는", "d": [["phr.", "worrying someone or being thought about by them", "누군가를 걱정시키거나 그가 계속 생각하고 있는"]], "et": "mind ← 고대 영어 gemynd (기억, 생각)", "ex": "마음 위에 놓여 있는", "g": [["유의어", "worried about (~을 걱정하는), concerned (걱정하는), troubled (고민하는)"], ["관련어", "concern (걱정거리), worry (걱정), keep in mind (명심하다)"]], "c": ["with something on one's mind (마음에 걸리는 일이 있어서)", "keep in mind (명심하다)", "come to mind (생각나다)"], "s": [["When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "누군가가 고객 서비스 센터에 전화하거나, 관리자와 이야기하게 해 달라고 요청하거나, 마음에 걸리는 일이 있어 당신의 사무실에 찾아올 때, 그들은 누군가가 자신의 우려를 들어 주고 그것을 해결해 줄 것이라고 느끼고 싶어 한다.", "본문", ""], ["Over the last week, Jason had been feeling worried about his daughter, Sally.", "지난 일주일 동안 Jason은 딸 Sally를 걱정하고 있었다.", "2019-평가원-9월", ""], ["You must keep in mind that education is a long-term investment of time, money, and effort into humans.", "교육은 인간에게 시간, 돈, 노력을 들이는 장기 투자라는 것을 명심해야 한다.", "2020-고1-교육청-3월", ""]]}, {"w": "address", "ipa": "əˈdres", "m": "ⓥ (문제를) 다루다, 처리하다; 연설하다; 주소를 쓰다 ⓝ 주소; 연설", "d": [["ⓥ", "to think about a problem and start dealing with it", "문제를 생각하고 처리하기 시작하다"], ["ⓥ", "to speak or write to someone", "누군가에게 말하거나 글을 쓰다"]], "et": "ad (~쪽으로) + directus (곧은)", "ex": "똑바로 향하게 하다", "g": [["유의어", "deal with (다루다), handle (처리하다), tackle (씨름하다), respond to (~에 대응하다), solve (해결하다)"], ["반의어", "ignore (무시하다), neglect (방치하다)"]], "c": ["address their concerns (그들의 우려를 해결하다)", "address those needs (그러한 요구를 해결하다)", "be addressed to (~에게 보내지다)"], "s": [["When someone calls customer service, asks to speak to a manager, or comes into your office with something on their mind, they want to feel like someone is listening to their concerns and going to address them.", "누군가가 고객 서비스 센터에 전화하거나, 관리자와 이야기하게 해 달라고 요청하거나, 마음에 걸리는 일이 있어 당신의 사무실에 찾아올 때, 그들은 누군가가 자신의 우려를 들어 주고 그것을 해결해 줄 것이라고 느끼고 싶어 한다.", "본문", ""], ["This detailed thinking may be the only way to discover restrictions or risks that were not addressed in the estimating process.", "이러한 세밀한 사고는 견적 과정에서 다루어지지 않은 제약이나 위험을 발견하는 유일한 방법일지도 모른다.", "2022-평가원-6월", ""], ["Distractions are everywhere, but if you want to achieve your goals, you must learn how to tackle distractions.", "주의를 흩뜨리는 것은 어디에나 있지만, 목표를 이루고 싶다면 그것에 대처하는 법을 배워야 한다.", "2020-고1-교육청-11월", ""]]}, {"w": "pay attention to", "ipa": "peɪ əˈtenʃn tuː", "m": "ⓥ ~에 주의를 기울이다", "d": [["ⓥ", "to watch, listen to, or think about something carefully", "어떤 것을 주의 깊게 보거나 듣거나 생각하다"]], "et": "attention ← 라틴어 attendere (~에 마음을 뻗다)", "ex": "주의를 지불하다", "g": [["유의어", "listen to (~에 귀 기울이다), attend to (~에 주의를 기울이다), focus on (~에 집중하다), notice (주목하다)"], ["반의어", "ignore (무시하다), neglect (소홀히 하다)"], ["관련어", "draw attention to (~에 주의를 끌다)"], ["파생어", "attentive ⓐ 주의 깊은"]], "c": ["pay close attention to (~에 세심한 주의를 기울이다)", "without paying attention to (~에 주의를 기울이지 않고)", "draw attention to (~에 주의를 끌다)"], "s": [["First, they have to feel like the other person paid attention to what they said.", "첫째, 그들은 상대방이 자신이 한 말에 주의를 기울였다고 느껴야 한다.", "본문", ""], ["Paying attention to the nonverbal messages you send can make a significant difference in your relationship with students.", "당신이 보내는 비언어적 메시지에 주의를 기울이면 학생들과의 관계에 큰 차이를 만들 수 있다.", "2021-고1-교육청-11월", ""], ["To whom it may concern, I would like to draw your attention to a problem that frequently occurs with the No. 35 buses.", "관계자분께, 35번 버스에서 자주 발생하는 문제에 주목해 주셨으면 하여 글을 씁니다.", "2023-고2-교육청-9월", ""]]}, {"w": "demonstrate", "ipa": "ˈdemənstreɪt", "m": "ⓥ 보여 주다, 입증하다; 시위하다", "d": [["ⓥ", "to show something clearly; to prove that something is true", "무언가를 분명히 보여 주다; 어떤 것이 사실임을 증명하다"]], "et": "de (완전히) + monstrare (보여 주다)", "ex": "완전히 보여 주다", "g": [["유의어", "show (보여 주다), prove (증명하다), make clear (분명히 하다), express (나타내다), display (드러내다)"], ["반의어", "hide (숨기다), conceal (감추다)"], ["파생어", "demonstration ⓝ 증명, 시위"]], "c": ["demonstrate that they listened (들었다는 것을 보여 주다)", "demonstrate the importance of (~의 중요성을 보여 주다)", "demonstrated unambiguously that (~을 명백히 입증했다)"], "s": [["And third, the other person has to demonstrate that they listened.", "그리고 셋째, 상대방이 자신이 들었다는 것을 보여 주어야 한다.", "본문", ""], ["The purpose of the exercise is to demonstrate the importance of an individual's action.", "그 활동의 목적은 개인의 행동이 얼마나 중요한지 보여 주는 것이다.", "2018-수능", ""], ["Turning the uncertainty into numbers has proved a potent way of analyzing the paths and finding the shortcut to your destination.", "불확실성을 숫자로 바꾸는 것은 경로를 분석하고 목적지로 가는 지름길을 찾는 강력한 방법임이 입증되었다.", "2023-수능", ""]]}, {"w": "key", "ipa": "kiː", "m": "ⓐ 핵심적인, 가장 중요한 ⓝ 열쇠; 비결", "d": [["ⓐ", "very important or necessary", "매우 중요하거나 필요한"], ["ⓝ", "the most important thing for achieving something", "어떤 것을 이루는 데 가장 중요한 것"]], "et": "고대 영어 cǣg (열쇠)", "ex": "문을 여는 열쇠 → 핵심", "g": [["유의어", "crucial (결정적인), essential (필수적인), central (중심적인), vital (매우 중요한)"], ["반의어", "minor (사소한), unimportant (중요하지 않은)"]], "c": ["This ~ is key. (이 ~이 핵심이다.)", "the key to success (성공의 비결)", "a key factor (핵심 요인)"], "s": [["This last part is key.", "이 마지막 부분이 핵심이다.", "본문", ""], ["Repeated exposure — and a willingness to change — is the key.", "반복적인 노출, 그리고 변화하려는 의지가 핵심이다.", "2026-고1-교육청-3월", ""], ["The crucial take-away from analyzing office plans over time is that the answers keep changing.", "시간에 따른 사무실 배치도를 분석해서 얻는 결정적인 교훈은 답이 계속 바뀐다는 것이다.", "2025-평가원-9월", ""]]}, {"w": "imagine", "ipa": "ɪˈmædʒɪn", "m": "ⓥ 상상하다; 생각하다", "d": [["ⓥ", "to form a picture or idea of something in your mind", "마음속에 무언가의 모습이나 생각을 그리다"]], "et": "라틴어 imaginari (마음속에 그리다) ← imago (모습, 상)", "ex": "마음속에 상을 그리다", "g": [["유의어", "picture (상상하다), visualize (마음속에 그리다), suppose (가정하다)"], ["파생어", "imagination ⓝ 상상력, imaginary ⓐ 상상의, imaginative ⓐ 상상력이 풍부한"]], "c": ["Imagine doing ~ (~한다고 상상해 보라)", "imagine what it would be like (그것이 어떨지 상상하다)", "imagine how (어떻게 ~할지 상상하다)"], "s": [["Imagine talking to someone who provided no response.", "아무 반응도 보이지 않는 사람과 이야기한다고 상상해 보라.", "본문", ""], ["Centuries ago, people found it difficult to imagine how someone could see an object without seeing what color it is.", "수 세기 전에 사람들은 어떻게 물체의 색을 보지 않고 그 물체를 볼 수 있는지 상상하기 어려워했다.", "2023-수능", ""], ["One would probably not visualize a hammer as seen from the ion to facilitate the cognitive process.", "뇌는 본래 불필요한 노력을 싫어하기 때문에, 인지 과정을 수월하게 하려고 정보를 끊임없이 단순화하고 일반화하려 한다.", "2024-고2-교육청-10월", ""], ["But it is no light matter to quickly and correctly pen a long and complicated composition.", "하지만 길고 복잡한 글을 빠르고 정확하게 쓰는 것은 결코 가벼운 일이 아니다.", "2018-평가원-9월", ""]]}, {"w": "assumption", "ipa": "əˈsʌmpʃn", "m": "ⓝ 가정, 추정, 전제", "d": [["ⓝ", "something that you accept as true without proof", "증거 없이 사실로 받아들이는 것"]], "et": "assume ← ad (~에) + sumere (취하다) + -tion", "ex": "미리 사실로 취해 놓은 것", "g": [["유의어", "premise (전제), belief (믿음), hypothesis (가설)"], ["관련어", "take as a given (기정사실로 받아들이다)"], ["파생어", "assume ⓥ 가정하다"]], "c": ["make simplifying assumptions (단순화 가정을 하다)", "a false assumption (잘못된 가정)", "a natural assumption of (~에 대한 자연스러운 가정)"], "s": [["Indeed, all models must make simplifying assumptions of this nature.", "실제로 모든 모델은 이런 성격의 단순화 가정을 할 수밖에 없다.", "본문", ""], ["However, recent behavioral research casts doubt on this fundamental assumption.", "그러나 최근의 행동 연구는 이 근본적인 가정에 의문을 제기한다.", "2019-수능", ""], ["That is because geography starts from the premise that it matters where something takes place on Earth's surface.", "그것은 지리학이 어떤 일이 지구 표면의 어디에서 일어나는지가 중요하다는 전제에서 출발하기 때문이다.", "2026-평가원-6월", ""]]}, {"w": "verbal", "ipa": "ˈvɜːrbl", "m": "ⓐ 말의, 언어의, 구두의", "d": [["ⓐ", "relating to words or using spoken words", "말과 관련되거나 말을 사용하는"]], "et": "라틴어 verbum (말) + -al", "ex": "말의", "g": [["유의어", "spoken (구두의), oral (구두의), linguistic (언어의)"], ["반의어", "nonverbal (비언어적인), written (문자로 쓴)"]], "c": ["verbal model (언어적 모델)", "verbal communication (언어적 의사소통)", "nonverbal messages (비언어적 메시지)"], "s": [["When Wallace and Darwin presented their verbal model of biological evolution, there was little knowledge of how variation generation and inheritance worked.", "Wallace와 Darwin이 생물학적 진화에 관한 언어적 모델을 제시했을 때, 변이의 생성과 유전이 어떻게 작동하는지에 대한 지식은 거의 없었다.", "본문", ""], ["Research psychologists often work with self-report data, made up of participants' verbal accounts of their why electrons have their particular mass and charge, they just accept the measured values and move on.", "원자 결합 모델에서 물리학자들은 전자가 왜 그런 특정한 질량과 전하를 갖는지 설명하려 하지 않고, 그저 측정된 값을 받아들이고 넘어간다.", "본문", ""], ["She says that our attempts to escape being miserable are in fact making us even more miserable.", "그녀는 비참함에서 벗어나려는 우리의 시도가 사실은 우리를 훨씬 더 비참하게 만들고 있다고 말한다.", "2024-고2-교육청-10월", ""], ["But it's better to disappoint a few people over small things, than to abandon your dreams for an empty inbox.", "하지만 텅 빈 받은 편지함을 위해 꿈을 포기하는 것보다 사소한 일로 몇 사람을 실망시키는 편이 낫다.", "2022-평가원-6월", ""]]}, {"w": "measure", "ipa": "ˈmeʒər", "m": "ⓥ 측정하다, 재다 ⓝ 조치; 척도", "d": [["ⓥ", "to find the size, amount, or degree of something", "어떤 것의 크기, 양, 정도를 알아내다"], ["ⓝ", "an action taken to deal with a problem", "문제를 처리하기 위해 취하는 행동"]], "et": "라틴어 mensura (측정) ← metiri (재다)", "ex": "재는 일", "g": [["유의어", "gauge (측정하다), assess (평가하다), calculate (계산하다)"], ["파생어", "measurement ⓝ 측정, measurable ⓐ 측정할 수 있는"]], "c": ["the measured values (측정된 값)", "measure the mass of (~의 질량을 측정하다)", "take measures (조치를 취하다)"], "s": [["In a model of atomic bonds, physicists don't attempt to explain why electrons have their particular mass and charge, they just accept the measured values and move on.", "원자 결합 모델에서 물리학자들은 전자가 왜 그런 특정한 질량과 전하를 갖는지 설명하려 하지 않고, 그저 측정된 값을 받아들이고 넘어간다.", "본문", ""], ["We can roughly say that measuring the mass of a star involves various theories.", "별의 질량을 측정하는 데에는 여러 이론이 관련된다고 대략 말할 수 있다.", "2024-고2-교육청-10월", ""], ["We will take all possible measures to minimize noise and any other inconvenience.", "소음과 그 밖의 불편을 최소화하기 위해 가능한 모든 조치를 취하겠습니다.", "2023-수능", ""]]}, {"w": "move on", "ipa": "muːv ɑːn", "m": "ⓥ (다음으로) 넘어가다, 진행하다", "d": [["ⓥ", "to start doing or discussing something new", "새로운 것을 하거나 논의하기 시작하다"]], "et": "move ← 라틴어 movere (움직이다) + on (계속해서)", "ex": "계속 앞으로 움직이다", "g": [["유의어", "proceed (진행하다), go on (계속하다), continue (계속하다)"], ["반의어", "stay (머무르다)"]], "c": ["accept and move on (받아들이고 넘어가다)", "move on to (~로
