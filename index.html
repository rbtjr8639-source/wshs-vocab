 every species tested — a characteristic pattern of errors, with discrimination becoming less accurate as the quantities get bigger.", "그것은, 그리고 이것은 시험된 모든 종에서 동일한데, 양이 커질수록 구별이 덜 정확해지는 특징적인 오류 패턴을 보여 준다.", "본문", ""], ["Just as humans seek to be able to enjoy the characteristic goods of a human life, so a finch seeks a finch's life and the whale a whale's life.", "인간이 인간의 삶 특유의 좋은 것들을 누릴 수 있기를 추구하듯이, 핀치는 핀치의 삶을, 고래는 고래의 삶을 추구한다.", "2025-고1-교육청-10월", ""], ["With a unique combination of traits, the human hand shaped our history.", "독특한 특성들의 조합을 지닌 인간의 손은 우리의 역사를 형성했다.", "2025-수능", ""]]}, {"w": "discrimination", "ipa": "dɪˌskrɪmɪˈneɪʃn", "m": "ⓝ 구별, 식별; 차별", "d": [["ⓝ", "the ability to recognize the difference between things; unfair treatment of a person or group", "사물 간의 차이를 알아보는 능력; 사람이나 집단에 대한 부당한 대우"]], "et": "dis (떨어져) + cernere (가려내다) + -ation", "ex": "따로 떼어 가려냄", "g": [["유의어", "distinction (구별), differentiation (구별), prejudice (편견, 차별)"], ["반의어", "confusion (혼동), equality (평등)"], ["파생어", "discriminate ⓥ 구별하다, 차별하다, nondiscrimination ⓝ 차별하지 않음"]], "c": ["discrimination between A and B (A와 B의 구별)", "racial discrimination (인종 차별)", "discriminate against (~을 차별하다)"], "s": [["It shows — and this is the same in every species tested — a characteristic pattern of errors, with discrimination becoming less accurate as the quantities get bigger.", "그것은, 그리고 이것은 시험된 모든 종에서 동일한데, 양이 커질수록 구별이 덜 정확해지는 특징적인 오류 패턴을 보여 준다.", "본문", ""], ["The historian Livy claimed the city's original population was comprised of immigrants flooding in from all directions, attracted by Romulus's deliberate policy of nondiscrimination.", "역사가 리비우스는 그 도시의 최초 인구가 로물루스의 의도적인 차별 금지 정책에 이끌려 사방에서 몰려든 이민자들로 구성되어 있었다고 주장했다.", "2025-고1-교육청-10월", ""], ["A distinction needs to be made between designers working truly alone and those working in a group.", "정말로 혼자 일하는 디자이너와 집단으로 일하는 디자이너는 구별되어야 한다.", "2023-평가원-9월", ""]]}, {"w": "quantity", "ipa": "ˈkwɑːntəti", "m": "ⓝ 양, 수량", "d": [["ⓝ", "an amount or number of something", "무언가의 양이나 수"]], "et": "quantus (얼마나 많은) + -ity", "ex": "얼마나 많은지의 정도", "g": [["유의어", "amount (양), number (수), volume (양, 부피)"], ["관련어", "quality (질)"], ["파생어", "quantitative ⓐ 양적인"]], "c": ["in large quantities (대량으로)", "quantity and quality (양과 질)", "a small quantity of (소량의)"], "s": [["It shows — and this is the same in every species tested — a characteristic pattern of errors, with discrimination becoming less accurate as the quantities get bigger.", "그것은, 그리고 이것은 시험된 모든 종에서 동일한데, 양이 커질수록 구별이 덜 정확해지는 특징적인 오류 패턴을 보여 준다.", "본문", ""], ["Therefore, companies have invented multiple ways to ensure that their customers consume the produced items in larger and larger quantities and more and more frequently.", "그러므로 기업들은 고객들이 생산된 물품을 점점 더 많은 양으로, 그리고 점점 더 자주 소비하도록 보장하는 여러 방법을 고안해 왔다.", "2025-고1-교육청-10월", ""], ["In all of these instances, children are developing a notion of quantity.", "이 모든 사례에서 아이들은 양에 대한 개념을 발달시키고 있다.", "2022-고1-교육청-6월", ""]]}, {"w": "species", "ipa": "ˈspiːʃiːz", "m": "ⓝ (생물) 종 (단수·복수 동형)", "d": [["ⓝ", "a group of animals or plants whose members are similar and can breed together", "구성원들이 비슷하고 서로 번식할 수 있는 동물이나 식물의 집단"]], "et": "specere (보다)", "ex": "겉모습으로 구분되는 부류", "g": [["유의어", "kind (종류), type (유형), breed (품종)"]], "c": ["endangered species (멸종 위기종)", "every species tested (시험된 모든 종)", "a species of (~의 한 종)"], "s": [["It shows — and this is the same in every species tested — a characteristic pattern of errors, with discrimination becoming less accurate as the quantities get bigger.", "그것은, 그리고 이것은 시험된 모든 종에서 동일한데, 양이 커질수록 구별이 덜 정확해지는 특징적인 오류 패턴을 보여 준다.", "본문", ""], ["Some species are nervous, fast, and programmed for instant flight when they perceive a threat.", "어떤 종들은 예민하고 빠르며, 위협을 감지하면 즉시 도망치도록 프로그램되어 있다.", "2025-고1-교육청-9월", ""], ["Near the equator, many species of bird breed all year round.", "적도 근처에서는 많은 종의 새들이 1년 내내 번식한다.", "2024-고2-교육청-10월", ""]]}, {"w": "tell A from B", "ipa": "tel eɪ frʌm biː", "m": "phr. A와 B를 구별하다", "d": [["phr." riety (다양성)"]], "c": ["a wide range of (광범위한, 다양한)", "range from A to B (A에서 B까지 이르다)", "the top end of the range (범위의 최상단)"], "s": [["Rats that learned to press a lever a given number of times, from four up to twenty-four, became markedly less and less precise in their responses as the number increased: by the top end of the range they would merely produce a spread of numbers around the target.", "4번부터 24번까지 정해진 횟수만큼 레버를 누르도록 학습한 쥐들은 숫자가 커질수록 반응이 현저하게 점점 덜 정확해졌다. 범위의 최상단에 이르면 그들은 단지 목표 숫자 주변으로 흩어진 숫자들을 만들어 낼 뿐이었다.", "본문", ""], ["We are exceptionally smart, and this helps us adapt to a wide range of environments.", "우리는 유달리 똑똑하며, 이는 우리가 매우 다양한 환경에 적응하는 데 도움이 된다.", "2026-수능", ""], ["If your experience is limited to a narrow range of topics, then the scope of your imagination will likewise be narrow, which would be harmful to creativity.", "당신의 경험이 좁은 범위의 주제에 한정되어 있다면 상상력의 범위도 마찬가지로 좁아질 것이고, 이는 창의성에 해로울 것이다.", "2026-고1-교육청-6월", ""]]}, {"w": "target", "ipa": "ˈtɑːrɡɪt", "m": "ⓝ 목표, 표적, 대상 ⓥ 목표로 삼다, 겨냥하다", "d": [["ⓝ", "a result or number you are trying to achieve; an object or person aimed at", "달성하려는 결과나 수치; 겨냥하는 대상이나 사람"], ["ⓥ", "to aim something at a particular group or thing", "특정 집단이나 대상을 겨냥하다"]], "et": "targe (고대 프랑스어: 작은 방패)", "ex": "활을 쏘아 맞히는 둥근 과녁", "g": [["유의어", "goal (목표), aim (목표), objective (목적)"]], "c": ["around the target (목표 주변에)", "reach/hit a target (목표를 달성하다)", "target audience (목표 독자층, 대상 관객)"], "s": [["Rats that learned to press a lever a given number of times, from four up to twenty-four, became markedly less and less precise in their responses as the number increased: by the top end of the range they would merely produce a spread of numbers around the target.", "4번부터 24번까지 정해진 횟수만큼 레버를 누르도록 학습한 쥐들은 숫자가 커질수록 반응이 현저하게 점점 덜 정확해졌다. 범위의 최상단에 이르면 그들은 단지 목표 숫자 주변으로 흩어진 숫자들을 만들어 낼 뿐이었다.", "본문", ""], ["They target different areas of your brain, keeping it agile and alert.", "그것들은 뇌의 서로 다른 영역을 겨냥하여 뇌를 민첩하고 기민하게 유지해 준다.", "2025-고2-교육청-10월", ""], ["So why not set your goals much higher than you consider worthy from the beginning?", "그러니 처음부터 당신이 가치 있다고 여기는 것보다 목표를 훨씬 더 높게 설정하는 것은 어떤가?", "2020-고1-교육청-9월", ""]]}, {"w": "observation", "ipa": "ˌɑːbzərˈveɪʃn", "m": "ⓝ 관찰, 관측; (관찰에 따른) 의견, 소견", "d": [["ⓝ", "the act of watching something carefully; a remark based on what you have noticed", "무언가를 주의 깊게 지켜보는 행위; 알아챈 것에 근거한 언급"]], "et": "ob (~을 향해) + servare (지켜보다) + -ation", "ex": "대상을 향해 지켜봄", "g": [["유의어", "finding (발견, 결과), examination (조사), monitoring (관찰, 감시), remark (언급)"], ["파생어", "observe ⓥ 관찰하다, 준수하다, observer ⓝ 관찰자"]], "c": ["a common observation (흔히 관찰되는 사실)", "careful observation (주의 깊은 관찰)", "under observation (관찰 중인)"], "s": [["It is a common observation that when testing the accuracy of animals' number sense, the size of the numbers matters.", "동물의 수 감각의 정확성을 시험할 때 숫자의 크기가 중요하다는 것은 흔히 관찰되는 사실이다.", "본문", ""], ["He paid close attention to the things he saw and wrote down his observations.", "그는 자신이 본 것들에 세심한 주의를 기울이고 관찰한 것을 기록했다.", "2022-고1-교육청-3월", ""], ["Science is concerned with accumulating and understanding observations of the physical world.", "과학은 물리적 세계에 대한 관찰을 축적하고 이해하는 일에 관심을 둔다.", "2025-고1-교육청-6월", ""]]}, {"w": "matter", "ipa": "ˈmætər", "m": "ⓥ 중요하다 ⓝ 문제, 일; 물질", "d": [["ⓥ", "to be important", "중요하다"], ["ⓝ", "a subject or situation; physical substance", "주제나 상황; 물리적 물질"]], "et": "materia (재료, 물질)", "ex": "실체가 있는 것 → 중요한 것", "g": [["유의어", "count (중요하다), be important (중요하다), make a difference (차이를 만들다, 중요하다), issue (문제)"]], "c": ["the size matters (크기가 중요하다)", "no matter what (무엇이 ~하더라도)", "a matter of time (시간문제)"], "s": [["It is a common observation that when testing the accuracy of animals' number sense, the size of the numbers matters.", "동물의 수 감각의 정확성을 시험할 때 숫자의 크기가 중요하다는 것은 흔히 관찰되는 사실이다.", "본문", ""], ["The entire fashion industry is built to convince people that fashion matters, so they must purchase new clothing, even though the old is still perfectly functionable.", "패션 산업 전체는 사람들에게 패션이 중요하다고 납득시키도록 만들어져 있어서, 그들은 기존 옷이 여전히 완벽하게 기능하는데도 새 옷을 구매해야 한다.", "2025-고1-교육청-10월", ""], ["What you've written can have misspellings, errors of fact, rude comments, obvious lies, but it doesn't matter.", "당신이 쓴 글에 철자 오류, 사실 오류, 무례한 말, 명백한 거짓말이 있을 수 있지만, 그것은 중요하지 않다.", "2021-고1-교육청-3월", ""]]}, {"w": "monitor", "ipa": "ˈmɑːnɪtər", "m": "ⓥ 관찰하다, 감시하다, 모니터하다 ⓝ 화면, 감시 장치", "d": [["ⓥ", "to watch or check something carefully over a period of time", "일정 기간 동안 무언가를 주의 깊게 지켜보거나 확인하다"]], "et": "monere (경고하다, 상기시키다) + -tor", "ex": "지켜보며 경고해 주는 것", "g": [["유의어", "observe (관찰하다), track (추적하다), check (확인하다)"], ["반의어", "ignore (무시하다), neglect (방치하다)"]], "c": ["be easily monitored (쉽게 관찰되다)", "monitor progress (진행 상황을 관찰하다)", "closely monitor (면밀히 관찰하다)"], "s": [["the pattern of errors is not easily monitored", "오류 패턴은 쉽게 관찰되지 않는다", "본문", ""], ["We expect people to monitor machines, which means keeping alert for long periods, something we are bad at.", "우리는 사람들이 기계를 감시하기를 기대하는데, 이는 오랜 시간 동안 경계를 늦추지 않는 것을 의미하며, 이는 우리가 잘하지 못하는 일이다.", "2021-수능", ""], ["If you haven't thought about energy peaks before, take a few days to observe yourself.", "전에 자신의 에너지가 최고조에 이르는 때에 대해 생각해 본 적이 없다면, 며칠 동안 자신을 관찰해 보라.", "2023-고1-교육청-3월", ""]]}]}, {"q": "33", "t": "빈칸", "items": [{"w": "trope", "ipa": "troʊp", "m": "ⓝ 비유적 표현; 흔히 쓰이는 통념", "d": [["ⓝ", "a familiar idea or expression that is often used", "흔히 쓰이는 익숙한 생각이나 표현"]], "et": "그리스어 tropos (방향 전환, 말하는 방식) ← trepein (돌리다)", "ex": "말을 돌려 하는 방식", "g": [["관련어", "metaphor (은유)"]], "c": ["the cultural trope (문화적 비유, 통념)"], "s": [["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition ― what we commonly refer to as thinking ― is actually a key building block of emotion.", "감정을 이성적 사고의 반대로 묘사하는 문화적 비유에도 불구하고, 인지, 즉 우리가 흔히 생각이라고 부르는 것은 사실 감정의 핵심 구성 요소이다.", "본문", ""]]}, {"w": "depict", "ipa": "dɪˈpɪkt", "m": "ⓥ 묘사하다, 그리다", "d": [["ⓥ", "to show or describe someone or something in a picture, story, or words", "그림, 이야기, 말로 누군가나 무언가를 보여 주거 ipa": "kɑːɡˈnɪʃn", "m": "ⓝ 인지, 인식", "d": [["ⓝ", "the mental process of knowing, thinking, learning, and understanding", "알고, 생각하고, 배우고, 이해하는 정신적 과정"]], "et": "co (함께, 완전히) + gnoscere (알다) + -tion", "ex": "완전히 알게 되는 과정", "g": [["유의어", "thinking (사고), thought (생각), perception (지각), understanding (이해)"], ["파생어", "cognitive ⓐ 인지의"], ["대조어", "emotion (감정)"]], "c": ["cognition and emotion (인지와 감정)", "cognitive ability (인지 능력)", "cognitive development (인지 발달)"], "s": [["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition — what we commonly refer to as thinking — is actually a key building block of emotion.", "감정을 이성적 사고의 반대로 묘사하는 문화적 비유에도 불구하고, 인지, 즉 우리가 흔히 '생각'이라고 부르는 것은 사실 감정의 핵심 구성 요소이다.", "본문", ""], ["This bi-directionality of cognition and emotion allows us to adjust difficult emotions by changing the way we think.", "인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 힘든 감정을 조절할 수 있게 해 준다.", "본문", ""], ["Studies have shown that spending time in nature, even in a small garden, can elevate mood, improve cognition, and reduce depression symptoms.", "연구에 따르면 자연 속에서, 심지어 작은 정원에서라도 시간을 보내는 것은 기분을 좋게 하고 인지 능력을 향상하며 우울 증상을 줄일 수 있다.", "2025-고1-교육청-9월", ""]]}, {"w": "refer to", "ipa": "rɪˈfɜːr tuː", "m": "phr. 언급하다, 가리키다; 참고하다 (refer to A as B: A를 B라고 부르다)", "d": [["phr.", "to mention or describe someone or something; to look at something for information", "누군가나 무언가를 언급하거나 묘사하다; 정보를 얻기 위해 무언가를 보다"]], "et": "re (뒤로) + ferre (나르다)", "ex": "다시 그쪽으로 가져가 가리키다", "g": [["유의어", "mention (언급하다), call (부르다), consult (참고하다)"], ["파생어", "reference ⓝ 언급, 참고"]], "c": ["refer to A as B (A를 B라고 부르다)", "refer to a dictionary (사전을 참고하다)", "what we refer to as (우리가 ~라고 부르는 것)"], "s": [["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition — what we commonly refer to as thinking — is actually a key building block of emotion.", "감정을 이성적 사고의 반대로 묘사하는 문화적 비유에도 불구하고, 인지, 즉 우리가 흔히 '생각'이라고 부르는 것은 사실 감정의 핵심 구성 요소이다.", "본문", ""], ["Those who purchase the goods of a company are called customers.", "어떤 회사의 상품을 구매하는 사람들은 고객이라고 불린다.", "2025-고1-교육청-10월", ""], ["There are some cultures that can be referred to as \"people who live outside of time.\"", "'시간 밖에서 사는 사람들'이라고 부를 수 있는 문화들이 있다.", "2020-고1-교육청-3월", ""]]}, {"w": "building block", "ipa": "ˈbɪldɪŋ blɑːk", "m": "ⓝ 구성 요소, 기본 요소", "d": [["ⓝ", "one of the basic parts from which something larger is made", "더 큰 것을 이루는 기본적인 부분 중 하나"]], "et": "build (짓다) + block (덩어리, 벽돌)", "ex": "건물을 쌓는 벽돌 하나하나", "g": [["유의어", "component (구성 요소), element (요소), basis (기초), foundation (토대)"]], "c": ["a key building block of (~의 핵심 구성 요소)", "the building blocks of life (생명의 기본 요소)"], "s": [["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition — what we commonly refer to as thinking — is actually a key building block of emotion.", "감정을 이성적 사고의 반대로 묘사하는 문화적 비유에도 불구하고, 인지, 즉 우리가 흔히 '생각'이라고 부르는 것은 사실 감정의 핵심 구성 요소이다.", "본문", ""], ["Atoms are the basic building blocks of crystals, and since all rocks are made up of crystals, the more you know about atoms, the better.", "원자는 결정의 기본 구성 요소이며, 모든 암석은 결정으로 이루어져 있기 때문에 원자에 대해 더 많이 알수록 더 좋다.", "2023-고1-교육청-9월", ""], ["Scientists need only understand how to use these various elements in ways that others would accept.", "과학자들은 이러한 다양한 요소를 다른 사람들이 받아들일 만한 방식으로 사용하는 법만 이해하면 된다.", "2022-수능", ""]]}, {"w": "circumstance", "ipa": "ˈsɜːrkəmstæns", "m": "ⓝ (주로 pl.) 상황, 환경, 사정", "d": [["ⓝ", "a fact or condition that affects a situation", "어떤 상황에 영향을 미치는 사실이나 조건"]], "et": "circum (주위에) + stare (서다) + -ance", "ex": "주위에 서 있는 것들", "g": [["유의어", "situation (상황), condition (조건), environment (환경), surroundings (주변 환경)"]], "c": ["under the circumstances (이런 상황에서는)", "under no circumstances (어떤 일이 있어도 ~않다)", "due to unexpected circumstances (예기치 못한 사정으로)"], "s": [["How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그런 다음 그 감정은 되돌아와 우리가 생각하는 방식에 영향을 미친다.", "본문", ""], ["a circumstance causing more crimes in newly developed city areas", "새로 개발된 도시 지역에서 더 많은 범죄를 일으키는 상황", "2025-고1-교육청-10월", ""], ["In other circumstances, such as when violence is shown on TV, the closeness variable is used to reduce emotional intensity.", "텔레비전에서 폭력이 나올 때와 같은 다른 상황에서는, 감정의 강도를 줄이기 위해 근접성 변수가 사용된다.", "2026-평가원-6월", ""]]}, {"w": "experience", "ipa": "ɪkˈspɪriəns", "m": "ⓥ 경험하다, 겪다 ⓝ 경험", "d": [["ⓥ", "to have something happen to you or feel something", "어떤 일을 겪거나 무언가를 느끼다"], ["ⓝ", "knowledge or skill gained from doing something; an event that affects you", "무언가를 해서 얻은 지식이나 기술; 영향을 주는 사건"]], "et": "ex (밖으로) + periri (시도하다)", "ex": "직접 밖으로 나가 시도해 봄", "g": [["유의어", "undergo (겪다), go through (겪다), feel (느끼다)"], ["반의어", "inexperience (경험 부족)"], ["파생어", "experienced ⓐ 경험 많은"]], "c": ["experience emotions (감정을 경험하다)", "share one's experience (경험을 공유하다)", "from experience (경험으로)"], "s": [["How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그런 다음 그 감정은 되돌아와 우리가 생각하는 방식에 영향을 미친다.", "본문", ""], ["Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience.", "귀하께서 지난여름 저희와 함께 여행하셨기에, 귀하의 경험에 대해 몇 마디 공유해 주실 의향이 있는지 정중히 여쭙고자 합니다.", "2025-고1-교육청-10월", ""], ["When we experience emotions in such worlds, this is not a sign that we are being incoherent or regressed.", "우리가 그런 세계에서 감정을 경험할 때, 이것은 우리가 일관성이 없거나 퇴행하고 있다는 신호가 아니다.", "2022-평가원-6월", ""]]}, {"w": "echo", "ipa": "ˈekoʊ", "m": "ⓥ 울리다, 메아리치다; 되풀이하다 ⓝ 메아리, 반향", "d": [["ⓥ", "to be repeated as a sound; to repeat or have an effect again", "소리가 반복되어 울리다; 반복하거나 다시 영향을 미치다"]], "et": "Echo (그리스 신화: 남의 말끝만 되풀이하는 요정)", "ex": "되돌아와 다시 울리다", "g": [["유의어", "repeat (반복하다), reflect (반영하다), return (되돌아오다)"]], "c": ["echo back (되돌아와 울리다)", "echo through (~에 울려 퍼지다)", "echo one's opinion (~의 의견을 되풀이하다)"], "s": [["How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그런 다음 그 감정은 되돌아와 우리가 생각하는 방식에 영향을 미친다.", "본문", ""], ["Someone else's body language affects our own body, which then creates an emotional echo that makes us feel accordingly.", "다른 사람의 몸짓 언어는 우리 자신의 몸에 영향을 미치고, 이는 우리가 그에 따라 느끼게 만드는 감정적 반향을 만들어 낸다.", "2023-고1-교육청-6월", ""], ["Randomization helps to ensure that results reflect the treatment and not factors that might influence the grouping of subjects.", "무작위 배정은 결과가 피험자의 집단 구성에 영향을 줄 수 있는 요인이 아니라 처치를 반영하도록 보장하는 데 도움이 된다.", "2022-평가원-9월", ""]]}, {"w": "influence", "ipa": "ˈɪnfluəns", "m": "ⓥ 영향을 미치다 ⓝ 영향(력)", "d": [["ⓥ", "to have an effect on someone's thoughts, actions, or development", "누군가의 생각, 행동, 발달에 영향을 주다"], ["ⓝ", "the power to have an effect on someone or something", "누군가나 무언가에 영향을 줄 수 있는 힘"]], "et": "in (안으로) + fluere (흐르다)", "ex": "안으로 흘러 들어가 작용하다", "g": [["유의어", "affect (영향을 미치다), shape (형성하다), impact (영향을 주다)"], ["관련어", "two-way (양방향의), mutual (상호의)"], ["파생어", "influential ⓐ 영향력 있는"]], "c": ["influence how (~하는 방식에 영향을 미치다)", "have an influence on (~에 영향을 미치다)", "cultural influences (문화적 영향)"], "s": [["How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그런 다음 그 감정은 되돌아와 우리가 생각하는 방식에 영향을 미친다.", "본문", ""], ["Even the sounds that come both from the atmospheres in which we eat and our interactions with the food (such as chewing) and the tools we use to eat influence our eating experience.", "심지어 우리가 식사하는 분위기와 음식과의 상호 작용(씹기 같은), 그리고 식사에 사용하는 도구로부터 나오는 소리조차도 우리의 식사 경험에 영향을 미친다.", "2025-고1-교육청-10월", ""], ["As the empire expanded across three continents, Rome eagerly adopted new cultural influences and absorbed incoming groups", "제국이 세 대륙에 걸쳐 확장되면서, 로마는 새로운 문화적 영향을 열심히 받아들이고 유입되는 집단들을 흡수했다", "2025-고1-교육청-10월", ""]]}, {"w": "anxiety", "ipa": "æŋˈzaɪəti", "m": "ⓝ 불안(감), 걱정", "d": [["ⓝ", "a feeling of worry or nervousness about something that might happen", "일어날지도 모르는 일에 대한 걱정이나 초조함"]], "et": "angere (목을 조르다, 괴롭히다) + -iety", "ex": "목을 조이는 듯한 괴로움", "g": [["유의어", "worry (걱정), nervousness (초조함), stress (스트레스), fear (두려움), concern (우려)"], ["반의어", "calm (평온), relief (안도)"], ["파생어", "anxious ⓐ 불안한, 갈망하는"]], "c": ["reduce anxiety (불안을 줄이다)", "test anxiety (시험 불안)", "be anxious about (~에 대해 불안해하다)"], "s": [["For instance, if you walk into a test thinking you are bad at taking tests, your anxiety will be increased.", "예를 들어, 당신이 시험을 잘 못 본다고 생각하면서 시험장에 들어가면, 불안감이 커질 것이다.", "본문", ""], ["It allows you to focus on the present moment, reducing stress and anxiety.", "그것은 당신이 현재 순간에 집중할 수 있게 하여 스트레스와 불안을 줄여 준다.", "2025-고1-교육청-9월", ""], ["With a sigh of relief, I walked over to the car.", "안도의 한숨을 쉬며, 나는 차 쪽으로 걸어갔다.", "2025-고1-교육청-10월", ""]]}, {"w": "performance", "ipa": "pərˈfɔːrməns", "m": "ⓝ 성과, 성적; 수행; 공연", "d": [["ⓝ", "how well someone does something; the act of doing a task; a show in front of an audience", "누군가가 무언가를 얼마나 잘하는지; 일을 수행하는 것; 관객 앞에서의 공연"]], "et": "per (완전히) + fournir (제공하다) + -ance", "ex": "완전히 해내는 것", "g": [["유의어", "result (결과), score (점수), achievement (성취), show (공연)"], ["파생어", "perform ⓥ 수행하다, 공연하다, performer ⓝ 연주자, 공연자"]], "c": ["performance on the test (시험 성적)", "improve performance (성과를 향상시키다)", "a live performance (라이브 공연)"], "s": [["Then you don't feel good about your performance on the test, and that becomes evidence for continuing to think that you're bad at test taking.", "그러면 당신은 시험 성적에 대해 기분이 좋지 않고, 그것은 당신이 시험을 잘 못 본다고 계속 생각하게 하는 증거가 된다.", "본문", ""], ["However, using caffeine to improve alertness and mental performance doesn't replace getting a good night's sleep.", "그러나 각성 상태와 정신적 수행 능력을 높이기 위해 카페인을 사용하는 것이 밤에 숙면을 취하는 것을 대신하지는 못한다.", "2021-고1-교육청-9월", ""], ["We believe your continued involvement will further enhance our students' learning experience and academic achievement.", "저희는 선생님의 지속적인 참여가 학생들의 학습 경험과 학업 성취를 더욱 높여 줄 것이라 믿습니다.", "2025-고2-교육청-6월", ""]]}, {"w": "evidence", "ipa": "ˈevɪdəns", "m": "ⓝ 증거, 근거", "d": [["ⓝ", "facts or signs that show that something is true", "무언가가 사실임을 보여 주는 사실이나 징후"]], "et": "e (밖으로) + videre (보다) + -ence", "ex": "밖으로 드러나 보이는 것", "g": [["유의어", "proof (증거), sign (징후), indication (표시)"], ["파생어", "evident ⓐ 분명한, evidently ad. 분명히"]], "c": ["evidence for/of (~에 대한 증거)", "scientific evidence (과학적 증거)", "there is no evidence that (~라는 증거가 없다)"], "s": [["Then you don't feel good about your performance on the test, and that becomes evidence for continuing to think that you're bad at test taking.", "그러면 당신은 시험 성적에 대해 기분이 좋지 않고, 그것은 당신이 시험을 잘 못 본다고 계속 생각하게 하는 증거가 된다.", "본문", ""], ["If the evidence indicates that the charity is really helping others, they make a substantial donation.", "그 자선 단체가 정말로 다른 사람들을 돕고 있다는 증거가 나타나면, 그들은 상당한 금액을 기부한다.", "2018-수능", ""], ["The studied nonchalance of patients in a dentist's waiting room is a poor indication of their inner anxiety.", "치과 대기실에 있는 환자들이 짐짓 꾸며 낸 태연함은 그들의 내면의 불안을 제대로 보여 주지 못한다.", "2023-평가원-6월", ""]]}, {"w": "bi-directionality", "ipa": "ˌbaɪdəˌrekʃəˈnæləti", "m": "ⓝ 양방향성", "d": [["ⓝ", "the quality of working or moving in two opposite directions", "서로 반대되는 두 방향으로 작용하거나 움직이는 성질"]], "et": "bi (둘) + direction (방향) + -al (형용사) + -ity (명사)", "ex": "두 방향으로 오가는 성질", "g": [["관련어", "direction (방향), mutual (상호 간의)"]], "c": ["the bi-directionality of A and B (A와 B의 양방향성)"], "s": [["This bi-directionality of cognition and emotion allows us to adjust difficult emotions by changing the way we think.", "인지와 감정의 이러한 양방향성 덕분에 우리는 생각하는 방식을 바꿈으로써 힘든 감정을 조절할 수 있다.", "본문", ""]]}, {"w": "adjust", "ipa": "əˈdʒʌst", "m": "ⓥ 조절하다, 조정하다; 적응하다", "d": [["ⓥ", "to change something slightly to make it better; to get used to a new situation", "더 낫게 하기 위해 무언가를 약간 바꾸다; 새로운 상황에 익숙해지다"]], "et": "ad (~에) + juxta (가까이)", "ex": "딱 맞게 가까이 맞추다", "g": [["유의어", "regulate (조절하다), control (통제하다), modify (수정하다), change (바꾸다), adapt (적응하다)"], ["파생어", "adjustment ⓝ 조정, 적응"]], "c": ["adjust emotions (감정을 조절하다)", "adjust to (~에 적응하다)", "adjust the volume (음량을 조절하다)"], "s": [["This bi-directionality of cognition and emotion allows us to adjust difficult emotions by changing the way we think.", "인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 힘든 감정을 조절할 수 있게 해 준다.", "본문", ""], ["We know within limits, not absolutely, even if the limits can usually be adjusted to satisfy our needs.", "비록 그 한계가 대개 우리의 필요를 충족하도록 조정될 수 있다 하더라도, 우리는 절대적으로가 아니라 한계 내에서 안다.", "2021-평가원-9월", ""], ["Skiing also became a lot harder as he struggled to adapt to the visual stimulation.", "그가 시각적 자극에 적응하느라 애쓰면서 스키 타기도 훨씬 더 어려워졌다.", "2022-고1-교육청-11월", ""]]}, {"w": "anticipation", "ipa": "ænˌtɪsɪˈpeɪʃn", "m": "ⓝ 기대, 예상", "d": [["ⓝ", "a feeling of excitement about something that is going to happen; the act of expecting something", "일어날 일에 대한 들뜬 기분; 무언가를 예상하는 행위"]], "et": "ante (먼저) + capere (잡다) + -ation", "ex": "미리 앞서 잡아 봄", "g": [["유의어", "expectation (기대), excitement (흥분), prediction (예측)"], ["파생어", "anticipate ⓥ 예상하다, 기대하다"]], "c": ["excitement and anticipation (흥분과 기대)", "in anticipation of (~을 기대하여, 예상하여)", "anticipate problems (문제를 예상하다)"], "s": [["By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and anticipation, it means I'm ready — you can work those pathways to your advantage.", "다르게 생각함으로써, 즉 '나는 가끔 긴장하지만 여전히 시험을 잘 보는 사람이야' 또는 '그 긴장감은 그저 흥분과 기대일 뿐이고, 내가 준비되었다는 뜻이야'라고 생각함으로써, 당신은 그 경로들을 당신에게 유리하게 작동시킬 수 있다.", "본문", ""], ["Feelings of worry, which are activated in anticipation of future events, are often experienced in everyday situations.", "미래의 사건을 예상할 때 활성화되는 걱정의 감정은 일상적인 상황에서 자주 경험된다.", "2026-평가원-6월", ""], ["When we have these false expectations, it tends to discourage us from continuing to move forward.", "우리가 이런 잘못된 기대를 가지면, 그것은 우리가 계속 앞으로 나아가는 것을 단념하게 만드는 경향이 있다.", "2024-고2-교육청-3월", ""]]}, {"w": "pathway", "ipa": "ˈpæθweɪ", "m": "ⓝ 경로, 길", "d": [["ⓝ", "a path or route; a series of connections or steps by which something happens", "길이나 경로; 어떤 일이 일어나는 일련의 연결이나 단계"]], "et": "path (길) + way (길)", "ex": "지나가는 길", "g": [["유의어", "path (길), route (경로), channel (통로)"]], "c": ["neural pathways (신경 경로)", "a pathway to success (성공으로 가는 길)", "work those pathways (그 경로들을 작동시키다)"], "s": [["By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and anticipation, it means I'm ready — you can work those pathways to your advantage.", "다르게 생각함으로써, 즉 '나는 가끔 긴장하지만 여전히 시험을 잘 보는 사람이야' 또는 '그 긴장감은 그저 흥분과 기대일 뿐이고, 내가 준비되었다는 뜻이야'라고 생각함으로써, 당신은 그 경로들을 당신에게 유리하게 작동시킬 수 있다.", "본문", ""], ["While you sleep, your brain is hard at work forming the pathways necessary for learning and creating memories and new insights.", "당신이 잠든 동안, 뇌는 학습하고 기억과 새로운 통찰을 만들어 내는 데 필요한 경로를 형성하느라 열심히 일한다.", "2022-고1-교육청-3월", ""], ["At every step in our journey through life we encounter junctions with many different pathways leading into the distance.", "인생 여정의 매 단계에서 우리는 먼 곳으로 이어지는 여러 갈래의 길이 있는 갈림길을 만난다.", "2023-수능", ""]]}, {"w": "advantage", "ipa": "ədˈvæntɪdʒ", "m": "ⓝ 이점, 유리한 점", "d": [["ⓝ", "something that helps you be more successful than others", "다른 사람보다 더 성공하도록 도와주는 것"]], "et": "avant (앞에) + -age", "ex": "남보다 앞서 있는 상태", "g": [["유의어", "benefit (이익), strength (강점), merit (장점)"], ["반의어", "disadvantage (불리한 점), drawback (결점)"], ["파생어", "advantageous ⓐ 유리한"]], "c": ["in one's favor (~에게 유리하게)", "to one's advantage (~에게 유리하게)", "take advantage of (~을 이용하다)", "have an advantage over (~보다 유리하다)"], "s": [["By thinking differently — I get nervous sometimes, but I'm still a good test taker, or that nervous feeling is just excitement and anticipation, it means I'm ready — you can work those pathways to your advantage.", "다르게 생각함으로써, 즉 '나는 가끔 긴장하지만 여전히 시험을 잘 보는 사람이야' 또는 '그 긴장감은 그저 흥분과 기대일 뿐이고, 내가 준비되었다는 뜻이야'라고 생각함으로써, 당신은 그 경로들을 관련이 없거나 중요하지 않은"]], "et": "ir (부정) + relevare (들어 올리다, 관련시키다) + -ant", "ex": "관련지어 들어 올릴 수 없는", "g": [["유의어", "unrelated (관련 없는), unimportant (중요하지 않은)"], ["반의어", "relevant (관련 있는), related (관련된)"], ["파생어", "relevance ⓝ 관련성"]], "c": ["be irrelevant to (~와 무관하다)", "simply irrelevant (그야말로 무관한)", "highly relevant (매우 관련 있는)"], "s": [["And it argues that the human form of life is simply irrelevant when we think about what each type of animal needs and deserves.", "그리고 그것은 각 유형의 동물이 무엇을 필요로 하고 무엇을 받을 자격이 있는지를 생각할 때 인간의 삶의 형태는 그야말로 무관하다고 주장한다.", "본문", ""], ["What is relevant is their own forms of life.", "관련 있는 것은 그들 자신의 삶의 형태이다.", "본문", ""], ["Rather than irrelevant, moral questions are fundamental to the imposition of tax.", "도덕적 문제는 무관하기는커녕 세금 부과에 있어 근본적인 것이다.", "2023-평가원-9월", ""]]}, {"w": "deserve", "ipa": "dɪˈzɜːrv", "m": "ⓥ ~을 받을 자격이 있다, ~할 만하다", "d": [["ⓥ", "to have earned something because of the way you are or what you have done", "자신의 됨됨이나 행동 때문에 무언가를 받을 만하다"]], "et": "de (완전히) + servire (섬기다)", "ex": "완전히 섬겼으니 보답을 받을 만하다", "g": [["유의어", "earn (얻다, 받을 만하다), merit (~할 가치가 있다), be worthy of (~할 가치가 있다)"], ["파생어", "deserved ⓐ 받을 만한"]], "c": ["deserve to do (~할 자격이 있다)", "deserve respect (존중받을 자격이 있다)", "well deserved (충분히 받을 만한)"], "s": [["And it argues that the human form of life is simply irrelevant when we think about what each type of animal needs and deserves.", "그리고 그것은 각 유형의 동물이 무엇을 필요로 하고 무엇을 받을 자격이 있는지를 생각할 때 인간의 삶의 형태는 그야말로 무관하다고 주장한다.", "본문", ""], ["Your emotions deserve attention and give you important pieces of information.", "당신의 감정은 주목받을 가치가 있으며 당신에게 중요한 정보를 준다.", "2022-고1-교육청-6월", ""], ["Be mindful about every purchase by carefully researching the corporations that are taking our money to decide if they deserve our support.", "우리의 돈을 가져가는 기업들을 신중하게 조사하여 그들이 우리의 지지를 받을 자격이 있는지 판단함으로써 모든 구매에 신중을 기하라.", "2023-고2-교육청-9월", ""]]}, {"w": "extend", "ipa": "ɪkˈstend", "m": "ⓥ 확장하다, 넓히다, 연장하다; (범위가) 이르다", "d": [["ⓥ", "to make something bigger or longer; to reach or stretch over an area", "무언가를 더 크게 또는 길게 만들다; 어떤 범위에 걸쳐 이르다"]], "et": "ex (밖으로) + tendere (뻗다)", "ex": "밖으로 뻗어 나가다", "g": [["유의어", "broaden (넓히다), expand (확장하다), stretch (늘이다), lengthen (길게 하다)"], ["반의어", "shorten (줄이다), reduce (축소하다)"], ["파생어", "extension ⓝ 확장, 연장, extensive ⓐ 광범위한"]], "c": ["extend oneself (애써 노력하다, 역량을 넓히다)", "extend to (~에까지 이르다)", "extend a deadline (마감 기한을 연장하다)"], "s": [["We should extend ourselves and learn, not lazily picture animals as lesser humans, seeking a life sort of like our own.", "우리는 동물들을 우리 자신과 어느 정도 비슷한 삶을 추구하는 열등한 인간으로 안이하게 상상하지 말고, 스스로의 시야를 넓혀 배워야 한다.", "본문", ""], ["Fashion today extends to far more things than clothes: automobiles, mobile phones, computers — the list is extended indefinitely, limited only by the limits of the creative minds of the marketing divisions of companies.", "오늘날 패션은 옷보다 훨씬 더 많은 것들, 즉 자동차, 휴대폰, 컴퓨터로까지 확장되며, 그 목록은 기업 마케팅 부서의 창의적 사고의 한계에 의해서만 제한된 채 무한히 늘어난다.", "2025-고1-교육청-10월", ""], ["Therefore, I'd like to ask you to extend the library's operating hours to 7 p.m.", "그래서 도서관 운영 시간을 오후 7시까지 연장해 주실 것을 요청드리고 싶습니다.", "2025-고1-교육청-9월", ""]]}, {"w": "picture", "ipa": "ˈpɪktʃər", "m": "ⓥ 상상하다, 마음속에 그리다 ⓝ 그림, 사진; 상황", "d": [["ⓥ", "to imagine something or someone in a particular way", "무언가나 누군가를 특정한 방식으로 상상하다"]], "et": "pingere (그리다) + -ture", "ex": "마음속에 그린 것", "g": [["유의어", "imagine (상상하다), envision (마음속에 그리다), visualize (시각화하다)"]], "c": ["picture A as B (A를 B로 상상하다)", "get the picture (상황을 이해하다)", "the big picture (큰 그림, 전체 상황)"], "s": [["We should extend ourselves and learn, not lazily picture animals as lesser humans, seeking a life sort of like our own.", "우리는 동물들을 우리 자신과 어느 정도 비슷한 삶을 추구하는 열등한 인간으로 안이하게 상상하지 말고, 스스로의 시야를 넓혀 배워야 한다.", "본문", ""], ["You might try to visualize a large group of them.", "그것들의 큰 무리를 마음속에 그려 보려고 할 수도 있다.", "2026-고1-교육청-6월", ""], ["You're probably imagining the water level now falling, so there's less spending in the economy.", "당신은 아마 이제 수위가 내려가서 경제 내 지출이 줄어드는 모습을 상상하고 있을 것이다.", "2021-고1-교육청-9월", ""]]}, {"w": "lesser", "ipa": "ˈlesər", "m": "ⓐ 더 작은, 더 열등한, 덜 중요한", "d": [["ⓐ", "not as great in size, amount, or importance as something else", "크기, 양, 중요성이 다른 것만큼 크지 않은"]], "et": "less (더 적은) + -er (비교급 강조)", "ex": "더 적은, 더 못한", "g": [["유의어", "inferior (열등한), imperfect (불완전한), minor (사소한), lower (더 낮은)"], ["반의어", "greater (더 큰), superior (우월한)"]], "c": ["lesser humans (열등한 인간)", "to a lesser extent/degree (더 적은 정도로)", "the lesser of two evils (두 악 중 덜한 것)"], "s": [["We should extend ourselves and learn, not lazily picture animals as lesser humans, seeking a life sort of like our own.", "우리는 동물들을 우리 자신과 어느 정도 비슷한 삶을 추구하는 열등한 인간으로 안이하게 상상하지 말고, 스스로의 시야를 넓혀 배워야 한다.", "본문", ""], ["Make a practice of estimating the amount of time needed alongside items on your 'things to do' list, and learn by experience when tasks take a greater or lesser time than expected.", "'해야 할 일' 목록의 항목 옆에 필요한 시간을 추정해 적는 것을 습관으로 삼고, 일이 예상보다 더 많은 시간 또는 더 적은 시간이 걸리는 때를 경험을 통해 배우라.", "2023-고1-교육청-3월", ""], ["Why do people in the Mediterranean live longer and have a lower incidence of disease?", "지중해 지역 사람들은 왜 더 오래 살고 질병 발생률이 더 낮을까?", "2023-고2-교육청-6월", ""]]}, {"w": "sentient", "ipa": "ˈsenʃnt", "m": "ⓐ 지각 능력이 있는, 감각이 있는", "d": [["ⓐ", "able to experience feelings and sensations", "감정과 감각을 경험할 수 있는"]], "et": "sentire (느끼다) + -ent", "ex": "느낄 수 있는", "g": [["유의어", "conscious (의식이 있는), aware (인식하는), feeling (감정을 가진)"], ["반의어", "unconscious (의식이 없는)"], ["관련어", "sentience (지각력), sense (감각), sensation (감각, 느낌)"]], "c": ["sentient creatures/beings (지각 있는 존재)"], "s": [["According to the CA, each sentient creature should have the opportunity to flourish in the form of life characteristic for that creature.", "CA에 따르면, 지각 능력이 있는 각 생명체는 그 생명체 특유의 삶의 형태로 번성할 기회를 가져야 한다.", "본문", ""], ["While sentience and volition are aspects of mind and agency, morals are cultural tools developed to influence social behaviour: to cultivate the desirable and discourage the harmful.", "지각력과 의지는 정신과 행위 주체성의 측면인 반면, 도덕은 사회적 행동에 영향을 미치기 위해, 즉 바람직한 것은 기르고 해로운 것은 억제하기 위해 발달한 문화적 도구이다.", "2025-평가원-9월", ""], ["For example, right now you are not aware of all the actors you have ever seen.", "예를 들어, 지금 당신은 지금까지 본 모든 배우들을 의식하고 있지 않다.", "2026-고1-교육청-6월", ""]]}, {"w": "opportunity", "ipa": "ˌɑːpərˈtuːnəti", "m": "ⓝ 기회", "d": [["ⓝ", "a time or situation in which it is possible to do something you want", "원하는 것을 하는 것이 가능한 때나 상황"]], "et": "ob (~을 향해) + portus (항구) + -ity", "ex": "항구를 향해 부는 순풍, 좋은 때", "g": [["유의어", "chance (기회), opening (빈자리, 기회), occasion (때, 기회)"]], "c": ["have the opportunity to do (~할 기회를 갖다)", "take the opportunity (기회를 잡다)", "investment opportunities (투자 기회)"], "s": [["According to the CA, each sentient creature should have the opportunity to flourish in the form of life characteristic for that creature.", "CA에 따르면, 지각 능력이 있는 각 생명체는 그 생명체 특유의 삶의 형태로 번성할 기회를 가져야 한다.", "본문", ""], ["Banks that offer socially responsible investment opportunities and are committed to environmental sustainability will attract Gen Z's attention.", "사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능성에 전념하는 은행들이 Z세대의 관심을 끌 것이다.", "2025-고1-교육청-10월", ""], ["Then take the opportunity to prove you are the one!", "그렇다면 이 기회를 잡아 당신이 바로 그 사람임을 증명하세요!", "2023-고1-교육청-6월", ""]]}, {"w": "flourish", "ipa": "ˈflɜːrɪʃ", "m": "ⓥ 번성하다, 번창하다, 잘 자라다", "d": [["ⓥ", "to grow or develop successfully and healthily", "성공적이고 건강하게 자라거나 발전하다"]], "et": "flos (꽃) + -ish", "ex": "꽃이 활짝 피다", "g": [["유의어", "thrive (번성하다), prosper (번영하다), grow (자라다), do well (잘 지내다)"], ["반의어", "decline (쇠퇴하다), fade (쇠퇴하다, 사라지다)"]], "c": ["have the opportunity to flourish (번성할 기회를 갖다)", "allow A to flourish (A가 번성하게 하다)"], "s": [["According to the CA, each sentient creature should have the opportunity to flourish in the form of life characteristic for that creature.", "CA에 따르면, 지각 능력이 있는 각 생명체는 그 생명체 특유의 삶의 형태로 번성할 기회를 가져야 한다.", "본문", ""], ["As a consequence, those people, organizations, and countries that possess the highest-quality information are likely to prosper economically, socially, and politically.", "결과적으로, 가장 질 높은 정보를 가진 사람, 조직, 국가는 경제적, 사회적, 정치적으로 번영할 가능성이 크다.", "2019-수능", ""], ["In a climate of admiration for male artists and their female creations, the dress-designer first flourished as the same sort of creator.", "남성 예술가와 그들이 만든 여성상을 찬미하는 분위기 속에서, 의상 디자이너는 처음에 그와 같은 부류의 창작자로서 번성했다.", "2023-평가원-9월", ""]]}, {"w": "coexist", "ipa": "ˌkoʊɪɡˈzɪst", "m": "ⓥ 공존하다", "d": [["ⓥ", "to exist together at the same time or in the same place", "같은 시간이나 같은 장소에 함께 존재하다"]], "et": "co (함께) + exsistere (존재하다)", "ex": "함께 존재하다", "g": [["유의어", "live together (함께 살다), live in harmony (조화롭게 살다), in harmony (조화를 이루어)"], ["반의어", "conflict (충돌하다), clash (충돌하다)"], ["파생어", "coexistence ⓝ 공존"]], "c": ["coexist harmoniously with (~와 조화롭게 공존하다)", "peaceful coexistence (평화적 공존)"], "s": [["by coexisting harmoniously with humans", "인간과 조화롭게 공존함으로써", "본문", ""], ["We still think and act in ways that are in harmony with others around us, but it is through patterns that are more shaped by nurture, not just nature.", "우리는 여전히 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 본성뿐만 아니라 양육에 의해 더 많이 형성되는 패턴을 통해서이다.", "2025-고1-교육청-10월", ""], ["We cannot count on people's benevolence or goodwill, but even 'a nation of devils' can live in harmony in a legal system that binds every citizen equally.", "우리는 사람들의 자비나 선의에 기댈 수는 없지만, 모든 시민을 동등하게 구속하는 법체계 속에서는 '악마들의 나라'조차 조화롭게 살 수 있다.", "2026-수능", ""]]}, {"w": "imitate", "ipa": "ˈɪmɪteɪt", "m": "ⓥ 모방하다, 흉내 내다", "d": [["ⓥ", "to copy someone's behavior, speech, or appearance", "누군가의 행동, 말투, 외모를 따라 하다"]], "et": "imitari (본뜨다, 흉내 내다)", "ex": "그대로 본뜨다", "g": [["유의어", "copy (모방하다), mimic (흉내 내다), follow (따르다)"], ["반의어", "create (창조하다), originate (창시하다)"], ["파생어", "imitation ⓝ 모방"]], "c": ["imitate the human way of life (인간의 생활 방식을 모방하다)", "a cycle of imitation (모방의 순환)"], "s": [["through imitating the human way of life", "인간의 생활 방식을 모방함으로써", "본문", ""], ["If artists and designers rely too heavily on AI for inspiration and content generation, they may find themselves trapped in a cycle of imitation, unable to break free from the constraints of the AI's training data.", "예술가와 디자이너들이 영감과 콘텐츠 생성을 AI에 너무 많이 의존하면, 그들은 AI의 학습 데이터의 제약에서 벗어나지 못한 채 모방의 순환에 갇히게 될지도 모른다.", "2025-고1-교육청-10월", ""], ["The photograph, it seemed, did the work of imitating nature better than the painter ever could.", "사진은 화가가 할 수 있었던 것보다 자연을 모방하는 일을 더 잘 해내는 것처럼 보였다.", "2019-수능", ""]]}, {"w": "guidance", "ipa": "ˈɡaɪdns", "m": "ⓝ 지도, 안내, 조언", "d": [["ⓝ", "help or advice about how to do something", "무언가를 하는 방법에 대한 도움이나 조언"]], "et": "guider (고대 프랑스어: 길을 안내하다) + -ance", "ex": "길을 안내해 줌", "g": [["유의어", "advice (조언), direction (지시), instruction (지도)"], ["파생어", "guide ⓥ 안내하다 ⓝ 안내자"]], "c": ["under the guidance of (~의 지도 아래)", "career guidance (진로 지도)", "seek guidance (조언을 구하다)"], "s": [["under the guidance of more intelligent animals", "더 지능이 높은 동물들의 지도 아래", "본문", ""], ["Much of what we do each day is automatic and guided by habit, requiring little conscious awareness, and that's not a bad thing.", "우리가 매일 하는 일의 상당 부분은 자동적이고 습관에 이끌리며 의식적인 인식을 거의 필요로 하지 않는데, 그것은 나쁜 일이 아니다.", "2020-평가원-9월", ""], ["Throughout her career, she practiced Einstein's advice, \"Science is exploring, and exploring is fun.\"", "경력 내내 그녀는 \"과학은 탐구이고, 탐구는 재미있다.\"라는 아인슈타인의 조언을 실천했다.", "2026-평가원-6월", ""]]}]}, {"q": "35", "t": "무관한 문장", "items": [{"w": "serve as", "ipa": "sɜːrv æz", "m": "phr. ~의 역할을 하다, ~으로 쓰이다", "d": [["phr.", "to be used for a particular purpose or have a particular function", "특정 목적으로 사용되거나 특정 기능을 하다"]], "et": "servire (섬기다, 봉사하다) + as (~로서)", "ex": "~로서 쓰이며 봉사하다", "g": [["유의어", "act as (~의 역할을 하다), function as (~로 기능하다), work as (~로 일하다)"], ["파생어", "service ⓝ 서비스, 봉사"]], "c": ["serve as a context (환경의 역할을 하다)", "serve as a reminder (상기시켜 주는 역할을 하다)", "serve as a cue (단서 역할을 하다)"], "s": [["Social media serves as an important context to facilitate autobiographical remembering.", "소셜 미디어는 자전적 기억을 촉진하는 중요한 환경의 역할을 한다.", "본문", ""], ["Hallways serve as critical evacuation routes during emergencies, and anything left there could block the way and pose serious safety risks.", "복도는 비상시 중요한 대피로 역할을 하므로, 그곳에 놓아둔 물건은 무엇이든 길을 막아 심각한 안전 위험을 일으킬 수 있습니다.", "2025-고2-교육청-3월", ""], ["The dish you start with serves as an anchor food for your entire meal.", "당신이 처음 먹는 음식은 식사 전체의 기준이 되는 음식 역할을 한다.", "2020-고1-교육청-6월", ""]]}, {"w": "context", "ipa": "ˈkɑːntekst", "m": "ⓝ 맥락, 문맥; 환경, 상황", "d": [["ⓝ", "the situation or background in which something happens; the words around a word that help explain its meaning", "어떤 일이 일어나는 상황이나 배경; 어떤 단어의 의미를 설명해 주는 주변의 말"]], "et": "con (함께) + texere (짜다)", "ex": "함께 짜여 있는 배경", "g": [["유의어", "background (배경), setting (환경), situation (상황), environment (환경)"], ["파생어", "contextual ⓐ 맥락상의"]], "c": ["in this context (이런 맥락에서)", "out of context (맥락에서 벗어난)", "cultural context (문화적 맥락)"], "s": [["Social media serves as an important context to facilitate autobiographical remembering.", "소셜 미디어는 자전적 기억을 촉진하는 중요한 환경의 역할을 한다.", "본문", ""], ["We need to understand at least some of the context before we can discuss the change and take appropriate action.", "우리는 그 변화를 논의하고 적절한 조치를 취하기 전에 최소한 맥락의 일부라도 이해할 필요가 있다.", "2025-고1-교육청-10월", ""], ["Without the context provided by cells, organisms, social groups, and culture, DNA is inert.", "세포, 유기체, 사회 집단, 문화가 제공하는 맥락이 없으면 DNA는 아무 작용도 하지 않는다.", "2020-수능", ""]]}, {"w": "facilitate", "ipa": "fəˈsɪlɪteɪt", "m": "ⓥ 촉진하다, 용이하게 하다", "d": [["ⓥ", "to make an action or process easier or more likely to happen", "어떤 행동이나 과정을 더 쉽게 하거나 일어날 가능성을 더 높이다"]], "et": "facilis (쉬운) + -ate", "ex": "쉽게 만들다", "g": [["유의어", "promote (촉진하다), encourage (장려하다), help (돕다), ease (용이하게 하다)"], ["반의어", "hinder (방해하다), inhibit (억제하다), prevent (막다)"], ["파생어", "facility ⓝ 시설, 쉬움"]], "c": ["facilitate remembering (기억을 촉진하다)", "facilitate learning (학습을 촉진하다)", "facilitate communication (의사소통을 원활하게 하다)"], "s": [["Social media serves as an important context to facilitate autobiographical remembering.", "소셜 미디어는 자전적 기억을 촉진하는 중요한 환경의 역할을 한다.", "본문", ""], ["This may be because sharing memories online allows individuals to rehearse and make sense of what happened, thus facilitating long-term memory retention.", "이는 온라인에서 기억을 공유하는 것이 개인으로 하여금 일어난 일을 반복해 떠올리고 이해할 수 있게 하여, 장기 기억 유지를 촉진하기 때문일 수 있다.", "본문", ""], ["Individuals who are skilled in this domain are able to express emotions, feelings and moods accurately and thus, may facilitate clear communication between co-workers.", "이 영역에 능숙한 사람들은 감정, 느낌, 기분을 정확히 표현할 수 있어서 동료들 사이의 명확한 의사소통을 촉진할 수 있다.", "2025-수능", ""]]}, {"w": "autobiographical", "ipa": "ˌɔːtəˌbaɪəˈɡræfɪkl", "m": "ⓐ 자전적인, 자서전의", "d": [["ⓐ", "relating to or based on events in your own life", "자기 삶의 사건과 관련되거나 그에 근거한"]], "et": "auto (스스로) + bio (삶) + graphein (쓰다) + -ical", "ex": "스스로 자신의 삶을 쓴", "g": [["유의어", "personal (개인적인)"], ["대조어", "biographical (전기의, 남의 삶에 관한)"], ["파생어", "autobiography ⓝ 자서전, biography ⓝ 전기"]], "c": ["autobiographical memory (자전적 기억)", "autobiographical remembering (자전적 회상)", "an autobiographical novel (자전적 소설)"], "s": [["Social media serves as an important context to facilitate autobiographical remembering.", "소셜 미디어는 자전적 기억을 촉진하는 중요한 환경의 역할을 한다.", "본문", ""], ["This became the source of inspiration for some of her writings which included The Yearling and her autobiographical book, Cross Creek.", "이것은 『The Yearling』과 그녀의 자전적인 책 『Cross Creek』을 포함한 그녀의 몇몇 작품에 영감의 원천이 되었다.", "2019-수능", ""], ["In trying to explain how different disciplines attempt to understand autobiographical memory the literary critic Daniel Albright said, \"Psychology is a garden, literature is a wilderness.\"", "서로 다른 학문 분야가 자전적 기억을 어떻게 이해하려 하는지 설명하면서, 문학 평론가 Daniel Albright는 \"심리학은 정원이고, 문학은 황야이다.\"라고 말했다.", "2023-평가원-9월", ""]]}, {"w": "platform", "ipa": "ˈplætfɔːrm", "m": "ⓝ (온라인) 플랫폼, 기반; 승강장; 연단", "d": [["ⓝ", "a system or service that allows people to share or use content; a raised area for passengers or speakers", "사람들이 콘텐츠를 공유하거나 사용할 수 있게 해 주는 시스템이나 서비스;  "우리 몸은 끊임없이 항상성을 추구하는데, 항상성은 신체 기능의 균형으로 정의된다.", "2024-고2-교육청-10월", ""]]}, {"w": "inaccessible", "ipa": "ˌɪnækˈsesəbl", "m": "ⓐ 접근할 수 없는, 이용할 수 없는; 이해하기 어려운", "d": [["ⓐ", "impossible or very difficult to reach, use, or understand", "도달하거나 사용하거나 이해하는 것이 불가능하거나 매우 어려운"]], "et": "in (부정) + ad (~로) + cedere (가다) + -ible", "ex": "가까이 다가갈 수 없는", "g": [["유의어", "unavailable (이용할 수 없는), out of reach (손이 닿지 않는), lost (잃어버린)"], ["반의어", "accessible (접근 가능한), available (이용 가능한)"], ["파생어", "access ⓝ 접근 ⓥ 접근하다"]], "c": ["become inaccessible (접근할 수 없게 되다)", "inaccessible to (~가 접근할 수 없는)", "have access to (~에 접근할 수 있다)"], "s": [["As a result, event details shared on social media are likely stabilized and remembered over time, whereas those not shared may become inaccessible or forgotten.", "그 결과, 소셜 미디어에 공유된 사건의 세부 사항은 시간이 지나면서 안정화되고 기억될 가능성이 높은 반면, 공유되지 않은 것들은 접근할 수 없게 되거나 잊힐 수 있다.", "본문", ""], ["In turn, the residents may only be able to afford to live in a similar degraded neighbourhood to the one they left, with low access to green infrastructure.", "결국, 그 주민들은 녹색 기반 시설에 대한 접근성이 낮은, 그들이 떠난 곳과 비슷한 낙후된 동네에서만 살 수 있게 될지도 모른다.", "2025-고1-교육청-10월", ""], ["Because the ocean is inaccessible to us and most planktonic organisms are microscopic, our intuition is elementary compared, for example, to the intuitive understanding we have about (macroscopic) terrestrial life.", "바다는 우리가 접근할 수 없고 대부분의 플랑크톤 생물은 미세하기 때문에, 우리의 직관은 예를 들어 (육안으로 보이는) 육상 생물에 대해 우리가 가진 직관적 이해에 비해 초보적이다.", "2020-평가원-9월", ""]]}]}, {"q": "36", "t": "글의 순서", "items": [{"w": "multisensory", "ipa": "ˌmʌltiˈsensəri", "m": "ⓐ 다감각적인, 여러 감각을 사용하는", "d": [["ⓐ", "involving or using more than one of the senses", "둘 이상의 감각과 관련되거나 그것을 사용하는"]], "et": "multi (많은) + sensus (감각) + -ory", "ex": "여러 감각에 걸친", "g": [["관련어", "sensory (감각의), visual (시각의), auditory (청각의)"]], "c": ["multisensory experiences (다감각적 경험)", "multisensory learning (다감각 학습)"], "s": [["Multisensory experiences are a central part of our everyday lives, yet we often take them for granted, especially when our senses function normally or are corrected to normal with aids like glasses.", "다감각적 경험은 우리 일상생활의 중심적인 부분이지만, 특히 우리의 감각이 정상적으로 기능하거나 안경 같은 보조 기구로 정상으로 교정되어 있을 때, 우리는 종종 그것을 당연하게 여긴다.", "본문", ""], ["However, closer inspection to any, even the most ordinary experiences, reveals the remarkable multisensory world in which we live.", "그러나 어떤 경험이든, 심지어 가장 평범한 경험이라도 더 면밀히 살펴보면, 우리가 살고 있는 놀라운 다감각적 세계가 드러난다.", "본문", ""], ["But, a blind person will associate the same friend with a unique combination of experiences from their non-visual senses that act to represent that friend.", "하지만 시각 장애인은 같은 친구를, 그 친구를 나타내는 역할을 하는 비시각적 감각들로부터 얻은 경험들의 독특한 조합과 연관 지을 것이다.", "2022-고1-교육청-6월", ""]]}, {"w": "central", "ipa": "ˈsentrəl", "m": "ⓐ 중심적인, 가장 중요한; 중앙의", "d": [["ⓐ", "most important or main; in the middle of something", "가장 중요하거나 주된; 무언가의 한가운데에 있는"]], "et": "centrum (중심) + -al", "ex": "중심에 있는", "g": [["유의어", "main (주된), key (핵심적인), core (핵심의), essential (필수적인)"], ["반의어", "marginal (주변적인), minor (사소한)"], ["파생어", "center ⓝ 중심, centralize ⓥ 중앙에 집중시키다"]], "c": ["a central part of (~의 중심적인 부분)", "play a central role in (~에서 중심적인 역할을 하다)", "central idea (중심 생각)"], "s": [["Multisensory experiences are a central part of our everyday lives, yet we often take them for granted, especially when our senses function normally or are corrected to normal with aids like glasses.", "다감각적 경험은 우리 일상생활의 중심적인 부분이지만, 특히 우리의 감각이 정상적으로 기능하거나 안경 같은 보조 기구로 정상으로 교정되어 있을 때, 우리는 종종 그것을 당연하게 여긴다.", "본문", ""], ["That's a shame, because repetition is central to the process of rewiring our brains.", "그것은 유감스러운 일인데, 반복은 우리의 뇌를 재구성하는 과정의 핵심이기 때문이다.", "2021-고1-교육청-3월", ""], ["Still, we create and mindlessly adopt sharp distinctions, and those distinctions change lives far more dramatically than marginal differences ever do.", "그런데도 우리는 뚜렷한 구분을 만들고 아무 생각 없이 받아들이며, 그러한 구분은 미미한 차이보다 훨씬 더 극적으로 삶을 바꾼다.", "2025-고2-교육청-9월", ""]]}, {"w": "take ~ for granted", "ipa": "teɪk fɔːr ˈɡræntɪd", "m": " such as chewing) and the tools we use to eat influence our eating experience.", "심지어 우리가 식사하는 분위기와 음식과의 상호 작용(씹기 같은), 그리고 식사에 사용하는 도구로부터 나오는 소리조차도 우리의 식사 경험에 영향을 미친다.", "본문", ""], ["Open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust.", "예를 들어 손을 펼친 몸짓은 정직함을 나타내어 신뢰의 분위기를 만들어 낼 수 있다.", "2025-고1-교육청-3월", ""], ["Andrew arrived at the nursing home in a gloomy mood, but he was blessed with good news.", "Andrew는 우울한 기분으로 요양원에 도착했지만, 좋은 소식을 듣는 축복을 받았다.", "2018-평가원-6월", ""]]}, {"w": "interaction", "ipa": "ˌɪntərˈækʃn", "m": "ⓝ 상호 작용, 교류", "d": [["ⓝ", "the action of communicating with or affecting each other", "서로 소통하거나 영향을 주고받는 행위"]], "et": "inter (사이에) + agere (행하다) + -tion", "ex": "서로 사이에서 작용함", "g": [["유의어", "communication (의사소통), contact (접촉), exchange (교류)"], ["파생어", "interact ⓥ 상호 작용하다, interactive ⓐ 상호적인"]], "c": ["interactions with the food (음식과의 상호 작용)", "social interaction (사회적 교류)", "interact with (~와 상호 작용하다)"], "s": [["Even the sounds that come both from the atmospheres in which we eat and our interactions with the food (such as chewing) and the tools we use to eat influence our eating experience.", "심지어 우리가 식사하는 분위기와 음식과의 상호 작용(씹기 같은), 그리고 식사에 사용하는 도구로부터 나오는 소리조차도 우리의 식사 경험에 영향을 미친다.", "본문", ""], ["My two girls grew up without challenges with respect to development and social interaction.", "우리 두 딸은 발달과 사회적 상호 작용 면에서 아무 어려움 없이 자랐다.", "2024-고2-교육청-9월", ""], ["You have to interact with them, and their responses can be unpredictable.", "당신은 그들과 상호 작용해야 하며, 그들의 반응은 예측할 수 없을 수 있다.", "2021-고1-교육청-6월", ""]]}, {"w": "chew", "ipa": "tʃuː", "m": "ⓥ 씹다", "d": [["ⓥ", "to crush food into smaller pieces with your teeth", "이로 음식을 더 작은 조각으로 부수다"]], "et": "ceowan (고대 영어: 씹다)", "ex": "이로 씹다", "g": [["유의어", "bite (물다)"], ["관련어", "swallow (삼키다)"]], "c": ["chew food (음식을 씹다)", "chew gum (껌을 씹다)", "chew one's food well (음식을 잘 씹다)"], "s": [["Even the sounds that come both from the atmospheres in which we eat and our interactions with the food (s rinciple of opposites (반대말의 원리)", "basic principles (기본 원리)", "in principle (원칙적으로)", "a man of principle (원칙을 지키는 사람)"], "s": [["As children, the principle of opposites is foreign.", "어린 시절에는 반대말의 원리가 생소하다.", "본문", ""], ["In economics, there is a principle known as the sunk cost fallacy.", "경제학에는 매몰 비용 오류라고 알려진 원리가 있다.", "2023-평가원-6월", ""], ["Human speech builds on the principle of combining a restricted number of sounds into an unlimited number of messages.", "인간의 말은 제한된 수의 소리를 결합하여 무한한 수의 메시지를 만드는 원리에 기반한다.", "2025-평가원-9월", ""]]}, {"w": "opposite", "ipa": "ˈɑːpəzət", "m": "ⓝ 반대(되는 것), 반의어 ⓐ 반대의, 맞은편의", "d": [["ⓝ", "a person or thing that is completely different from another", "다른 것과 완전히 다른 사람이나 사물"], ["ⓐ", "completely different; on the other side", "완전히 다른; 반대편에 있는"]], "et": "ob (~에 맞서) + ponere (놓다)", "ex": "맞은편에 맞서 놓인", "g": [["유의어", "reverse (반대), contrary (반대의), contrasting (대조적인)"], ["반의어", "same (같은), similar (비슷한)"], ["파생어", "oppose ⓥ 반대하다, opposition ⓝ 반대"]], "c": ["the opposite of (~의 반대)", "the opposite direction (반대 방향)", "on the opposite side (맞은편에)"], "s": [["For many children, for instance, it is not clear that 'Right' is the opposite of 'Left'.", "예를 들어, 많은 아이들에게 '오른쪽'이 '왼쪽'의 반대라는 것은 분명하지 않다.", "본문", ""], ["Despite the cultural trope depicting emotions as the opposite of rational thought, cognition — what we commonly refer to as thinking — is actually a key building block of emotion.", "감정을 이성적 사고의 반대로 묘사하는 문화적 비유에도 불구하고, 인지, 즉 우리가 흔히 '생각'이라고 부르는 것은 사실 감정의 핵심 구성 요소이다.", "2025-고1-교육청-10월", ""], ["The old saying is that \"knowledge is power,\" but when it comes to scary, threatening news, research suggests the exact opposite.", "옛말에 '아는 것이 힘'이라고 하지만, 무섭고 위협적인 뉴스에 관해서는 연구 결과가 정반대를 시사한다.", "2022-고1-교육청-11월", ""]]}, {"w": "foreign", "ipa": "ˈfɔːrən", "m": "ⓐ 생소한, 이질적인; 외국의", "d": [["ⓐ", "strange or unfamiliar; from or relating to another country", "낯설거나 익숙하지 않은; 다른 나라에서 온, 또는 다른 나라와 관련된"]], "et": "foris (문밖에)", "ex": "문밖의, 바깥의 → 낯선", "g": [["유의어", "unfamiliar (익숙하지 않은), strange (낯선), unknown (알려지지 않은), alien (이질적인)"], ["반의어", "familiar (익숙한), native (토박이의), domestic (국내의)"], ["파생어", "foreigner ⓝ 외국인"]], "c": ["be foreign to (~에게 생소하다)", "foreign language (외국어)", "foreign cultures (외국 문화)"], "s": [["As children, the principle of opposites is foreign.", "어린 시절에는 반대말의 원리가 생소하다.", "본문", ""], ["new foreign cultures as a replacement for Rome's tradition", "로마의 전통을 대체한 새로운 외국 문화", "2025-고1-교육청-10월", ""], ["If this view is correct, we should have difficulty interpreting the emotions expressed in culturally unfamiliar music.", "이 견해가 옳다면, 우리는 문화적으로 낯선 음악에 표현된 감정을 해석하는 데 어려움을 겪을 것이다.", "2020-고1-교육청-9월", ""]]}, {"w": "perceive", "ipa": "pərˈsiːv", "m": "ⓥ 인식하다, 지각하다; ~로 여기다", "d": [["ⓥ", "to notice or become aware of something; to understand or think of something in a particular way", "무언가를 알아차리거나 인식하게 되다; 무언가를 특정한 방식으로 이해하거나 생각하다"]], "et": "per (완전히) + capere (잡다)", "ex": "완전히 붙잡아 알아차리다", "g": [["유의어", "recognize (인식하다), notice (알아차리다), regard (여기다), view (보다)"], ["파생어", "perception ⓝ 인식, 지각"]], "c": ["perceive A as B (A를 B로 인식하다)", "as perceived by (~가 인식하는 대로)", "be perceived to be (~로 여겨지다)"], "s": [["Children perceive words and their meanings separately from each other.", "아이들은 단어와 그 의미들을 서로 분리하여 인식한다.", "본문", ""], ["Restricted time and the requirement to report may be perceived as obstacles that make it impossible to deliver the service that is needed.", "제한된 시간과 보고 의무는 필요한 서비스를 제공하는 것을 불가능하게 만드는 장애물로 인식될 수 있다.", "2024-고2-교육청-3월", ""], ["This implies that the cognitive association of objects to color influences how we perceive that color.", "이것은 사물과 색깔 사이의 인지적 연관이 우리가 그 색깔을 지각하는 방식에 영향을 미친다는 것을 암시한다.", "2024-고2-교육청-10월", ""]]}, {"w": "separately", "ipa": "ˈseprətli", "m": "ad. 따로, 분리하여, 별도로", "d": [["ad.", "apart from others; not together", "다른 것들과 떨어져서; 함께가 아니라"]], "et": "se (떨어져) + parare (준비하다, 마련하다) + -ly", "ex": "떨어뜨려 따로 마련하여", "g": [["유의어", "individually (개별적으로), independently (독립적으로), apart (따로)"], ["반의어", "together (함께), jointly (공동으로)"], ["파생어", "separate ⓥ 분리하다 ⓐ 분리된, separation ⓝ 분리"]], "c": ["separately from (~와 분리하여)", "be sold separately (별도로 판매되다)", "separate A from B (A를 B와 분리하다)"], "s": [["Children perceive words and their meanings separately from each other.", "아이들은 단어와 그 의미들을 서로 분리하여 인식한다.", "본문", ""], ["In Peru, the government grants water to communities separately from land, and it is up to the community to allocate it.", "페루에서는 정부가 토지와 별도로 지역 사회에 물을 부여하며, 그것을 배분하는 것은 지역 사회의 몫이다.", "2021-평가원-6월", ""], ["He would offer them whatever he was given and they would eat it together.", "그는 자신이 받은 것은 무엇이든 그들에게 내주었고 그들은 그것을 함께 먹곤 했다.", "2021-고1-교육청-11월", ""]]}, {"w": "development", "ipa": "dɪˈveləpmənt", "m": "ⓝ 발달, 발전, 개발", "d": [["ⓝ", "the process of growing or changing into a more advanced form", "더 발전된 형태로 자라거나 변화하는 과정"]], "et": "de (반대로, 풀어) + voloper (감싸다) + -ment", "ex": "감싸여 있던 것을 풀어 펼침", "g": [["유의어", "growth (성장), progress (진보), advancement (발전)"], ["반의어", "decline (쇠퇴)"], ["파생어", "develop ⓥ 발달하다, 개발하다, developing ⓐ 개발 중인"]], "c": ["later development (이후의 발달)", "child development (아동 발달)", "sustainable development (지속 가능한 발전)"], "s": [["It is only in later development that we understood that individual words directly connect to one another.", "개별 단어들이 서로 직접적으로 연결된다는 것을 우리가 이해한 것은 바로 이후의 발달 단계에서였다.", "본문", ""], ["The development of agriculture changed work patterns.", "농업의 발달은 노동 방식을 바꾸었다.", "2023-고1-교육청-6월", ""], ["Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter.", "연구 옹호자들은 동물 실험의 관행과 의학의 발전 사이에 강한 상관관계가 있으므로 전자가 후자를 초래했다고 주장해 왔다.", "2025-고1-교육청-9월", ""]]}, {"w": "individual", "ipa": "ˌɪndɪˈvɪdʒuəl", "m": "ⓐ 개별의, 개인의 ⓝ 개인", "d": [["ⓐ", "single and separate; relating to one person", "하나이고 따로 떨어진; 한 사람과 관련된"], ["ⓝ", "a single person", "한 사람"]], "et": "in (부정) + dividuus (나눌 수 있는)", "ex": "더 이상 나눌 수 없는 하나", "g": [["유의어", "single (하나의) ", "disconnect (연결을 끊다), separate (분리하다)"], ["파생어", "connection ⓝ 연결, 관련성"]], "c": ["connect to/with (~와 연결되다)", "the connection between A and B (A와 B 사이의 연관성)", "recognize the connection (연관성을 깨닫다)"], "s": [["It is only in later development that we understood that individual words directly connect to one another.", "개별 단어들이 서로 직접적으로 연결된다는 것을 우리가 이해한 것은 바로 이후의 발달 단계에서였다.", "본문", ""], ["It's easy to connect with someone and then let the relationship get stuck due to a lack of follow-up.", "누군가와 관계를 맺은 뒤 후속 연락의 부족으로 그 관계가 정체되게 두기는 쉽다.", "2025-고1-교육청-10월", ""], ["Only later did we recognize the connection and understand that we should continue eating, but not with our hands but with a fork or a spoon.", "나중에서야 우리는 그 연관성을 깨닫고, 계속 먹어야 하지만 손이 아니라 포크나 숟가락으로 먹어야 한다는 것을 이해했다.", "본문", ""]]}, {"w": "apply", "ipa": "əˈplaɪ", "m": "ⓥ 적용되다, 적용하다; 지원하다; (크림 등을) 바르다", "d": [["ⓥ", "to be relevant to a person or situation; to use something in a situation; to make a formal request", "어떤 사람이나 상황에 해당되다; 어떤 상황에 무언가를 사용하다; 공식적으로 요청하다"]], "et": "ad (~에) + plicare (접다, 붙이다)", "ex": "~에 갖다 붙이다", "g": [["유의어", "be true of (~에도 해당되다), hold true (사실이다, 들어맞다), be relevant (관련되다), use (사용하다)"], ["파생어", "application ⓝ 적용, 지원(서), applicant ⓝ 지원자"]], "c": ["apply to (~에 적용되다)", "apply for (~에 지원하다)", "apply A to B (A를 B에 적용하다)"], "s": [["The same applies to the logical connection between 'Yes' and 'No' as perceived by parents.", "부모가 인식하는 'Yes'와 'No' 사이의 논리적 연관성에도 똑같은 것이 적용된다.", "본문", ""], ["You can apply this strategy in your own life anytime you notice signs of stress.", "스트레스의 징후를 알아차릴 때마다 당신은 이 전략을 자신의 삶에 적용할 수 있다.", "2024-평가원-9월", ""], ["Many of the first models of cultural evolution drew noticeable connections between culture and genes by using concepts from theoretical population genetics and applying them to culture.", "문화 진화에 관한 초기 모델의 상당수는 이론 집단 유전학의 개념을 사용하여 그것을 문화에 적용함으로써 문화와 유전자 사이에 주목할 만한 연관성을 끌어냈다.", "2023-고1-교육청-11월", ""]]}, {"w": "logical", "ipa": "ˈlɑːdʒɪkl", "m": "ⓐ 논리적인, 타당한", "d eep doing something without stopping; to keep happening", "멈추지 않고 무언가를 계속하다; 계속 일어나다"]], "et": "con (함께) + tenere (붙잡다)", "ex": "계속 붙잡고 이어 가다", "g": [["유의어", "carry on (계속하다), go on (계속하다), keep (계속 ~하다), persist (지속되다)"], ["반의어", "stop (멈추다), quit (그만두다)"], ["파생어", "continuous ⓐ 끊임없는"]], "c": ["continue -ing / to do (계속 ~하다)", "continue riding (계속 달리다)", "continue to grow (계속 성장하다)"], "s": [["If parents tell their child \"Don't go to the left,\" they will often find that the child will continue riding straight ahead and not automatically turn to the right.", "부모가 아이에게 \"왼쪽으로 가지 마.\"라고 말하면, 그들은 종종 아이가 자동으로 오른쪽으로 방향을 틀지 않고 계속 앞으로 곧장 달리는 것을 보게 될 것이다.", "본문", ""], ["Kinship ties continue to be important today.", "친족 간의 유대는 오늘날에도 계속 중요하다.", "2022-평가원-6월", ""], ["And with appropriate support, they believe students will continue to work until their performance is satisfactory.", "그리고 적절한 지원이 있으면, 학생들은 자신의 성과가 만족스러울 때까지 계속 노력할 것이라고 그들은 믿는다.", "2021-고1-교육청-6월", ""]]}, {"w": "automatically", "ipa": "ˌɔːtəˈmætɪkli", "m": "ad. 자동으로, 저절로, 무의식적으로", "d": [["ad.", "without needing a person to operate it; without thinking about it", "사람이 조작할 필요 없이; 생각하지 않고"]], "et": "automatos (그리스어: 스스로 움직이는) + -ally", "ex": "스스로 저절로", "g": [["유의어", "instinctively (본능적으로), unconsciously (무의식적으로)"], ["반의어", "manually (수동으로), consciously (의식적으로), deliberately (의도적으로)"], ["파생어", "automatic ⓐ 자동의, automation ⓝ 자동화"]], "c": ["not automatically turn (저절로 방향을 틀지 않다)", "automatically save (자동으로 저장하다)", "happen automatically (저절로 일어나다)"], "s": [["If parents tell their child \"Don't go to the left,\" they will often find that the child will continue riding straight ahead and not automatically turn to the right.", "부모가 아이에게 \"왼쪽으로 가지 마.\"라고 말하면, 그들은 종종 아이가 자동으로 오른쪽으로 방향을 틀지 않고 계속 앞으로 곧장 달리는 것을 보게 될 것이다.", "본문", ""], ["It's like we all automatically accept that the \"right\" way is, inevitably, the harder one.", "마치 우리 모두가 '올바른' 방법은 필연적으로 더 어려운 방법이라고 자동으로 받아들이는 것과 같다.", "2022-고1-교육청-11월", ""], ["When you deci 관에 부합하는 기관과 거래하기를 원한다.", "2025-고1-교육청-10월", ""]]}, {"w": "shape", "ipa": "ʃeɪp", "m": "ⓥ 형성하다, 만들다 ⓝ 모양, 형태; 상태", "d": [["ⓥ", "to influence how something develops; to give something a particular form", "무언가가 발달하는 방식에 영향을 주다; 무언가에 특정한 형태를 주다"], ["ⓝ", "the outer form of something; condition", "무언가의 외형; 상태"]], "et": "gesceap (고대 영어: 창조물, 형태)", "ex": "모양을 빚어 만들다", "g": [["유의어", "form (형성하다), determine (결정하다), influence (영향을 미치다)"]], "c": ["be shaped by (~에 의해 형성되다)", "shape one's future (미래를 만들어 가다)", "in good shape (좋은 상태인)"], "s": [["We still think and act in ways that are in harmony with others around us, but it is through patterns that are more shaped by nurture, not just nature.", "우리는 여전히 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 본성뿐만 아니라 양육에 의해 더 많이 형성되는 패턴을 통해서이다.", "본문", ""], ["How we think about our circumstances shapes the emotions we experience; then those emotions echo back to influence how we think.", "우리가 자신의 상황에 대해 어떻게 생각하는지가 우리가 경험하는 감정을 형성하고, 그런 다음 그 감정은 되돌아와 우리가 생각하는 방식에 영향을 미친다.", "2025-고1-교육청-10월", ""], ["What's fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.", "흥미로운, 혹은 어쩌면 불안한 점은 이 순환이 우리의 욕망을 형성하는 데 있어 완벽하게 효과적이라는 것이다.", "2024-고2-교육청-10월", ""]]}, {"w": "nurture", "ipa": "ˈnɜːrtʃər", "m": "ⓝ 양육, 환경(적 요인) ⓥ 양육하다, 기르다, 육성하다", "d": [["ⓝ", "the care and influence of the environment on a person's development", "사람의 발달에 미치는 보살핌과 환경의 영향"], ["ⓥ", "to take care of and help someone or something grow", "누군가나 무언가를 돌보고 자라도록 돕다"]], "et": "nutrire (먹이다, 기르다) + -ure", "ex": "먹여 기르는 일", "g": [["유의어", "care (보살핌), raise (기르다), foster (육성하다)"], ["관련어", "environment (환경), learning (학습)"], ["대조어", "nature (본성, 타고난 것)"]], "c": ["nature and nurture (본성과 양육)", "nature versus nurture (본성 대 양육)", "nurture talent (재능을 키우다)"], "s": [["We still think and act in ways that are in harmony with others around us, but it is through patterns that are more shaped by nurture, not just nature.", "우리는 여전히 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 본성뿐만 아니라 양육에 의해 더 많이 형성되는 패턴을 통해서이다.", "본문", ""], ["The interaction between nature and nurture is, however, highly complex, and developmental biologists are only just beginning to grasp just how complex it is.", "그러나 본성과 양육 사이의 상호 작용은 매우 복잡하며, 발달 생물학자들은 그것이 얼마나 복잡한지 이제 막 파악하기 시작했을 뿐이다.", "2020-수능", ""], ["When some consultants argue that successful companies foster empathy, what that translates to is that companies should conduct good market research.", "일부 컨설턴트들이 성공적인 기업은 공감을 기른다고 주장할 때, 그것이 의미하는 바는 기업이 좋은 시장 조사를 해야 한다는 것이다.", "2024-고2-교육청-3월", ""]]}]}]}]</script>
<script>
(function(){
const EXAMS = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IRR = {undergo:['underwent','undergone'],seek:['sought'],millennium:['millennia'],'tell A from B':['tell','tells','told'],
  'put ~ to shame':['put','puts','shame'],'take ~ for granted':['take','takes','took','taken','granted'],'be exposed to':['exposed'],
  'date back to':['date','dates','dated','back'],'refer to':['refer','refers','referred'],'serve as':['serve','serves','served'],
  'make sense of':['make','makes','made','sense'],'independent of':['independent'],'take hold':['take','takes','taken','took','hold'],
  'a variety of':['variety'],'building block':['building','block','blocks'],
  'be true of':['true of','true for'],"can't wait to":["can't wait to","couldn't wait to","can’t wait to","couldn’t wait to"],'face to face':['face to face','face-to-face'],phenomenon:['phenomena'],medium:['media']};
const SPEC = {take:['took','taken','taking'],tell:['told'],go:['goes','went','gone','going'],make:['made','making'],put:['putting'],seek:['sought'],criterion:['criteria'],think:['thought'],catch:['caught'],shake:['shook','shaken'],give:['gave','given'],come:['came'],become:['became'],bring:['brought'],run:['ran','running'],get:['got','gotten','getting'],set:['setting'],hold:['held'],live:['living'],carry:['carried','carries'],leave:['left','leaving'],pay:['paid'],rely:['relies','relied','reliance'],know:['known','knew'],rise:['rose','risen','rising'],can:["can't",'can’t'],lie:['lying','lay'],find:['found']};
function forms(w){
  if (IRR[w] && w.includes(' ')) return IRR[w];
  const f=new Set([w,w+'s',w+'es',w+'ed',w+'d',w+'ing',w+'ly',w+w.slice(-1)+'ed',w+w.slice(-1)+'ing',w+w.slice(-1)+'s']);
  if (w.endsWith('e')) f.add(w.slice(0,-1)+'ing');
  if (w.endsWith('y')) {f.add(w.slice(0,-1)+'ies');f.add(w.slice(0,-1)+'ied');}
  (IRR[w]||[]).forEach(x=>f.add(x));
  (SPEC[w]||[]).forEach(x=>f.add(x));
  return [...f];
}
const rx = x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function phraseRe(p){
  const ws=p.replace(/~|\bA\b|\bB\b|\bsb\b|\bsth\b|one's/g,' ').trim().split(/\s+/).filter(Boolean);
  if(!ws.length) return null;
  if(ws.length===1) return forms(ws[0]).sort((a,b)=>b.length-a.length).map(rx).join('|');
  return '(?:'+forms(ws[0]).sort((a,b)=>b.length-a.length).map(rx).join('|')+')(?:\\s+[\\w\'’-]+){0,3}?'+ws.slice(1).map(x=>'\\s+'+rx(x)).join('');
}
function relList(s){
  const out=[];let depth=0,cur='';
  for (const ch of s){ if(ch==='(')depth++; if(ch===')')depth--; if(ch===','&&depth===0){out.push(cur.trim());cur='';} else cur+=ch; }
  if(cur.trim())out.push(cur.trim());
  return out.reduce((acc,x)=>{ if(acc.length&&!/^[A-Za-z~(]/.test(x)) acc[acc.length-1]+=', '+x; else acc.push(x); return acc; },[]);
}
function relWords(it){
  const out=[];
  it.g.forEach(([lab,txt])=>{ if(lab==='혼동어')return; relList(txt).forEach(t=>{const e=t.replace(/\(.*$/,'').replace(/\s+(ⓝ|ⓥ|ⓐ|ad\.|prep\.).*$/,'').trim(); if(e&&/^[a-zA-Z][a-zA-Z' -]*$/.test(e)) out.push(e);}); });
  return out;
}
const STOPF=['take','takes','took','taken','make','makes','made','put','puts','date','dates','dated','back','tell','tells','told','serve','serves','served','refer','refers','referred','hold','building'];
function hl(text,it){
  let h=esc(text);
  const parts=[];
  if(it.w.includes(' ')){ const pr=phraseRe(it.w); if(pr) parts.push(pr); const irr=(IRR[it.w]||[]).filter(x=>!STOPF.includes(x)).map(rx).join('|'); if(irr) parts.push(irr); }
  else parts.push(phraseRe(it.w));
  const mre = new RegExp('\\b('+parts.join('|')+')(?![\\w])','gi');
  h = h.replace(mre,'\u0001$1\u0002');
  const rel = relWords(it).map(phraseRe).filter(Boolean);
  if(rel.length){ const rre=new RegExp('\\b('+rel.join('|')+')\\b(?![^\\u0001]*\\u0002)','gi'); h=h.replace(rre,'\u0003$1\u0004'); }
  return h.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\u0003/g,'<mark class="r">').replace(/\u0004/g,'</mark>');
}
const CLS = {'유의어':'syn','반의어':'ant','파생어':'der','대조어':'oth','관련어':'oth','혼동어':'oth'};
function relItem(t){
  const m=t.match(/^(.*?)\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)\s*$/);
  if(m) return '<li><span class="ent">'+esc(m[1])+'</span> <span class="ko">'+esc(m[2])+'</span></li>';
  const d=t.match(/^(\S+(?: \S+)?)\s+((?:ⓝ|ⓥ|ⓐ|ad\.|prep\.).*)$/);
  if(d) return '<li><span class="ent">'+esc(d[1])+'</span> <span class="ko">'+esc(d[2])+'</span></li>';
  return '<li><span class="ent">'+esc(t)+'</span></li>';
}
function card(it,i,q){
  const defs = it.d.map(([p,en,ko])=>'<div class="def"><span class="en">'+esc(en)+'</span><br><span class="k">'+esc(ko)+'</span></div>').join('');
  const rel = it.g.map(([lab,txt])=>'<div class="rrow"><span class="lab '+(CLS[lab]||'oth')+'">'+esc(lab)+'</span><ul>'+relList(txt).map(relItem).join('')+'</ul></div>').join('')
    + (it.c.length?'<div class="rrow"><span class="lab col">연어</span><ul>'+it.c.map(relItem).join('')+'</ul></div>':'');
  const exs = it.s.map(([en,ko,b])=>{
    const tag = b ? '<span class="src '+(b==='본문'?'pass':'gi')+'">'+esc(b)+'</span>' : '';
    return '<div class="exi"><div><div class="exen">'+tag+hl(en,it)+'</div><div class="exko">'+esc(ko)+'</div></div></div>';
  }).join('');
  return '<article class="card" data-s="'+esc((it.w+' '+it.m).toLowerCase())+'">'
    +'<div><div class="no">'+q+'번 · '+String(i+1).padStart(2,'0')+'</div><div class="head"><span class="word">'+esc(it.w)+'</span><span class="ipa">['+esc(it.ipa)+']</span></div>'
    +'<div class="mean">'+esc(it.m)+'</div>'+defs
    +'<div class="ety"><b>어원</b>'+esc(it.et)+(it.ex?'<br>➔ '+esc(it.ex):'')+'</div></div>'
    +'<div class="rel">'+rel+'</div><div class="exs">'+exs+'</div></article>';
}
function secHtml(sec){
  const [typ,ttl]=sec.t.split(' · ');
  return '<section class="qsec" data-q="'+sec.q+'"><div class="qhead"><span class="qno">'+sec.q+'<small>번</small></span><span class="qtitle"><span class="typ">'+esc(typ)+'</span>'+esc(ttl||'')+'</span><span class="qcnt">'+sec.items.length+'단어</span></div><div class="list">'+sec.items.map((it,i)=>card(it,i,sec.q)).join('')+'</div></section>';
}
let ex=EXAMS[0], cur='all';
$('#exams').innerHTML=EXAMS.map(e=>'<button class="exam" data-e="'+e.id+'" aria-pressed="false">'+esc(e.label)+'</button>').join('');
function renderExam(){
  $('#main').innerHTML=ex.secs.map(secHtml).join('');
  const n=ex.secs.reduce((a,s)=>a+s.items.length,0);
  $('#sub').textContent=ex.label+' 전국연합학력평가 · '+ex.range+' · '+ex.secs.length+'문항 '+n+'단어 · 발음, 뜻과 영영 풀이, 어원, 유의어·반의어·파생어, 연어, 예문 3개';
  $('#tabs').innerHTML='<button class="tab" data-q="all" aria-pressed="true">전체</button>'+ex.secs.map(s=>'<button class="tab" data-q="'+s.q+'" aria-pressed="false">'+s.q+'번</button>').join('');
  document.querySelectorAll('.exam').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.e===ex.id)));
}
function apply(){
  const term=$('#q').value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('section.qsec').forEach(sec=>{
    const inQ = cur==='all'||sec.dataset.q===cur; let n=0;
    sec.querySelectorAll('article.card').forEach(c=>{const ok=inQ&&(!term||c.dataset.s.includes(term)); c.classList.toggle('hidden',!ok); if(ok)n++;});
    sec.classList.toggle('hidden',n===0); shown+=n;
  });
  $('#empty').classList.toggle('hidden',shown>0);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.q===cur)));
}
function go(eid,q,push){
  const e=EXAMS.find(x=>x.id===eid)||EXAMS[0];
  if(e!==ex||!$('#main').children.length){ex=e;renderExam();}
  cur=(q&&ex.secs.some(s=>s.q===q))?q:'all'; apply();
  if(push){ try{history.replaceState(null,'','#'+ex.id+(cur==='all'?'':'-q'+cur));}catch(err){} }
  window.scrollTo({top:0});
}
$('#exams').addEventListener('click',e=>{const b=e.target.closest('.exam'); if(b) go(b.dataset.e,'all',true);});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b) go(ex.id,b.dataset.q,true);});
$('#q').addEventListener('input',apply);
const fromHash=()=>{const m=location.hash.match(/^#([\w]+-\d+)(?:-q(\d\d))?$/); go(m?m[1]:EXAMS[0].id,m?m[2]:'all',false);};
window.addEventListener('hashchange',fromHash); fromHash();
$('#quiz').addEventListener('click',e=>{const on=!document.body.classList.contains('quiz'); document.body.classList.toggle('quiz',on); e.currentTarget.setAttribute('aria-pressed',String(on)); document.querySelectorAll('.revealed').forEach(x=>x.classList.remove('revealed'));});
$('#main').addEventListener('click',e=>{ if(!document.body.classList.contains('quiz'))return; const t=e.target.closest('.mean,.def .k,.exko,.rrow .ko'); if(t) t.classList.toggle('revealed');});
})();
